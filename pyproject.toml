[build-system]
requires = ["setuptools", "wheel", "cython==3.0.12", "numpy>=1.24,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "fragnnet"
version = "2025.06.0.dev"
description = "MS/MS prediction for small molecules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10, <=3.12"

dependencies = [
    "numpy>=1.24,<2",
    "cython==3.0.12",
    "pandas==2.2.3",
    "rdkit==2022.09.4",
    "tqdm",
    "scipy",
    "scikit-learn",
    "joblib>=1.3.2",
    "matplotlib",
    "pyteomics",
    "omegaconf"
]

[project.optional-dependencies]
# development dependency groups
dev = [
    "wandb",
    "notebook",
    "ipywidgets",
    "CairoSVG"
]

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
fragnnet = ["*.pyx", "*.pxd", "*.c", "*.h"]

