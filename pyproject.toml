[build-system]
requires = ["setuptools", "wheel", "cython>=3.0.11", "numpy>=1.24,<2","cysignals"]
build-backend = "setuptools.build_meta"

[project]
name = "frag_gnn"
version = "2025.0.1"
description = "Fragmentation prediction for small molecules"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "cython>=3.0.11",
    "cysignals",
    "rdkit>=2023.9.5",
    "pandas",
    "networkx",
    "tqdm",
    "scipy",
    "scikit-learn",
    "Deprecated",
    "future",
    "joblib>=1.3.2",
    "matplotlib",
    "pyteomics"
]

[project.scripts]
install-cuda = "install_cuda:main"

[project.optional-dependencies]
# development dependency groups
dev = [
    "wandb",
    "pytest"
]

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
frag_gnn = ["*.pyx", "*.pxd", "*.c", "*.h"]
