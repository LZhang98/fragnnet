[build-system]
requires = ["setuptools", "wheel", "cython==3.0.12", "numpy>=1.24,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "fragnnet"
version = "2025.06.0.dev"
description = "MS/MS prediction for small molecules"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"

dependencies = [
    "numpy>=1.24,<2",
    "pandas==2.2.3",
    "rdkit>=2022.09.4, <=2023.09.5",
    "tqdm",
    "scipy==1.15.2",
    "joblib>=1.3.2",
    "torch==2.4.1",
    "lightning==2.4.0",
    "torch_geometric==2.6.1",
    "torch_scatter==2.1.2",
    "matplotlib",
    "pyteomics",
    "h5py",
    "pandarallel",
    "pyopenms",
    # imported by core at module level; previously only pulled in by other packages
    "pyyaml",
    "networkx",
    "pillow",
]

[project.optional-dependencies]
# development dependency groups
dev = [
    "wandb",
    "notebook",
    "ipywidgets",
    "CairoSVG",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "isort>=5.12",
    "pre-commit>=3.0",
    # six tests load scripts that import it
    "scikit-learn",
    # `python setup.py build_ext --inplace` rebuilds the extensions in the environment;
    # `pip install` gets Cython from [build-system] instead
    "cython==3.0.12",
]

# analysis and evaluation scripts under scripts/
scripts = [
    "scikit-learn",
]

speed = [
    "torch-linear-assignment"
]

# PyG extensions of the reference environment; not on PyPI, so only uv installs them from here.
# PyG routes CUDA max/min scatter through torch_scatter when installed (INSTALL.md).
[dependency-groups]
pyg = [
    "pyg_lib==0.4.0",
]

# uv only (pip ignores this). The lock targets Linux x86_64 with torch 2.4.1+cu121, the
# reference FRAGNNET-GPU build; other builds use `uv pip install` (INSTALL.md).
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]
default-groups = ["pyg"]
constraint-dependencies = [
    # rdkit of the reference environment; it has no Python 3.12 wheel
    "rdkit==2022.9.5; python_version < '3.12'",
    # pinned by the env/ and cluster scripts; wandb 0.24 has upload bugs
    "wandb==0.21.2",
    "joblib==1.3.2",
    "pandarallel==1.6.5",
    "pyteomics==4.7.5",
]
# rebuild the Cython extensions when a .pyx changes
cache-keys = [{ file = "pyproject.toml" }, { file = "setup.py" }, { file = "src/**/*.pyx" }]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torch_scatter = { index = "pyg-cu121" }
pyg_lib = { index = "pyg-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pyg-cu121"
url = "https://data.pyg.org/whl/torch-2.4.1+cu121.html"
format = "flat"
explicit = true

[tool.setuptools]
packages = { find = { where = ["src"] } }
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.package-data]
fragnnet = ["*.pyx", "*.pxd", "*.c", "*.h"]
"fragnnet.models.masster.candidates" = ["*.cu"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "wandb",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "NPY",    # NumPy-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict parameter
    "C901",   # too complex
    "ARG002", # unused method argument
    "ARG001", # unused function argument
    "ARG005", # unused lambda argument (uniform-signature dispatch tables)
    "SIM108", # use ternary operator instead of if-else
    "COM812",  # missing-trailing-comma
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # blank line required before class docstring
    "D211",    # no-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "EM101",   # raw-string-in-exception
    "FIX002",  # line-contains-todo
    "ISC001",  # Conflicts with formatter ruff
    "PLR0904", # Too many public methods (... > 20)
    "TD002",   # Missing author in TODO `# TODO(<author_name>): ...`
    "TD003",   # missing-todo-link
    "TRY003",  # raise-vanilla-args
]
fixable = ["ALL"]
unfixable = [
    "D",  # Don't fix docstyle from others
    "I",  # we run isort separately
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = ["ARG", "B"]  # allow unused args and other patterns in tests
"test_*.py" = [
    "S101",    # asserts allowed in tests...
    "ARG",     # Unused function args -> fixtures nevertheless are functionally relevant...
    "FBT",     # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "PLR2004", # Magic value used in comparison, ...
    "S311",    # Standard pseudo-random generators are not suitable for cryptographic purposes
]
"preproc_scripts/**/*.py" = ["B", "SIM"]  # more lenient for scripts
"scripts/**/*.py" = ["B", "SIM"]
"*.ipynb" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["fragnnet"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.10"
# Reduce noise from third-party libraries without stubs during
# early development. These settings can be tightened progressively.
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
no_implicit_optional = false
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
strict_equality = false

[tool.black]
line-length = 100
target-version = ['py310','py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

