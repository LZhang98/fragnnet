# Arm e6 -- the 2026-09-22 ring-topology graph features AND the pooled cut-bond features, so the
# new BOND features can reach the head that allocates intensity. From c4a_base_s1, this changes
# the mol_params feature lists (as in c4a_ring_topology) plus adds the
# `c_cut_bonds` list entry.
#
# Why this arm exists. `b_ring_size` and `b_fused_ring` enter the model as bond attributes, and
# the intensity head's boundary block is built from ATOM ENDPOINT embeddings -- `_boundary_
# embeddings` never reads `chemical_bond_attr`. An internal atom mixes all of its incident bonds
# into one state, so for an endpoint of degree > 1 those two new features do NOT cleanly reach the
# candidate token. `c4a_ring_topology` therefore tests them in the GNN and the proposal head only.
# This arm pools them into the token as well, where the summed half becomes "how many of the cut
# bonds were 6-ring bonds / fused bonds" -- the quantity the ring features were added for.
#
# Read it as a ladder, not a single diff:
#   c4a_ring_topology - c4a_base_s1   the features in the encoder and proposal.
#   e6 - c4a_ring_topology            what routing them into the intensity token adds.
#   e6 - e1_cut_bond_feats            what the richer bond vocabulary adds to the same routing.
# Running e6 without c4a_ring_topology confounds the two, so submit both or neither.
#
# Cost: bond width 9 -> 16, so the cut-bond block is 2 x 16 = 32 columns and the token is
# 1,285 -> 1,317. Same 3g.40gb profile and 128-epoch box as every other arm in this family.
