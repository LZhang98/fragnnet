# Arm g1 -- one 5-layer GINE_GSA encoder, no bond-focused head, no boundary CutBondEncoder.
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml, same seed (397623), same
# 128-epoch box and monitoring. The existing c4a_base_s1/s2 runs are the control (tail mean
# 0.7270, the two replicates spanning 0.0007); read the 118-127 tail mean against them with the
# +/-0.005 gate of docs/findings/masshatter/masshatter_architecture_arms_epoch128_2026_09_22.md.
#
# Three keys, deliberately, not a one-key arm. The control spends its depth in two places: 2
# GINE_GSA atom layers, then 3 alternating bond<->atom refinement blocks inside
# BondFocusedBreakHead whose states reach only the cleavage logits and are then discarded.
# This arm puts all 5 layers into the shared atom encoder, which every head reads, and scores
# bonds from their endpoints (EndpointBondBreakHead):
#   mol_num_layers                      2    -> 5
#   mass_shatter_bond_num_layers        3    -> 0
#   mass_shatter_boundary_bond_encoder  true -> false
# The boundary key alone is already measured: c4a_no_bbe (`pkavjg8z`) is 0.7246, a null inside
# the gate. With it off the intensity head still receives a boundary block (endpoint means),
# so this arm does NOT remove the block the 2026-09-23 memorization probe points at.
#
# No run since the 2026-09-03 target change has used more than 2 mol layers or 0 bond layers.
# The 2026-08-15/16 GINE/GINE_EFA 5-layer runs predate it and are not comparable.
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_g1_gine_gsa5_no_bond_head
