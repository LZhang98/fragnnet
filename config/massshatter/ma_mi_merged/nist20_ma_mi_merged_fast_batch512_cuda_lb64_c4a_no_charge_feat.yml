# ARM c4a_no_charge_feat -- 4 h exploration campaign, 2026-09-21.
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_long_control.yml. Differs from the base by exactly: dropping c_charge from mass_shatter_candidate_features.
# The candidate mass/charge feature, boundary-bond-encoder and h-transfer-bound keys below
# are PINNED, not inherited, so a later default flip cannot move this comparison underneath
# it. boundary_bond_encoder was NOT pinned before 2026-09-21 and silently rode the template
# default (True) in every c4 arm; that is the defect this campaign exists to avoid.
#
# Drops the `c_charge` entry (summed Gasteiger partial charges, the analogue of FraGNNet's
# `frag_q`) from `mass_shatter_candidate_features`, ON by default since 2026-09-20 and never A/B'd.
# Independent of the `a_charge` atom feature. Changes the intensity head's input width.
#
# HORIZON (2026-09-21): resized 630 -> 128 epochs. The horizon probe `tkkesus9` ran the full
# 630-epoch schedule and val cosine SATURATES BY ~EPOCH 100: 0.7232@64 -> 0.7292@100 ->
# 0.7287@300 -> 0.7309@629, i.e. the last 529 epochs buy +0.0017, inside the 0.0016 control
# replicate floor. 128 epochs (~1.8 h at the measured 70 ep/h) reaches the plateau, so the
# saved wall clock is spent on n>=2 replicates instead -- which is what this family actually
# needs at a 0.003-0.005 replicate floor.
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_no_charge_feat
wandb_group: nist20_mass_shatter_campaign4h
wandb_tags:
- c4a_no_charge_feat
- campaign_4h_2026_09_21
- mass_shatter
- cuda_candidates
- fir_h100_mig
- nist20_ma_mi
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_64
- microbatch_512
- effective_batch_512
- merged
- merged_consensus
- nce_only
- no_cmf
- exposure_matched_epochs
- horizon_probe_2026_09_20
- train_aux_metrics
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: true
  merge_keep_ces: true
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+Cl]-'
  inst_type: true
  inst_types:
  - FT
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: mass_shatter
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
mass_shatter_unique_fragment_target: 256
mass_shatter_unique_fragment_mode: true
mass_shatter_ranked_mask_budget: 4096
mass_shatter_include_single_bond_cuts: true
mass_shatter_max_h_transfer: 4
mass_shatter_h_transfer_bound: valence
mass_shatter_include_cmf: false
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 3
mass_shatter_intensity_transformer_dim: 256
mass_shatter_intensity_transformer_num_layers: 2
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 512
mass_shatter_intensity_transformer_num_inducing_points: 64
mass_shatter_intensity_transformer_dropout: 0.1
mass_shatter_use_mask_residuals: true
mass_shatter_proposal_anchored: true
mass_shatter_log_base_ce: false
mass_shatter_base_ce_weight: 0.0
mass_shatter_detach_base_ion_h: true
mass_shatter_proposal_selection_only: true
mass_shatter_proposal_loss_weight: 0.1
mass_shatter_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0
inst_type_loss_tol:
  FT:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: false
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 128
max_epochs: 128
debug_overfit: false
compile: false
pl_enable_progress_bar: true
upload_checkpoints: false
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01

# Train-side auxiliary metrics off: see the header. This keeps peak GPU near 26.8 GiB so the run
# fits a 3g.40gb slice, at the cost of the train cosine (and therefore the train/val gap).
compute_train_auxiliary_metrics: false

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
mass_shatter_candidate_backend: cuda

# Campaign override(s) not present in the base file:
mass_shatter_boundary_bond_encoder: true
mass_shatter_candidate_features:
- c_cut_count
- c_size
- c_mass
