# 2g.20gb SLICE VARIANT of ..._lb64_ctrl_a.yml -- see
# docs/plans/masshatter_regularization_sweep_plan.md, Stage A.
# The 20 GB MIG slice cannot hold the 512 x lb64 arm (26.9 GiB measured), so the microbatch drops
# to 256 with accumulate_grad_batches: 2, keeping the EFFECTIVE batch at 512 and the optimizer
# math of the lb64 lineage. loss_batch_size follows to 32 and num_workers to 3 (the profile has
# 3 CPUs). Measured peak for 256 x lb32 is 12.7 GiB (run 0sfedmop), leaving ~6.8 GiB of the
# ~19.5 GiB usable slice -- ample for the merged peak-count tail (sigma 1.29, max 1168).
#
# CAVEAT, and it is on the axis under study: BatchNorm statistics are computed per MICROBATCH, so
# 256 is not 512 for `mol_normalization: batch`, which is exactly what the _layernorm and
# _graphnorm arms are testing. Uniform microbatch across all arms keeps the sweep internally
# valid, but effect sizes measured here do not transfer to a 512-microbatch run, and nothing in
# this shape may be compared against the four 512 x lb64 L40S replicates.
# If this shape is selected, EVERY arm in the sweep must be run with the same five keys.
# Arm of the regularization/normalization sweep -- see
# docs/plans/masshatter_regularization_sweep_plan.md. Every config in the sweep sets
# compute_train_auxiliary_metrics: true so the train cosine is logged next to the validation
# cosine; no MASShatter run before this sweep has ever logged one. Compare arms at matched
# epoch against ..._ctrl_a / ..._ctrl_b, never at matched wall clock and never against the
# 2026-09-18 L40S runs. loss_batch_size and num_workers are slice-dependent and are set at
# launch (2g.20gb needs loss_batch_size=16, num_workers=3); they do not change the loss.
# loss_batch_size 64 counterpart of nist20_ma_mi_merged_fast_batch512_cuda.yml (the arm it derives from
# used 8; template default is 32). Only loss_batch_size, wandb_name and tags
# differ. Measured cost: the merged peak-count tail (sigma 1.29, max 1168) makes
# the padded loss tensors spiky -- budget ~+4 GB over lbs=8 at microbatch 256.
# CUDA candidate counterpart of nist20_ma_mi_merged_fast_batch512.yml.
# Exact FP32 single-mixture selection/topology; CPU remains the template default.
# Local correctness/throughput checks passed; L40S acceptance is pending.
# Requires an existing compatible CUDA toolkit for the first native build.
# See docs/guides/benchmark_masshatter_merged_control.md for scope and confounds.
