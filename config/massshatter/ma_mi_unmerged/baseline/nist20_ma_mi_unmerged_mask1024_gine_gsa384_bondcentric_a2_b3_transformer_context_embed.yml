wandb_name: nist20_ma_mi_unmerged_mask1024_gine_gsa384_bondcentric_a2_b3_transformer_context_embed
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - mass_shatter
  - vulcan_l40s
  - nist20_ma_mi
  - unmerged
  - masks_1024
  - deterministic
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - context_embed
  - ce_embed
  - adduct_embed
  - charge_logsumexp

seed: 397623

# 1. Keep individual NIST20 MA/MI spectra and condition on NCE and adduct only.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: False
  merge_keep_ces: False
  nce: True
  ace: False
  prec_type: True
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: False
  frag_mode: False
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree_onehot
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Project the learned CE and adduct embeddings into one shared context vector.
model_type: mass_shatter
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
mass_shatter_selected_mask_limit: 1024
mass_shatter_include_single_bond_cuts: True
mass_shatter_max_h_transfer: 4
mass_shatter_include_cmf: True
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 3
mass_shatter_intensity_transformer_dim: 256
mass_shatter_intensity_transformer_num_layers: 2
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 512
mass_shatter_intensity_transformer_num_inducing_points: 64
mass_shatter_intensity_transformer_dropout: 0.1

# 3. Keep the objective identical to the merged CE-embedding control.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 1
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. Preserve the control's effective batch size of 128.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 32
eval_batch_size: 2
accumulate_grad_batches: 4
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01
