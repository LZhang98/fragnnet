wandb_name: debug_d3_neims_weight
wandb_tags:
- debug

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d3_wr75_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
num_depth: 4
num_hs: 4
spec_params:
  subsample_size: 256
  merge: True
sample_weight: none

train_batch_size: 32
eval_batch_size: 32
accumulate_grad_batches: 2
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 10
max_epochs: 10
lr_schedule: False
debug_overfit: False

model_type: neims
loss_type: "cosine_distance"
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  pyg: False
frag_params:
  pyg: False
mlp_hidden_size: 2000
mlp_dropout: 0.1
mlp_num_layers: 5
mlp_use_residuals: True
ff_prec_mz_offset: 5
ff_bidirectional: True
mz_bin_res: 0.1 # 0.01 requires A40
mz_max: 1500.0
sparse_cosine_similarity: True
