wandb_name: debug_tiny_new_mol_feats
wandb_tags:
- cc_test_run
- a_ring_size
- a_charge
- b_ring
- b_conj

# data stuff
spec_fp: data/proc/debug_tinyv4/spec_df.pkl
mol_fp: data/proc/debug_tinyv4/mol_df.pkl
split_dp: data/split/debug_tinyv4
frag_dp: data/frag/debug_tinyv4_d3h4/dags

seed: 42

subsample_params:
  subsample_size: 40
  subsample_seed: 42
  train: True
  val: True
  test: True
  secondary: True

frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
    - boundary_pair
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: False
  preprocess: False
  include_cmf: True

spec_params:
  merge: True
  nce: True
  ace: True
  merge_keep_ces: True
  preprocess: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"

mol_params:
  preprocess: False
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_mass
    - a_chiral
    - a_ring_size
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

nb_iso: False

# model stuff
frag_gnn_type: NodeMLP
num_depth: 4
num_hs: 4
ce_insert_type: embed_clamped
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: True
ce_scale: True
ce_scaler_hidden_dim: 64
mol_pool_type: mean
frag_pool_type: max
mol_hidden_size: 128
mol_dropout: 0.1
frag_dropout: 0.1
mlp_dropout: 0.2

# loss stuff
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16
group_sampler: False
simple_group_sampler: False

inst_type_loss_tol:
  FT:   {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# optimization stuff
train_batch_size: 1
eval_batch_size: 1
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0003033
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 5
max_epochs: 5
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
delete_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01
eval_bin_sqrt: False
precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: False
pl_enable_progress_bar: True
compile: False
num_workers: 0
detect_anomaly: True
