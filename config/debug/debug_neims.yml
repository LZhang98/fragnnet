wandb_name: debug_neims
wandb_tags:
- debug

split_dp: data/split/d3_h4_isoTrue_v2
spec_params:
  subsample_size: 128

model_type: neims
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  pyg: False
frag_params:
  pyg: False
mlp_hidden_size: 2000
mlp_dropout: 0.1
mlp_num_layers: 5
mlp_use_residuals: True
mz_max: 1500.0
mz_bin_res: 1.0
ff_prec_mz_offset: 
ff_bidirectional: 
loss_type: "cosine_distance"

train_batch_size: 32
eval_batch_size: 32
accumulate_grad_batches: 2
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 2
max_epochs: 2
lr_schedule: False
debug_overfit: False
