wandb_name: debug_d3_iceberg_inten_weight
wandb_tags:
- debug

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d3_wr00_inchikey
magma_dp: data/magma/gen/nist20mona23
spec_params:
  merge: True
subsample_params:
  subsample_size: 128
sample_weight: group

model_type: iceberg_inten
loss_type: cosine_distance
sparse_cosine_similarity: True
mol_params:
  smiles: True
  fingerprint: False
  pyg: False
  preprocess: False
magma_params:
  pe_embed_k: 0
  root_encode: gnn
  add_hs: True
  binned_targs: False
  mz_bin_res: 0.1
  mz_max: 1500.0
  sum_ints: True
mz_bin_res: 0.1
mz_max: 1500.0
sum_ints: True
ints_transform: sqrt
iceberg_hidden_size: 256
iceberg_num_mlp_layers: 1
iceberg_num_gnn_layers: 4
iceberg_num_set_layers: 0
iceberg_num_frag_set_layers: 3
iceberg_dropout: 0.1
iceberg_gnn_type: GGNN
iceberg_pool_type: avg
iceberg_inject_early: False
iceberg_embed_adduct: True
iceberg_encode_forms: True

train_batch_size: 32
eval_batch_size: 32
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.000736
accelerator: gpu
devices: 1
min_epochs: 20
max_epochs: 20
lr_schedule: True
lr_decay_rate: 0.825
lr_warmup_steps: 1000
lr_decay_steps: 5000
weight_decay: 0.0000001 # 1e-7
debug_overfit: False
num_workers: 8
checkpoint_metric: val_loss_epoch
checkpoint_metric_mode: min
upload_checkpoints: True
