wandb_name: debug_d3_nce_cs2
wandb_tags:
- debug


spec_fp: data/proc/debug_small/spec_df.pkl
mol_fp: data/proc/debug_small/mol_df.pkl
split_dp: data/split/debug_small
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
num_depth: 4
num_hs: 4
spec_params:
  merge: False
  nce: True
sample_weight: none
ce_insert_mol: True # False
ce_insert_frag: False
ce_insert_mlp: True # False
ce_insert_mlp_lin: False

train_batch_size: 64
eval_batch_size: 64
accumulate_grad_batches: 4
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
precision: 32
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 3
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
mol_pool_type: mean
frag_pool_type: mean

precision: 32
use_tensor_float32: True
automatic_optimization: True
dynamic_batch_sampler: False
dynamic_batch_sampler_mode: frag_edge
dynamic_batch_sampler_max: 500000
group_sampler: False
group_sampler_type: group
group_sampler_max_per_group: 3
simple_group_sampler: True
simple_group_sampler_max: 100000
simple_group_sampler_type: group #[group, group_mol, mol]
pl_enable_progress_bar: True
