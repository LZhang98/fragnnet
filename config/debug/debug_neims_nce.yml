wandb_name: debug_neims_nce
wandb_tags:
- debug

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr00_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
num_depth: 4
num_hs: 4
subsample_params:
  subsample_size: 2048
spec_params:
  merge: False # True
  nce: True # False
compile: False
sample_weight: "group"
ce_insert_mol: False
ce_insert_frag: False
ce_insert_mlp: True # False
ce_insert_mlp_lin: False
eval_mz_bin_res:
- 1.0
- 0.1

train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 2
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
sparse_cosine_similarity: True
upload_checkpoints: True

precision: 32
use_tensor_float32: True
automatic_optimization: True

model_type: neims
loss_type: "cosine_distance"
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  pyg: False
frag_params:
  pyg: False
mlp_hidden_size: 2000
mlp_dropout: 0.1
mlp_num_layers: 5
mlp_use_residuals: True
mz_max: 1500.0
mz_bin_res: 0.1
sum_ints: True
ff_prec_mz_offset: 5
ff_bidirectional: True
ints_transform: sqrt
