wandb_name: debug_manopt
wandb_tags:
- debug

split_dp: data/split/debug_fw
frag_dp: data/frag/d3_h4_isoTrue_v2/dags
num_depth: 4
num_hs: 4
subsample_params:
  subsample_size: 128

train_batch_size: 1
eval_batch_size: 4
accumulate_grad_batches: 8
gradient_clip_val: 5.0
lr: 0.0004
accelerator: cpu
devices: 1
min_epochs: 1
max_epochs: 1
lr_schedule: False
debug_overfit: False
precision: bf16-mixed

automatic_optimization: False
detect_anomaly: True
# custom_batch_sampler: specmolfrag_dynamic_batch_sampler
# specmolfrag_dynamic_batch_sampler_mode: frag_node
# specmolfrag_dynamic_batch_sampler_max: 10000 #100000
# check_gradient_norm: False
nan_module_hook: True
debug_zero_loss: True