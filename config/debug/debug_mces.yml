wandb_name: debug_mces
wandb_tags:
- pretraining

# data stuff
mces_fp: data/proc/mces/mces_pairs.pkl
mol_fp: data/proc/mces/mol_df.pkl
split_dp: data/split/mces_nist23_ma_mi_inchikey

subsample_params:
  subsample_size: 10000
  subsample_seed: 42
  train: False
  val: False
  test: False
  secondary: False
mol_params:
  smiles: True
  fingerprint: False
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  pyg: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
  pyg_pe_embed_k: 0
  pyg_bigraph: True
  mf: False
  graff: False
  preprocess: True

# model stuff
model_type: mces_pretraining
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True
mol_pool_type: mean
mol_normalization: batch
mol_hidden_size: 256
mol_dropout: 0.2
mlp_normalization: layer
mlp_hidden_size: 64
mlp_dropout: 0.2

# loss stuff
loss_type: mae
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: False #True
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 1024
eval_batch_size: 1024
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0003033
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 5
max_epochs: 50
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
delete_checkpoints: False
checkpoint_metric: val_loss
auxiliary_scores:
# eval_mz_bin_res:
# - 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
pl_enable_progress_bar: True
compile: False
num_workers: 0
detect_anomaly: True