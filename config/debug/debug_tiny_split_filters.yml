wandb_name: debug_tiny_split_filters
wandb_tags:
- cc_test_run
- split_filters

# data stuff
spec_fp: data/proc/debug_tinyv4/spec_df.pkl
mol_fp: data/proc/debug_tinyv4/mol_df.pkl
split_dp: data/split/debug_tinyv4
frag_dp: data/frag/debug_tinyv4_d3h4/dags

seed: 42

subsample_params:
  subsample_size: 40
  subsample_seed: 42
  train: True
  val: True
  test: True
  secondary: True

frag_params:
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: False
  preprocess: False

spec_params:
  merge: False
  nce: True
  ace: False            # filter_ce_by_inst reads raw ace column from pickle (QTOF always has it)
  merge_keep_ces: False
  preprocess: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
  inst_type: True
  inst_types:
    - "ORB"
    - "ORB_F"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  # Per-split CE + adduct filters.
  # train: drop FT spectra outside NCE 0-60% and QTOF spectra outside ACE 0-40 eV.
  # val/test: no filter (evaluate on full held-out set).
  split_filters:
    train:
      filter_ce_by_inst:
        ORB:   {nce_min: 0, nce_max: 60}
        ORB_F:   {nce_min: 0, nce_max: 60}
        QTOF: {ace_min: 0, ace_max: 40}
    val:
      filter_ce_by_inst:
        ORB:   {nce_min: 0, nce_max: 60}
        ORB_F:   {nce_min: 0, nce_max: 60}
        QTOF: {ace_min: 0, ace_max: 40}
    test: {}

mol_params:
  preprocess: False

nb_iso: False

# model stuff
frag_gnn_type: NodeMLP
num_depth: 4
num_hs: 4
ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: True
# frag-mode conditioning

frag_mode_insert_location: mol
frag_mode_insert_size: 8
mol_pool_type: mean
frag_pool_type: mean
mol_normalization: batch
mol_hidden_size: 128
mol_dropout: 0.2
frag_hidden_size: 128
frag_normalization: graph
frag_embed_combine: cat
frag_pool_combine: none
frag_dropout: 0.1
mlp_normalization: layer
mlp_hidden_size: 64
mlp_dropout: 0.2
frag_mode_scale: True

# CE-conditioned FiLM scaler
ce_scale: True
ce_scaler_hidden_dim: 64

# loss stuff
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16

group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 1
eval_batch_size: 1
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0003033
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 2
max_epochs: 2
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
delete_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
dynamic_batch_sampler: False
pl_enable_progress_bar: True
compile: False
num_workers: 0
detect_anomaly: True
