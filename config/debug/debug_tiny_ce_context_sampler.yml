wandb_name: debug_tiny_ce_context_sampler
wandb_tags:
  - debug
  - ce_context_sampler

# Keep complete CE groups. Spectrum-level subsampling can remove siblings and
# leave the context sampler with no eligible transitions.
spec_fp: data/proc/debug_tinyv4/spec_df.pkl
mol_fp: data/proc/debug_tinyv4/mol_df.pkl
split_dp: data/split/debug_tinyv4
frag_dp: data/frag/debug_tinyv4_d3h4/dags
subsample_params:
  subsample_size: 0
  subsample_seed: 42
  train: true
  val: true
  test: true
  secondary: true

seed: 42
num_depth: 4
num_hs: 4

spec_params:
  merge: false
  merge_keep_ces: false
  nce: true
  ace: true
  preprocess: false
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
  inst_type: true
  inst_types:
    - FT
    - QTOF
  frag_mode: true
  frag_modes:
    - HCD
    - CID

mol_params:
  preprocess: false

frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - boundary_pair
  pyg_edge_feats:
    - base_formula
  pyg_edges: true
  pyg_bigraph: false
  preload: false
  preprocess: false
  include_cmf: false

mol_gnn_type: GINE
frag_gnn_type: GINE
mol_hidden_size: 128
frag_hidden_size: 128
mlp_hidden_size: 64
mol_pool_type: mean
frag_pool_type: mean
mol_normalization: batch
frag_normalization: graph
mlp_normalization: layer
frag_embed_combine: avg
frag_pool_combine: subtract

ce_insert_type: lin
ce_insert_location: mol
ce_insert_merge: true
ce_insert_size: 16
prec_insert_location: mol
prec_insert_size: 16
inst_insert_location: mol
inst_insert_size: 16
frag_mode_insert_location: mol
frag_mode_insert_size: 8

inst_type_loss_tol:
  FT: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

mask_null_formula: false
predict_oos: true
oos_tolerance_multiple: 1
oos_loss: true
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 8

group_sampler: false
simple_group_sampler: false
formula_prec_type_group_sampler: false
train_sample_weight: none
eval_sample_weight: none

# Mechanics-only CE-context smoke test. The two epochs exercise deterministic
# window and replicate rotation; the pair-loss path remains disabled.
dynamic_batch_sampler: true
batch_sampler_type: ce_context
dynamic_batch_sampler_mode: frag_edge
dynamic_batch_sampler_max: 20000
ce_context_spectra_per_context: 5
ce_context_ce_key_by_inst:
  FT: nce
  QTOF: ace
dag_size_curriculum: false
ce_pair_loss_weight: 0.0

train_batch_size: 8
eval_batch_size: 8
accumulate_grad_batches: 1
automatic_optimization: false
accelerator: gpu
devices: 1
min_epochs: 2
max_epochs: 2
lr_schedule: false
upload_checkpoints: false
delete_checkpoints: true
precision: 32
use_tensor_float32: true
compile: false
num_workers: 0
detect_anomaly: true
pl_enable_progress_bar: true
