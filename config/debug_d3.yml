wandb_name: debug_d3
wandb_tags:
  - debug
split_dp: data/split/d3_h4_isoTrue_v2
frag_dp: data/frag/d3_h4_isoTrue_v2/dags
num_depth: 4
num_hs: 4
spec_preprocess: False #True
mol_preprocess: False #True
frag_preload: False #True
frag_preprocess: False #True
spec_subsample_size: 128

train_batch_size: 2
eval_batch_size: 2
accumulate_grad_batches: 32
gradient_clip_val: 5.0
lr: 0.0001
accelerator: gpu
devices: 1
min_epochs: 10 #100
max_epochs: 10 #100
lr_schedule: False
lr_warmup_steps: 0
lr_decay_steps: 10
lr_decay_rate: 0.8
debug_overfit: False
debug_overfit_batches: 1 # 24
formula_entropy_weight: 0.0
node_entropy_weight: 2.0
node_formula_entropy_weight: -2.0
frag_pyg_node_feats:
  - cc
  - base_formula
  - depth
  - h_formulae_idx
  - h_counts
frag_pyg_edge_feats:
  - cc
  - base_formula
  - h_range
profiler: none
compile: True
log_every_n_steps: 0
auxiliary_scores:
  - cos_sim
  - wrecall
  - opt_cos_sim
num_log_train_images: 0
num_log_val_images: 0
drop_last: False
num_workers: 0
edge_h_range_loss_weight: 2.0
edge_h_transfer_loss_weight: 0.0
edge_h_range_loss_fn: exponential
edge_h_transfer_loss_fn: quadratic #linear
