wandb_name: nist20_inchikey_mass_shatter_s0
wandb_group: nist20_inchikey_mass_shatter
wandb_tags:
  - masster
  - topk_100

seed: 397623

# 1. Load merged NIST20 spectra and regenerate molecular graphs with MASSter fields.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
mol_params:
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  preprocess: True

# 2. Encode each precursor once, then rank global cut masks from bond probabilities.
model_type: masster
mol_gnn_type: GINE
mol_hidden_size: 256
mol_num_layers: 4
mol_normalization: batch
mol_dropout: 0.1
masster_selected_mask_limit: 100
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_context_dim: 64
masster_metadata_embedding_dim: 16
masster_head_hidden_dim: 256
masster_head_dropout: 0.1

# 3. Train with the same sparse Gaussian cross-entropy used by FraGNNet.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. Start conservatively; the first GPU profile should set the final batch size.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 8
eval_batch_size: 8
accumulate_grad_batches: 16
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
precision: 32
use_tensor_float32: True
min_epochs: 200
max_epochs: 200
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
  - wrecall
eval_mz_bin_res:
  - 0.01
