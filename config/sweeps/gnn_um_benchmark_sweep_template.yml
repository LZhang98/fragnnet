wandb_name: gnn_um_benchmark_sweep_template
wandb_tags:
- sweep
- msg
- nist20v2
- d4
- wr00
- inchikey
- new_proc
- gnn
- new_metrics
- mz_bin_res_0,1
- no_auxiliary_scores
- preprocess

# data stuff
spec_fp: data/proc/ms_gym/spec_df.pkl
mol_fp: data/proc/ms_gym/mol_df.pkl
split_dp: data/split/ms_gym_d3_h4_benchmark
spec_params:
  merge: False
  nce: True
  merge_keep_ces: False
  preprocess: True
  inst_types:
    - "QTOF"
    - "FT"
  prec_types:
    - "[M+H]+"
mol_params:
  fingerprint_morgan: False
  fingerprint_rdkit: False
  fingerprint_maccs: False
  fingerprint: False
  pyg: True
  preprocess: True
  pe_embed_k: 0
frag_params:
  pyg: False

# model stuff
model_type: gnn
mol_hidden_size: 256
mol_num_layers: 4
mol_gnn_type: GINE
mol_normalization: batch
mol_dropout: 0.2
mol_pool_type: mean
mlp_normalization: batch
mlp_hidden_size: 512
mlp_dropout: 0.0
mlp_num_layers: 4
mlp_use_residuals: True
ff_prec_mz_offset: 5
ff_bidirectional: True
ff_output_map_size: 256
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: False
ce_insert_size: 24
inst_insert_location: mlp
inst_insert_size: 8
mz_max: 1000.0
mz_bin_res: 0.1
sum_ints: True

# loss stuff
loss_type: cosine_distance
sparse_cosine_similarity: True
ints_transform: sqrt
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 128
eval_batch_size: 128
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0003755
weight_decay: 0.000001
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: True
lr_decay_rate: 0.8523
lr_warmup_steps: 1000
lr_decay_steps: 5000
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.1_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.1
precision: 32
use_tensor_float32: True
automatic_optimization: True
compile: True
mp_sharing_strategy: file_system
