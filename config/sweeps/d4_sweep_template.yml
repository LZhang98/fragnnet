wandb_name: d4_sweep_template
wandb_tags:
  - sweep
  - v2
  - TF32
  - D4
  - DynamicBatchSampler
  - SamplerEdge500K

split_dp: data/split/d4_h4_isoTrue_hyperopt
frag_dp: data/frag/d3_h4_isoTrue/dags
num_depth: 5
num_hs: 4

train_batch_size: 16
eval_batch_size: 16
accumulate_grad_batches: 8
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
frag_pyg_node_feats:
  - cc
  - base_formula
  - depth
frag_pyg_edge_feats:
  - cc
  - base_formula

precision: 32
use_tensor_float32: True
automatic_optimization: False
custom_sampler: SpecMolFragDynamicBatchSampler
specmolfrag_dynamic_batch_sampler_mode: frag_edge
specmolfrag_dynamic_batch_sampler_max: 500000
pl_enable_progress_bar: False
