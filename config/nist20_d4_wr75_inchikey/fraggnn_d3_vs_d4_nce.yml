wandb_name: fraggnn_d3_vs_d4_nce
wandb_tags:
- splits
- nist20
- d3
- wr75
- inchikey
- new_proc
- fraggnn_d3
- nce
- d3_vs_d4

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr75_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
num_depth: 4
num_hs: 4
spec_params:
  merge: False
  nce: True
sample_weight: group

train_batch_size: 32
