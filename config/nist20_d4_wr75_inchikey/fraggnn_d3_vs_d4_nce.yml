lr_schedule: False
debug_overfit: False
precision: 32
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 3
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
mol_pool_type: mean
frag_pool_type: mean

precision: 32
use_tensor_float32: True
automatic_optimization: False
custom_sampler: SpecMolFragDynamicBatchSampler
specmolfrag_dynamic_batch_sampler_mode: frag_edge
specmolfrag_dynamic_batch_sampler_max: 500000
pl_enable_progress_bar: False