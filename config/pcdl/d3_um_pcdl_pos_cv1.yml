wandb_name: d3_um_pcdl_pos_cv_1
wandb_group: d3_um_pcdl_pos_cv
wandb_tags:
- um
- d3
- wr00
- inchikey
- new_proc
- fraggnn_d3
- new_metrics
- nodemlp
- ce_embed
- unmerged
- oos_multiple_1
- gaussian_renormalize
- b512x1
- no_auxiliary_scores
- vectorized_loss
- lb16
- preload
- preprocess
- xi6bawy4
- pcdl_pos

# data stuff
spec_fp: data/proc/pcdl/spec_df.pkl
mol_fp: data/proc/pcdl/mol_df.pkl
split_dp: data/split/pcdl_pos/cv_1
frag_dp: data/frag/pcdl_d3_h4/dags
frag_params:
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
spec_params:
  merge: False
  nce: True
  ace: False
  merge_keep_ces: False
  preprocess: True
  prec_type: True
  prec_types:
    - "[M+H]+"
  inst_type: True
  inst_types:
    - "QTOF"
    - "Other"
mol_params:
  preprocess: True

# model stuff
frag_gnn_type: NodeMLP
num_depth: 4
num_hs: 4
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True
ce_insert_size: 24
prec_insert_location: none
prec_insert_size: 8
inst_insert_location: none
inst_insert_size: 8
mol_pool_type: mean
frag_pool_type: mean
mol_normalization: batch
mol_hidden_size: 256
mol_dropout: 0.2
frag_hidden_size: 256
frag_normalization: graph
frag_embed_combine: avg
frag_pool_combine: subtract
frag_dropout: 0.1
mlp_normalization: layer
mlp_hidden_size: 64
mlp_dropout: 0.2

# loss stuff
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: True
group_sampler: False
simple_group_sampler: True
simple_group_sampler_type: group_mol
train_sample_weight: none
eval_sample_weight: group_mol

# optimization stuff
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0003033
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: SpecMolFragDynamicBatchSampler
pl_enable_progress_bar: True
compile: False
