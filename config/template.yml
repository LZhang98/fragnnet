# wandb
wandb_entity: frag-gnn
wandb_project: frag-gnn
wandb_name: template
wandb_tags: 
# data
spec_fp: data/proc/spec_df.pkl
mol_fp: data/proc/mol_df.pkl
split_dp: data/split/debug
frag_dp: data/frag/debug/dags
spec_merge: True
spec_subsample_size: 0
spec_subsample_seed: 420
spec_ints_thresh: 0.0
spec_mz_max: 1500.0
spec_sparse: True
spec_binned: False
spec_mz_bin_res: 0.01
spec_sum_ints: True
spec_prec_type: True
spec_prec_mz: True
spec_prec_mass_diff: True
spec_nce: False
spec_ace: False
spec_preprocess: False
spec_unique_id: True
mol_smiles: True
mol_fingerprint: False
mol_fingerprint_morgan: True
mol_fingerprint_rdkit: True
mol_fingerprint_maccs: True
mol_pyg: True
mol_pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_mass
  - a_chiral
mol_pyg_edge_feats:
  - b_degree
mol_pyg_pe_embed_k: 0
mol_pyg_bigraph: True
mol_preprocess: False
frag_pyg: True
frag_pyg_node_feats:
  - cc
  - base_formula
  - depth
  - h_formulae_idx
  - h_counts
frag_pyg_edge_feats:
  - cc
  - base_formula
  - h_range
frag_pyg_bigraph: True
frag_num_isotopes: 1
frag_formula_peak_mzs: True
frag_formula_peak_probs: True
frag_compressed: True
frag_preload: False
frag_preprocess: False
# model
model_type: frag_gnn
num_depth: 5
num_hs: 4
num_elements: 12
int_embedder: abs-sines
int_embedder_tight: False
mol_hidden_size: 256
mol_num_layers: 4
mol_gnn_type: GINE
mol_dropout: 0.0
mol_normalization: batch
mol_pool_type: none
frag_hidden_size: 256
frag_num_layers: 4
frag_gnn_type: GINE
frag_dropout: 0.0
frag_normalization: batch
frag_pool_type: none
mlp_output_format: formula
mlp_hidden_size: 256
mlp_dropout: 0.0
mlp_normalization: none
mlp_num_layers: 2
mlp_use_residuals: True
ff_prec_mz_offset: 0 #5
ff_bidirectional: True
# other
lr: 0.0001
lr_schedule: False
weight_decay: 0.01
lr_decay_rate: 0.95
lr_warmup_steps: 1000
lr_decay_steps: 5000
optimizer: adamw
output_distribution: gaussian
loss_type: cross_entropy
loss_vectorized: False
loss_tolerance_ppm: 0.00001
loss_tolerance_abs: #0.001
auxiliary_scores:
  - cos_sim
  - wrecall
  - opt_cos_sim
ints_thresh: 0.0
mz_max: 1500.0
mz_bin_res: 0.01
bin_sum_ints: True
ints_transform: none #log10t3
train_batch_size: 16
eval_batch_size: 16
accelerator: cpu
devices: auto
logging:
  - console
  - wandb
num_workers: 8
min_epochs: 1
max_epochs: 1
gradient_clip_val: 5.0
gradient_clip_algorithm: norm
accumulate_grad_batches: 1
precision: 32 # 64, 16-mixed, bf16-mixed
debug_overfit: False
debug_overfit_batches: 10
log_every_n_steps: 0
primary_loss_weight: 1.0
formula_entropy_weight: 0.0
node_entropy_weight: 0.0
node_formula_entropy_weight: 0.0
formula_normalized_entropy_weight: 0.0
node_normalized_entropy_weight: 0.0
node_formula_normalized_entropy_weight: 0.0
skip_edge_loss: True
edge_h_range_loss_weight: 0.0
edge_h_transfer_loss_weight: 0.0
edge_h_range_loss_fn: linear # do not make exponential!
edge_h_transfer_loss_fn: linear
edge_entropy_weight: 0.0
edge_normalized_entropy_weight: 0.0
seed: 420
detect_anomaly: False
automatic_optimization: True
profiler: none
compile: True
num_log_train_images: 0
num_log_val_images: 0
deterministic: False
drop_last: False
num_sanity_val_steps: 2
mask_null_formula: True
