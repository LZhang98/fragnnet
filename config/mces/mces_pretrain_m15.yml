wandb_name: mces_nist23_ma_mi_inchikey_m15
wandb_tags:
- pretraining
- mse
- mces15

# data stuff
mces_fp: data/proc/mces/mces_pairs.pkl
mol_fp: data/proc/mces/mol_df.pkl
split_dp: data/split/mces_nist23_ma_mi_inchikey_m15

subsample_params:
  subsample_size: 10000
  subsample_seed: 42
  train: False
  val: False
  test: False
  secondary: False
mol_params:
  smiles: True
  fingerprint: False
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  pyg: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
  pyg_pe_embed_k: 0
  pyg_bigraph: True
  mf: False
  graff: False
  preprocess: True

# model stuff
model_type: mces_pretraining
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True
mol_pool_type: mean
mol_normalization: batch
mol_hidden_size: 256
mol_dropout: 0.2
mlp_normalization: layer
mlp_hidden_size: 256
mlp_dropout: 0.5

# mces stuff
mces_min: 1
mces_max: 15
mces_mean: 12
mces_std: 2
mces_normalization: zscore  # options: none, zscore, minmax

# loss stuff
loss_type: mse
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 10240
eval_batch_size: 10240
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.01
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 1
max_epochs: 5
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
delete_checkpoints: False
checkpoint_metric: val_loss
checkpoint_metric_mode: min
auxiliary_scores:
- mse
- mae
# eval_mz_bin_res:
# - 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
pl_enable_progress_bar: True
compile: False
num_workers: 0
detect_anomaly: True