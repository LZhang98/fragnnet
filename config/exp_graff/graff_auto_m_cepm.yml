wandb_name: graff_auto_m_cepm
wandb_tags:
- exp_graff
- nist20
- d4
- wr00
- inchikey
- new_proc
- graff
- new_metrics
- nodemlp
- ce_embed
- merged
- b64x2
- no_auxiliary_scores
- preload
- preprocess
- peak_maginal
- pm_multiple_1

# data stuff
spec_fp: data/proc/debug_annot_6/spec_df.pkl
mol_fp: data/proc/debug_annot_6/mol_df.pkl
split_dp: data/split/nist20_mona23_d4_wr00_inchikey_2 # needs to be _2
ann_fp: data/proc/debug_annot_6/ann_df.pkl
frag_params:
  pyg: False
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
mol_params:
  pyg: False
  graff: True
  preprocess: True
ann_params:
  max_isotope: 3
  library_size: 10000
  num_eigs: 8
  filter_peaks: False
  filter_peaks_tol: 0.02
  preprocess: True

# model stuff
model_type: graff
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True

# loss stuff
loss_type: cross_entropy
output_distribution: peak_marginal
sparse_cosine_similarity: True
oos_loss: False
skip_extra_losses: True
predict_oos: False
oos_tolerance_multiple: 1
gaussian_renormalize: True
pm_tolerance_multiple: 1

# optimization stuff
train_batch_size: 128
eval_batch_size: 128
accumulate_grad_batches: 4
gradient_clip_val: 100.0
lr: 0.0005 # 5e-4
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
compile: True
optimizer: adam
weight_decay: 0.00001 # 1e-5
