# fragnnet configuration template
#
# Self-contained: this file is the complete default configuration for `model_type: frag_gnn` (aliases `fraggnet`, `fragnnet`).
# A run resolves as: this template -> your custom config -> CLI --override.
# Keys shared with the other templates in this directory are duplicated by design; a shared
# default has to be changed in each file that uses it.
# ============================================================================
# Wandb
# ============================================================================
wandb_entity: frag-gnn # TODO: change to your wandb entity
wandb_project: frag-gnn # TODO: change to your wandb project
wandb_name: template
wandb_group:
wandb_tags:

# ============================================================================
# Data File Paths
# ============================================================================
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey  # Train/val/test split directory
frag_dp: data/frag/nist20_d3/dags  # Fragment DAG data directory

# ============================================================================
# Data Processing Parameters
# ============================================================================
subsample_params:
  subsample_size: 0
  subsample_seed: 42
  train: True
  val: True
  test: True
  secondary: True
spec_params:
  merge: True
  merge_keep_ces: False
  # exact_sum preserves the historical exact-m/z union. tolerance_consensus
  # normalizes source spectra, clusters peaks at instrument tolerance, averages
  # replicates, and can give distinct CE schedules equal weight.
  merge_method: exact_sum  # ["exact_sum", "tolerance_consensus"]
  merge_tolerance_common_overlap: True
  merge_normalize_each_spectrum: False
  merge_equal_ce_weight: False
  merge_ce_aggregation: legacy  # weighted: retain all CE readings with target-matched weights (equal-CE consensus only).
  merge_tolerance_by_inst:
    FT: {rel: 1.0e-5, min_mz: 200.0}
    QTOF: {rel: 2.0e-5, min_mz: 750.0}
  sparse: True
  prec_type: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
  inst_type: True
  inst_types:
    - "FT"
  frag_mode: False          # load fragmentation mode (HCD/CID) from spectrum metadata
  frag_modes: []            # known frag modes; unknown falls back to index num_frag_modes
  prec_mz: True
  prec_mass_diff: True
  nce: False
  ace: False
  preprocess: False
  # Per-spectrum peak cleanup, applied before replicate-spectrum merging.
  centroid_peaks: False
  centroid_ppm: 20.0
  centroid_use_instrument_tolerance: False
  centroid_method: common_overlap  # ["common_overlap", "naive_centroid"]
  filter_subformula_peaks: False  # when True, candidates always include charge-migration ions ([M+Na]+ -> [frag+H]+, [M+Cl]- -> [frag-H]-)
  subformula_ppm: 5.0 # only use if filter_subformula_peaks is True and subformula_use_instrument_tolerance is False
  subformula_use_instrument_tolerance: True
  drop_empty_spectra: True
  # Monoisotopic target cleanup. NOT HOOKED UP: the feature is off everywhere and no run has
  # been evaluated with it on; the keys are kept so older configs and checkpoints still
  # resolve. When on, isotope peaks are removed from observed spectra before they become
  # training/evaluation targets; isotope envelopes can then be added back as a post-process.
  # `remove_isotope_formula_source` picks where a fragment's composition comes from, which is
  # what the expected M+k/M+0 ratio needs: `subformula` decomposes the peak against the
  # precursor formula and works for every model, `dag` reads the molecule's DAG and therefore
  # needs `frag_dp`, which only the FraGNNet template declares, and `none` falls back to the
  # m/z-scaled precursor proxy (wrong for Cl/Br). Measured head to head on 1,500 FT NIST20
  # spectra, subformula and DAG agree on 99.2% of peak decisions:
  # docs/plans/subformula_isotope_detection_plan.md.
  remove_isotope_peaks: False
  remove_regular_isotope_peaks: False
  remove_coisolation_peaks: False
  remove_isotope_use_group_f: False
  remove_isotope_max_isotope: 2
  remove_isotope_min_coiso_fraction: 0.05
  remove_isotope_max_leak_factor: 1.5
  remove_isotope_precursor_envelope_lo: 0.2
  remove_isotope_precursor_envelope_hi: 5.0
  remove_isotope_group_min_count: 1
  remove_isotope_group_max_cv: 1.0
  remove_isotope_formula_source: none  # ["none", "subformula", "dag"]
  remove_isotope_candidate_rule: median  # ["median", "all", "any"] when subformulas disagree
  remove_isotope_subformula_mz_tol:  # blank = instrument tolerance
  remove_isotope_use_dag_formula: False  # SUPERSEDED by remove_isotope_formula_source: dag
  remove_isotope_dag_dp:
  remove_isotope_dag_compressed: False
  remove_isotope_dag_mz_tol: 0.015
  remove_isotope_protect_known_mono: False  # never flag a peak the source explains on its own
  remove_isotope_protect_dag_mono: False  # SUPERSEDED by remove_isotope_protect_known_mono
  remove_isotope_regular_mz_tol:
  unique_id: True
  counts: True
  # Deprecated; superseded by split_filters.val.filter_ce_by_inst.QTOF. Use split_filters instead.
  test_ces:
  # Per-split spectrum filters applied at dataset load time.
  # Only the entry matching the current split is used.  Missing entry = no filter.
  # filter_prec_types: drop spectra whose prec_type is not in spec_params.prec_types.
  # filter_ce_by_inst: per-instrument CE range filter (scalar, after Phase-1 CE fill).
  #   nce_min/nce_max operate on the Phase-1-filled NCE column (requires nce: true).
  #   ace_min/ace_max operate on the raw ACE column from the pickle file.
  #   QTOF spectra always carry raw ace; ace: true is NOT required (and conflicts with nce: true).
  #   Spectra of a listed instrument with missing/unfillable CE are dropped.
  # Example:
  # split_filters:
  #  train:
  #    filter_ce_by_inst:
  #      FT:   {nce_min: 0, nce_max: 60}
  #      QTOF: {ace_min: 0, ace_max: 40}
  #  val:
  #    filter_ce_by_inst:
  #      FT:   {nce_min: 0, nce_max: 60}
  #      QTOF: {ace_min: 0, ace_max: 40}
  split_filters: {}
mol_params:
  smiles: True
  fingerprint: False
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  morgan_radius: 3  # Morgan fingerprint radius (default: 3, original NEIMS likely uses 2)
  morgan_nbits: 2048  # Morgan fingerprint size in bits (default: 2048)
  rdkit_nbits: 2048  # RDKit fingerprint size in bits (default: 2048)
  pyg: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_mass
    - a_chiral
    # - a_ring_size # ring size membership: [in3, in4, in5, in6, inGe7]; no DAG recomputation needed
    # - a_charge    # Gasteiger partial charge (continuous); computed on-the-fly, no DAG recomputation needed
    # - a_num_hs    # total H count one-hot [0, 1, 2, 3, >=4]; complements a_degree (heavy-atom only)
  pyg_edge_feats:
    - b_degree
    # - b_ring      # bond ring membership (2 bits); no DAG recomputation needed
    # - b_conj      # bond conjugation (2 bits); no DAG recomputation needed
    # - b_stereo    # bond stereo one-hot (none/any/Z/E/cis/trans + unspecified); preprocessing strips stereo
  pyg_pe_embed_k: 0
  pyg_bigraph: True
  mf: False
  graff: False
  preprocess: False

# ============================================================================
# Model Architecture
# ============================================================================
# Model type. Full list: TEMPLATE_STEM_BY_MODEL_TYPE in src/fragnnet/runner.py -- frag_gnn (aliases
# fraggnet, fragnnet), mass_shatter, neims, massformer, iceberg_gen, iceberg_inten, graff,
# precursor, gnn, mces_pretraining, clip, spec_mol_clip_pretraining.
model_type: frag_gnn
num_hs: 4  # Number of hydrogen transfer options
int_embedder: abs-sines  # Integer embedder: ["abs-sines", "fourier-sines", "fourier", "rbf", "one-hot", "learnt"]
int_embedder_tight: False  # Use tight integer range for embeddings
output_formula_str: False  # Output formula as string (slower but useful for debugging)

# ============================================================================
# Molecular GNN Configuration
# NOTE: If using MCES pre-training, these MUST match the pre-training config
# ============================================================================
mol_hidden_size: 256  # Hidden dimension for molecular GNN
mol_num_layers: 4  # Number of GNN layers for molecular encoding
mol_gnn_type: GINE  # GNN architecture: ["GINE", "GINE_GSA", "GINE_GRAPHORMER", "GINE_GATED", "Graphormer", "GAT", "GATv2", "GGNN", "MPNN", "NodeMLP"]
mol_dropout: 0.0  # Dropout rate for molecular GNN
mol_normalization: batch  # Normalization: ["batch", "layer", "graph", "none"]; Graphormer requires "layer"
mol_pool_type: none  # Pooling: ["sum", "mean", "max", "attention", "softmax", "set_transformer", "equilibrium", "mean_max_sum", "mean_std_softmax", "none"]
mol_num_heads: 4  # Attention heads (GINE_GSA/GINE_GRAPHORMER/Graphormer); must divide mol_hidden_size
mol_max_degree: 64  # Graphormer: largest atom degree the degree embedding distinguishes
mol_max_spatial_distance: 128  # Graphormer: largest shortest-path distance the spatial embedding distinguishes
mol_multi_hop_max_distance: 5  # Graphormer: leading bonds encoded along each shortest path
mlp_hidden_size: 256  # Hidden dimension for MLP layers
mlp_dropout: 0.0  # Dropout rate for MLP
mlp_num_layers: 2  # Number of MLP layers
mlp_use_residuals: True  # Use residual connections in MLP
ff_prec_mz_offset: 0 #5
ff_bidirectional: True
ff_output_map_size: -1  # Low-rank size (-1 = standard Linear layers, >0 = LowRankDense with this rank)
ff_output_activation: relu  # Output activation: "relu" or "sigmoid"
# ============================================================================
# other training options
# ============================================================================
lr: 0.0001
lr_schedule: False
lr_schedule_type: exponential  # "exponential" or "cosine"
lr_total_steps: null           # required for cosine; set to max_epochs * steps_per_epoch
lr_min_ratio: 0.0              # cosine: final LR as fraction of peak (e.g. 0.01)
weight_decay: 0.01
lr_decay_rate: 0.95
lr_warmup_steps: 1000
lr_decay_steps: 5000
optimizer: adamw
output_distribution: gaussian
loss_type: cross_entropy
loss_vectorized: False
loss_tolerance_rel: 0.00001 # 10 ppm
loss_tolerance_abs: #0.001
loss_batch_size: 32
loss_tolerance_min_mz: 200.0
# Per-instrument-type tolerance override. When set, overrides loss_tolerance_rel/abs for
# specific instrument types. All entries must use relative tolerance (rel + min_mz).
# The QTOF floor of 0.015 Da covers NIST23 floor-truncated m/z (up to 0.009 Da error).
# Example:
# inst_type_loss_tol:
#   FT:   {rel: 1.0e-5, min_mz: 200.0}   # 10 ppm, floor 0.002 Da (same as global default)
#   QTOF: {rel: 2.0e-5, min_mz: 750.0}   # 20 ppm, floor 0.015 Da (covers truncation artifact)
inst_type_loss_tol: # null = use global loss_tolerance_rel/abs for all inst types
auxiliary_scores:
  - cos_sim
  - recall
  - wrecall
  - opt_cos_sim
  - true_spec_e
  - true_spec_ne
  - pred_spec_e
  - pred_spec_ne
  - cos_hun
  - precision
  - ndcg
  - jss
  - jss_hun
  - true_oos_prob
  - true_oos_e
# Target/true-spectrum filtering during SpectrumPL preprocessing.
# target_rel_ints_thresh: per-spectrum relative threshold (0.0-1.0); e.g. 0.01 drops peaks
#   below 1% of that spectrum's maximum intensity.
target_rel_ints_thresh: 0.0
train_target_top_k_peaks: -1
train_target_drop_min_int_peak: False
eval_target_apply_train_rank_filters: False
mz_max: 1500.0  # also used for the bin-specific secondary loss
mz_bin_res: 0.01 # also used for the bin-specific secondary loss
eval_mz_bin_res:
  - 0.1
  - 0.01
eval_bin_sqrt: False
eval_bin_remove_prec_peaks: False
eval_hun_sqrt: False
eval_hun_remove_prec_peaks: False
sum_ints: True
ints_transform: none # none, sqrt, log10, log10t3, loge
train_batch_size: 16
eval_batch_size: 16
accelerator: cpu
devices: auto
logging:
  - console
  - wandb
num_workers: 7
pin_memory: True
min_epochs: 1
max_epochs: 1
gradient_clip_val: 5.0
gradient_clip_algorithm: norm
accumulate_grad_batches: 1
precision: 32 # 64, 16-mixed, bf16-mixed
debug_overfit: False
debug_overfit_batches: 10
log_every_n_steps: 0
# ============================================================================
# Loss Weights Configuration
# ============================================================================
primary_loss_weight: 1.0
# Online adjacent-CE base-winner supervision. The v1 loss is training-only and, when enabled,
# requires batch_sampler_type: ce_context, plus ce_pair_min_endpoint_confidence set and
# target_rel_ints_thresh in (0, 1).
ce_pair_loss_weight: 0.0
ce_pair_min_endpoint_confidence: null
# Reserved for the replicate audit; non-null values fail until the table is wired.
ce_pair_min_endpoint_reliability: null
ce_pair_subset: switches
ce_pair_eligible_inst_types: [FT]
ce_pair_eligible_prec_types: ["[M+H]+", "[M-H]-"]
# Same-fragment adjacent-eV delta supervision for MASShatter. Requires shared
# proposals, unique-fragment mode, and CE-context batches.
cross_ev_fragment_loss_weight: 0.0
# nb (isotope) options; set the nb_* entropy weights below to 0 to disable.
nb_iso: False
# DAG-based models only; MASShatter has no OOS class.
predict_oos: False
oos_tolerance_multiple: -1
# DAG-based models only; ignored by MASShatter's candidate-conditional loss.
oos_loss: False
# ============================================================================
# PyTorch Lightning Configuration
# ============================================================================
seed: 42
detect_anomaly: False
debug_validate_outputs: False
automatic_optimization: True
profiler: none
profiler_wait_steps: 10
profiler_warmup_steps: 2
profiler_active_steps: 12
profiler_repeat: 0
profiler_skip_first_steps: 0
compile: False
num_log_train_images: 0
num_log_val_images: 0
deterministic: False
drop_last: False
num_sanity_val_steps: 0
# -- Collision Energy (CE) Configuration --
ce_insert_type: id # CE insert type: ["id","lin","embed","embed_clamped","bin"]
ce_insert_location: none # FraGNNet: none, mol, mlp, or mol,mlp (frag insertion unsupported)
ce_insert_merge: False # FraGNNet: mean-pool CE-reading embeddings within each spectrum
ce_insert_size: 32 # Dimension of CE embedding (must match MCES config if using pre-training)
context_insert_location: mol,mlp  # where to inject the context vector (mol and/or mlp)
# Rough approximations from NIST20 Orbitrap/FT MS
nce_max: 200  # Maximum NCE value for normalization/binning
nce_mean: 60  # Mean NCE for normalization (dataset-specific)
nce_std: 40   # Standard deviation of NCE for normalization (dataset-specific)
# Rough approximations from NIST20 QToF (ACE values, use_ace only)
ace_max: 100  # Maximum ACE value (eV) for normalization/binning
ace_mean: 20  # Mean ACE value (eV) for normalization (dataset-specific)
ace_std: 15   # Standard deviation of ACE for normalization (dataset-specific)
# Rough approximations from NIST20 QToF (alternative NCE values)
# nce_mean: 20
# nce_std: 10
# nce_max: 60
# -- Precursor Type Configuration --

prec_insert_location: none  # Where precursor type is inserted: ["none", "mol", "mlp"]; "frag" is rejected
prec_insert_size: 32  # Dimension of precursor type embedding (must match MCES config if using pre-training)
# -- Instrument Type Configuration --

inst_insert_location: none  # Where instrument type is inserted: ["none", "mol", "mlp"]; "frag" is rejected
inst_insert_size: 32  # Dimension of instrument type embedding (must match MCES config if using pre-training)
# -- Fragmentation Mode Configuration --

frag_mode_insert_location: none  # Where frag-mode embedding is inserted: ["none", "mol", "mlp"]
frag_mode_insert_size: 8         # Dimension of frag-mode embedding
# Combined context (stratum) embedding: consolidate CE + adduct + instrument + frag_mode into
# ONE learned vector injected at context_insert_location, instead of four separate *_insert
# paths (see docs/plans/conditioning_refactor_plan.md). When True, the individual metadata embeddings
# feed the context and are NOT injected separately. Off = existing per-metadata behavior.
context_embedding: False
context_embedding_dim: 64       # width of the produced context vector
context_embedding_hidden_dim: 64  # hidden width of the combining MLP
# This model's Lightning wrapper passes spec_params.nce/ace as the model's use_nce/use_ace
# arguments; these top-level keys do not override that wiring. When both model arguments
# are True, the two CE embeddings are concatenated, doubling the CE dim.
use_nce: True
use_ace: False

# ============================================================================
# Finetune Configuration
# ============================================================================
finetune: False

# ============================================================================
# Additional Training Options
# ============================================================================
dynamic_batch_sampler: False
batch_sampler_type: spec_mol_frag  # [spec_mol_frag, ce_context]
dynamic_batch_sampler_mode: frag_node
dynamic_batch_sampler_max: 100000
ce_context_spectra_per_context: 5
ce_context_ce_key_by_inst:
  FT: nce
  QTOF: ace
  IT: nce
# Curriculum learning: begin at a whole-dataset node-count quantile and linearly
# add larger DAGs. At dag_size_curriculum_epochs, the full training set is eligible.
dag_size_curriculum: False
dag_size_curriculum_start_fraction: 0.25
dag_size_curriculum_epochs: 10  # Must be less than max_epochs when enabled.
# MASShatter curriculum: begin with low-heavy-bond precursors and linearly add
# larger molecules. This is training-only and requires fixed-size, non-group batches.
bond_size_curriculum: False
bond_size_curriculum_start_fraction: 0.25
bond_size_curriculum_epochs: 20  # Must be less than max_epochs when enabled.
dual_group_dynamic_batch_sampler: False
dual_group_dynamic_batch_sampler_mode: frag_node
dual_group_dynamic_batch_sampler_max: 100000
# Number of distinct group-1 keys (adduct + mol_id) to seed per batch.
# Each key contributes up to dual_group_sampler_k1_per_key spectra.
dual_group_sampler_k1: 1
# Number of distinct group-2 keys (adduct + formula) to seed per batch.
# Each key contributes up to dual_group_sampler_k2_per_key spectra.
# Group-2 seeds isomer contrast: a different molecule with the same formula lands
# alongside the group-1 anchor.
dual_group_sampler_k2: 1
# Maximum spectra to take from each group-1 key (same adduct + mol_id).
# Setting this > 1 places multiple spectra of the same molecule (e.g. different CEs)
# in a single batch, creating same-molecule pairs for pairwise similarity losses.
# Total group-1 slots per batch = k1 * k1_per_key.
dual_group_sampler_k1_per_key: 1
# Maximum spectra to take from each group-2 key (same adduct + formula).
# Usually 1 is sufficient; the isomer contrast is provided by the key itself,
# not by multiple spectra of the same isomer.
dual_group_sampler_k2_per_key: 1
group_sampler: False
group_sampler_max_per_group: 3
simple_group_sampler: False
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group #[group, mol, group_mol, adduct_inst_type, adduct_inst_type_group, adduct_inst_type_frag_mode, adduct_inst_type_frag_mode_group]
formula_prec_type_group_sampler: False
formula_prec_type_group_sampler_max_per_group: 5
mp_sharing_strategy: file_descriptor
check_gradient_norm: False
use_tensor_float32: False
nan_module_hook: False
checkpoint_metric: epoch
checkpoint_metric_mode: max
checkpoint_save_last: True  # Keep the final checkpoint for resume/debugging.
checkpoint_every_n_epochs: 1  # Save a checkpoint every n epochs.
checkpoint_save_top_k: 1  # Keep the best k checkpoints by checkpoint_metric.
# Modes:
# - online: set upload_checkpoints=True to upload checkpoints to W&B artifacts.
# - offline/local-only: keep upload_checkpoints=False and store checkpoints on disk.
# - no checkpoints: set disable_checkpoints=True for fast debug runs.
# - cleanup after training: set delete_checkpoints=True if checkpoints are temporary.
upload_checkpoints: False  # Upload checkpoints to W&B artifacts when running online.
disable_checkpoints: False  # Disable checkpoint saving entirely.
delete_checkpoints: False  # Delete checkpoint files after training finishes.
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
sparse_cosine_similarity: False
train_sample_weight: none
eval_sample_weight: none
log_hist_metrics: False
log_adduct_inst_ce_metrics: False  # log per-(adduct×inst, CE-bin) metrics to wandb (val: bar chart, test: table)
log_adduct_inst_ce_min_count: 20  # min spectra per group to include in the table/chart
report_metric_std: False
track_datapoint_metrics: False
compute_train_auxiliary_metrics: False  # also compute auxiliary_scores (cos_sim, cos_hun, pred_node_count, etc.) on train, not just val/test -- adds eval-tensor overhead to every train batch
gaussian_renormalize: False
pm_tolerance_multiple: 3.0
activation_checkpointing: False

log_zero_fp16: null
log_zero_fp32: null
share_memory: False
log_min: 0.000000001 # 1e-9
eval_test_split: False

# ============================================================================
# Precursor-pair loss
# ============================================================================
# Read by SpectrumPL/FraGNNetPL, not by `model_type: precursor`, so every template carries it.
# Within-spectrum low-CE precursor-versus-strongest-supported-fragment supervision.
precursor_pair_loss_weight: 0.0
precursor_pair_nce_min: 0.0
precursor_pair_nce_max: 20.0
# Relative to the observed base peak; used when no precursor peak is observed.
precursor_pair_absent_intensity_floor: 0.01
precursor_pair_eligible_inst_types: [FT]
precursor_pair_eligible_prec_types: ["[M+H]+", "[M-H]-", "[M+Na]+", "[M+Cl]-"]

# ============================================================================
# fragnnet-specific configuration
# ============================================================================
frag_params:
  pyg: True
  pyg_node_feats:
    - cc              # mol_embedder atom embeddings pooled over fragment atoms
    - base_formula    # fragment's elemental formula (one-hot)
    - depth           # depth of fragment in the DAG
    - h_formulae_idx  # index into list of possible H-shifted formulae
    # - cmf_h_formulae_idx  # CMF-derived H-formula index (filled at dataset load time)
    # - h_counts            # explicit H counts per fragment atom
    # - nb_iso_idx          # isotope index; requires nb_iso=True
    # - num_cut_bonds       # how many bonds were broken to make this fragment. NO-OP on plain
    #                       # single-bond BFS DAGs (cut count == depth there); only informative
    #                       # on multi-cut DAGs (_mbfs / _ringmerge / SMARTS prepass)
    # - rdbe                # ring-and-double-bond equivalents, 1 + sum_i n_i*(v_i-2)/2.
    #                       # REQUIRES base_formula + h_counts (base_formula has no H column);
    #                       # h_counts adds a DAG column but contributes 0 feature dims
    # - neutral_loss_formula # precursor formula minus this fragment's; REQUIRES base_formula + depth
    # - frag_q              # summed Gasteiger charge over the fragment's atoms; computed on-the-fly
    # - out_degree          # DAG out-degree of the fragment node
    # - in_degree           # DAG in-degree of the fragment node
    # - num_heavy_atoms     # heavy-atom count of the fragment
    # - boundary_cc         # atoms at cut bonds; computed on-the-fly from mol graph, not stored in DAG
    # - boundary_pair       # cut-bond pair encoding pooled over precomputed cut atom pairs; superseded by cut_bond
    # - cut_bond            # cut bonds as (retained, lost) pairs; see cut_bond_hidden_dim below
  pyg_edge_feats:
    - cc
    - base_formula
    # - h_range
  pyg_edges: True
  pyg_bigraph: True
  num_isotopes: 1
  formula_peak_mzs: True
  formula_peak_probs: True
  formula_str: False
  compressed: True
  preload: False
  preprocess: False
  # Per-molecule LRU of processed neutral DAGs, used whenever preload/preprocess are off
  # (which apply_inference_config forces for every inference run). __getitem__ is
  # per-spectrum but a DAG is per-molecule, so without this every collision energy of a
  # molecule re-reads and re-builds the same graph. 0 disables.
  cache_size: 16
  include_cmf: False

num_depth: 5  # Maximum fragmentation depth for DAG
num_elements: 17  # Number of elements including H (16 heavy: 11 base + As + B + Hg + Sn + Pb)
# GINE_GATED: each bond's message is scaled by a context-conditioned scalar gate in [0, 2], so
# which bonds conduct can change with CE/adduct instead of context only rescaling the output.
# Requires context_embedding: True (supplies the conditioning vector). Zero-init => gate == 1.0
# at init, i.e. bit-identical to GINE, so it is a strict superset. Ignored for other gnn_types.
mol_msg_gate_mode: static  # ["static", "dynamic"] — static: one gate from (bond, context),
                           # reused every layer. dynamic: recomputed per layer, also sees the
                           # live hidden states (x_src, x_dst); subsumes static, costs one gate
                           # MLP per layer.
mol_msg_gate_hidden_dim: 64  # Hidden width of the gate MLP(s)
# Hidden width of the cut_bond encoder MLP (frag_params.pyg_node_feats: cut_bond).
# cut_bond replaces boundary_pair: boundary_pair encodes a cut bond as Linear(cat(in, out)),
# which is additive and commutes through pooling, so the pooled feature collapses to
# Linear(mean(inside_atoms), mean(outside_atoms)) and WHICH atom bonded to which is lost.
# cut_bond adds an in*out interaction plus a hidden nonlinearity. Same output width and
# pooling as boundary_pair, and it reuses the same precomputed cut-bond indices, so it is a
# drop-in swap needing no DAG regeneration.
cut_bond_hidden_dim: 256

# ============================================================================
# Inter-stage Configuration (Mol → Frag connection)
# ============================================================================
cc_interstage_type: direct  # How to combine mol and frag embeddings: ["add", "sub", "linear", "direct", "gated", "mlp", "bilinear"]
cc_interstage_use_rest: False  # Whether to use rest of molecule embedding
cc_feature_dropout: 0.0  # Training-only batch-level dropout for full-fragment cc node feature group
# Training-only dropout over pooled cc embedding dimensions. One inverted-dropout mask is shared
# across all fragments in the batch, so it directly regularizes the mean-pooled cc fingerprint.
cc_channel_dropout: 0.0
# Training-only PER-ATOM dropout on the cc mask: independently drop each atom from a fragment's
# atom-membership set, so the pooled cc embedding sees a random subset of the fragment's atoms.
# Regularizes against memorizing exact atom sets (aimed at the train->val gap). Much finer-grained
# than cc_feature_dropout (which drops the whole cc group for the whole batch on one scalar draw).
# boundary_cc / boundary_pair keep the true mask. Fragments are never fully emptied.
cc_atom_dropout: 0.0

# ============================================================================
# Fragment GNN Configuration
# ============================================================================
frag_hidden_size: 256  # Hidden dimension for fragment GNN
frag_num_layers: 4  # Number of GNN layers for fragment encoding
frag_gnn_type: GINE  # GNN architecture for fragments: ["GINE", "GINE_GSA", "GINE_GRAPHORMER", "GINE_GATED", "Graphormer", "GAT", "GATv2", "GGNN", "MPNN", "NodeMLP"]
frag_dropout: 0.0  # Dropout rate for fragment GNN
frag_normalization: batch  # Normalization: ["batch", "layer", "graph", "none"]
frag_pool_type: none  # Pooling: ["sum", "mean", "max", "attention", "softmax", "set_transformer", "equilibrium", "mean_max_sum", "mean_std_softmax", "none"]; multi-stat pools expand feature width
frag_embed_combine: cat  # How to combine fragment embeddings: ["cat", "avg"]
frag_pool_combine: subtract  # How to combine pooled features: ["add", "subtract", "concat", "none"]; use "none" with frag_pool_type in ["mean_max_sum", "mean_std_softmax"]

# ============================================================================
# MLP/Output Configuration
# ============================================================================
mlp_output_format: formula  # Output format: ["formula", "peak"]
candidate_ion_head: False  # Score each (node, H/formula-channel) candidate row with ion identity features, then reshape to the usual logits
candidate_ion_formula_features: True  # Add reconstructed candidate formula features; requires h_counts in frag_params.pyg_node_feats
candidate_ion_neutral_loss_features: True  # Add precursor_formula - candidate_formula features; requires depth and candidate formula features
candidate_ion_chunk_size: 32768  # Candidate rows scored at once; lower this if large DAGs OOM
candidate_ion_checkpoint: True  # Checkpoint candidate chunks during training to avoid retaining every chunk activation
ion_channel_factorized: False  # Cheap alternative: keep per-node H logits and add a low-rank learned H/CMF-channel residual
ion_channel_adduct_gated: False  # Adduct-conditioned variant: gate the low-rank node factor by spec_prec_type for a node x channel x adduct residual (mutually exclusive with ion_channel_factorized)
ion_channel_rank: 32
# FraGNNet-only supervised support gate. A separate sigmoid head attenuates the
# existing joint intensity logits; the spectrum remains normalized by softmax.
fragnnet_formula_support: False
fragnnet_formula_support_initial_probability: 0.99
fragnnet_formula_support_loss_weight: 0.0
fragnnet_formula_support_attribution: gaussian_posterior  # ["gaussian_posterior", "hungarian"]
fragnnet_formula_support_threshold: 0.5  # Absolute sigmoid probability; hard selection is eval/inference-only
# Rank fragments by their aggregate real-channel logits, then use a context-conditioned
# transformer to add one residual shared by every valid channel of each selected fragment.
frag_competition: False
frag_competition_top_k: 128
frag_competition_hidden_dim: 64
frag_competition_layers: 2
frag_competition_heads: 4
frag_competition_dropout: 0.1
# Detaching shared-model inputs avoids unstable gradients from the competition transformer.
frag_competition_detach_encoder: True
frag_competition_max_delta: 5.0
mlp_normalization: none  # Normalization for MLP: ["batch", "layer", "none"]
bin_output: False
# H(P(formula)): penalizes spread across empirical formulas. Indirect effect on peak sparsity
# since multiple nodes can share the same formula. Raw scale — grows with number of formulas.
formula_entropy_weight: 0.0
# H(P(node)): penalizes spread across DAG fragment nodes. Most direct lever for reducing tiny
# peaks — pushes the model to concentrate mass on fewer fragments. Raw scale — grows with DAG size.
node_entropy_weight: 0.0
# H(P(node | formula)): penalizes uncertainty in which node is chosen given a formula.
# Reduces "when a formula fires, its mass spreads across multiple nodes". Raw scale.
node_formula_entropy_weight: 0.0
# H(P(formula | node)): penalizes uncertainty in formula assignment given a node.
# Reduces ambiguity in formula labeling per fragment node. Raw scale.
formula_node_entropy_weight: 0.0
# H(P(node, formula)): joint entropy = H(node) + H(node|formula). Penalizes both marginal
# node spread and per-formula node spread together. Raw scale.
joint_entropy_weight: 0.0
# Same as formula_entropy_weight but normalized to [0,1] by log(num_formulas).
# Preferred over raw — comparable across molecules with different formula counts.
formula_normalized_entropy_weight: 0.0
# Same as node_entropy_weight but normalized to [0,1] by log(num_nodes).
# Preferred over raw — comparable across molecules with different DAG sizes.
# Start here when tuning for peak sparsity (e.g. 0.01).
node_normalized_entropy_weight: 0.0
# Same as node_formula_entropy_weight but normalized to [0,1].
node_formula_normalized_entropy_weight: 0.0
# Same as formula_node_entropy_weight but normalized to [0,1].
formula_node_normalized_entropy_weight: 0.0
# Same as joint_entropy_weight but normalized to [0,1].
joint_normalized_entropy_weight: 0.0
# pairwise losses
pairwise_cosine_loss_weight: 0.0 
pairwise_jss_loss_weight: 0.0
pairwise_cross_entropy_loss_weight: 0.0
# cross-matrix JSS contrastive: JSS-sqrt(real_i, pred_j), InfoNCE row-wise
cross_jss_contrastive_loss_weight: 0.0
cross_jss_contrastive_temperature: 0.07
cross_jss_contrastive_sqrt: true
nb_node_entropy_weight: 0.0
nb_node_formula_entropy_weight: 0.0
nb_formula_node_entropy_weight: 0.0
nb_joint_entropy_weight: 0.0
nb_node_normalized_entropy_weight: 0.0
nb_node_formula_normalized_entropy_weight: 0.0
nb_formula_node_normalized_entropy_weight: 0.0
nb_joint_normalized_entropy_weight: 0.0
nb_node_node_entropy_weight: 0.0
nb_node_node_normalized_entropy_weight: 0.0
# edge losses
skip_edge_loss: True
edge_h_range_loss_weight: 0.0
edge_h_transfer_loss_weight: 0.0
edge_h_range_loss_fn: linear # do not make exponential!
edge_h_transfer_loss_fn: linear
edge_entropy_weight: 0.0
edge_normalized_entropy_weight: 0.0
mask_null_formula: True
null_loss: False
null_loss_weight: 1.0
frag_mode_scale: False           # Enable mode-conditioned affine output scaling layer
# Note: frag_modes list is declared under spec_params.frag_modes (e.g. ["HCD", "CID"]);
# unknown modes fall back to embedding index num_frag_modes.

# CE-conditioned FiLM output scaling (temperature-style)
ce_scale: False              # Enable CE-conditioned FiLM scaler on logits before softmax
ce_scaler_hidden_dim: 64     # Hidden dim of the CE→FiLM MLP
depth_ce_bias: False         # §3c: CE×depth prior — per-depth logit bias conditioned on CE

# Categorical FiLM output scaling (adduct type and acquisition stratum)
adduct_scale: False           # §3a: Enable adduct-type FiLM output scaling (prec_type token)
stratum_scale: False          # §3b: Enable combined inst/frag_mode/adduct FiLM output scaling
stratum_scaler_embed_dim: 16  # Embedding dim for each categorical axis in StratumScaler
finetune_pretrained_ckpt: none
finetune_strict_load: True
finetune_freeze_all_shared: False  # Whether to freeze all shared components, if False, specify below
finetune_freeze_components: ["mol_embedder", "mol_pool"] # Optional
finetune_shared_all: False  # Whether to share all components, if False, specify below
finetune_shared_components: ['mol_embedder', 'mol_pool'] # Optional 
finetune_weights_lr_ratio: 1.0 # Learning rate ratio for pretrained weights during fine-tuning
debug_zero_loss: False
# Skip the frag_real_* / nb_iso explainability marginals (P(n), P(f), P(f|n), P(n|f), P(h)) on
# TRAINING forwards to cut the forward-pass memory peak. Those marginals are consumed only by the
# entropy aux losses and by eval/inference, so this is a no-op on the trained model when they are
# off. Refuses to enable while an explainability loss is active. Eval/val/inference always compute
# them (so aux metrics are unaffected). Only enable when train aux metrics also don't need them.
skip_train_explainability: False
