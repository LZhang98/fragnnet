wandb_name: gnn_sam_0,1
wandb_tags:
- exp_gnn
- nist20v2
- d4
- wr00
- inchikey
- new_proc
- gnn
- new_metrics
- mz_bin_res_0,1
- no_auxiliary_scores
- preprocess

# data stuff
spec_fp: data/proc/nist20mona23v2/spec_df.pkl
mol_fp: data/proc/nist20mona23v2/mol_df.pkl
split_dp: data/split/nist20mona23v2_d4_wr00_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
mol_params:
  fingerprint_morgan: False
  fingerprint_rdkit: False
  fingerprint_maccs: False
  fingerprint: False
  pyg: True
  preprocess: True
  pyg_pe_embed_k: 19
frag_params:
  pyg: False

# model stuff
model_type: gnn
mol_hidden_size: 512
mol_num_layers: 4
mol_gnn_type: GGNN
mol_normalization: none
mol_dropout: 0.0
mol_pool_type: mean
mlp_normalization: none
mlp_hidden_size: 512
mlp_dropout: 0.0
mlp_num_layers: 0
mlp_use_residuals: False
ff_prec_mz_offset: 5
ff_bidirectional: True
ff_output_map_size: -1
ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 16
mz_max: 1500.0
mz_bin_res: 0.1
sum_ints: True

# loss stuff
loss_type: cosine_distance
sparse_cosine_similarity: True
ints_transform: sqrt

# optimization stuff
train_batch_size: 64
eval_batch_size: 64
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.00052
weight_decay: 0.0000001
accelerator: gpu
devices: 1
min_epochs: 200
max_epochs: 200
lr_schedule: True
lr_decay_rate: 0.767
lr_warmup_steps: 1000
lr_decay_steps: 5000
debug_overfit: False
upload_checkpoints: False
delete_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
# auxiliary_scores:
# - cos_sim
# eval_mz_bin_res:
# - 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
compile: True
optimizer: adam
