# Matched flat GINE-1 control for the global-ranking measurement gates.
# This is the existing NIST20 ma/mi baseline with only the fragment encoder and
# its memory-matched dynamic batching changed. Use --min_intensity 0 when
# exporting predictions; inference filtering is intentionally not a train key.

wandb_name: nist20_inchikey_fraggnn_d3_ma_mi_all_gine1
wandb_tags:
  - retrieval
  - nist20
  - d4
  - wr00
  - inchikey
  - new_proc
  - fraggnn_d3
  - dynamic_sampler
  - new_metrics
  - frag_gine_d1
  - frag_dag_bigraph
  - no_edge_attrs
  - dynedge100k
  - oos_multiple_1
  - gaussian_renormalize
  - b256
  - vectorized_loss
  - lb32
  - preload
  - preprocess
  - skip_extra_losses
  - binned_cosine_similarity
  - m+h
  - m-h
  - m+na
  - m+cl
  - frag_mode
  - frag_mode_scale
  - ce_scale
  - nce
  - cmf
  - inst_tol
  - boundary_pair

split_dp: data/split/nist20_ma_mi_inchikey
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse_smpFalse/dags

num_depth: 4
frag_gnn_type: GINE
frag_num_layers: 1
mol_hidden_size: 384

frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
    - boundary_pair
  pyg_edge_feats: []
  pyg_edges: true
  pyg_bigraph: true
  preload: true
  preprocess: true
  include_cmf: true

spec_params:
  merge: false
  nce: true
  ace: true
  preprocess: true
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_types:
    - ORB
    - ORB_F
    - QTOF
    - IT
  frag_mode: true
  frag_modes:
    - HCD
    - CID

mol_params:
  preprocess: true
ce_insert_type: embed_clamped
ce_insert_location: mol
ce_insert_merge: true
prec_insert_location: mol
inst_insert_location: mol
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: true
ce_scale: true

train_batch_size: 256
eval_batch_size: 256
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100

mol_dropout: 0.1
frag_dropout: 0.1
mlp_dropout: 0.3

lr: 0.0004
lr_schedule_type: cosine
lr_warmup_steps: 5000
lr_total_steps: 390000
lr_min_ratio: 0.01

mask_null_formula: false
predict_oos: true
oos_tolerance_multiple: 1
oos_loss: true
gaussian_renormalize: true

sparse_cosine_similarity: true
mol_pool_type: mean
frag_pool_type: max
upload_checkpoints: true
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01

inst_type_loss_tol:
  ORB:
    rel: 1.0e-5
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-5
    min_mz: 200.0
  QTOF:
    rel: 2.0e-5
    min_mz: 750.0

use_tensor_float32: true
automatic_optimization: false
dynamic_batch_sampler: true
dynamic_batch_sampler_mode: frag_edge
dynamic_batch_sampler_max: 100000

group_sampler_max_per_group: 5
simple_group_sampler: true
loss_vectorized: true
