# ============================================================================
# W&B Logging
# ============================================================================
wandb_name: nist20_d3_ma_mi_jss_sqrt_template
wandb_group: nist20_d3_ma_mi_jss_sqrt_sweep
wandb_tags:
- nist20_d3_ma_mi_jss_sqrt_loss
- jss_loss
- sqrt_loss
- low_intensity

# ============================================================================
# Data File Paths
# ============================================================================
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse_smpFalse/dags

# ============================================================================
# Model Architecture
# Fixed to best values from nist20_d3_ma_mi_focused sweep.
# ============================================================================
num_depth: 4
num_hs: 4
frag_gnn_type: NodeMLP
mol_hidden_size: 384    # sweep: 4/5 top runs
mol_num_layers: 4
mol_gnn_type: GINE
mol_num_heads: 4        # used by GINE_GSA; ignored by GINE
mol_normalization: batch
mol_pool_type: mean

cc_interstage_type: direct
cc_interstage_use_rest: False

frag_hidden_size: 256
frag_num_layers: 4
frag_normalization: graph
frag_pool_type: max     # sweep: top 3 runs
frag_embed_combine: cat
frag_pool_combine: none

mlp_output_format: formula
mlp_hidden_size: 256
mlp_normalization: none
mlp_num_layers: 2
mlp_use_residuals: True

# ============================================================================
# Fragment DAG Parameters
# ============================================================================
frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
    - boundary_pair
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
  include_cmf: True

# ============================================================================
# Spectrum Parameters
# ============================================================================
spec_params:
  merge: False
  nce: True
  ace: False
  merge_keep_ces: False
  preprocess: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "ORB"
    - "ORB_F"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"

# ============================================================================
# Molecule Parameters
# ============================================================================
mol_params:
  preprocess: True
# ============================================================================
# Conditioning Embeddings
# ============================================================================
ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: True
ce_scale: True
ce_scaler_hidden_dim: 64

# ============================================================================
# Training Hyperparameters
# ============================================================================
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
accelerator: gpu
devices: 1
min_epochs: 30
max_epochs: 30
debug_overfit: False

# ============================================================================
# Regularization — defaults; lr/dropout/wd are swept
# ============================================================================
mol_dropout: 0.1
frag_dropout: 0.1
mlp_dropout: 0.3
weight_decay: 0.01

# ============================================================================
# Optimization
# ============================================================================
lr_schedule: False
lr: 0.0004
lr_schedule_type: cosine
lr_warmup_steps: 5000
lr_total_steps: 390000
lr_min_ratio: 0.01
lr_decay_rate: 0.95
lr_decay_steps: 5000

# ============================================================================
# Loss Configuration
# jss_distance + sqrt transform: JSS minimizes the JS divergence between
# predicted and true distributions; sqrt upweights low-intensity peaks.
# ============================================================================
loss_type: jss_distance
ints_transform: sqrt
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
node_normalized_entropy_weight: 0.01

# ============================================================================
# Spectrum Binning & Evaluation
# ============================================================================
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
upload_checkpoints: False
disable_checkpoints: True
delete_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
  - jss
eval_mz_bin_res:
  - 0.01
eval_bin_sqrt: True

inst_type_loss_tol:
  ORB:   {rel: 1.0e-5, min_mz: 200.0}
  ORB_F:   {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# ============================================================================
# PyTorch / Lightning Options
# ============================================================================
precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: True

# ============================================================================
# Group Sampler
# ============================================================================
group_sampler: False
group_sampler_max_per_group: 5
simple_group_sampler: True
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group

# ============================================================================
# Miscellaneous
# ============================================================================
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
activation_checkpointing: False
compile: False
pin_memory: True
loss_vectorized: True
loss_batch_size: 16
