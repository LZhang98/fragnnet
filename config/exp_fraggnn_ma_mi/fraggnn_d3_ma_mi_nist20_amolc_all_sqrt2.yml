# ============================================================================
# W&B Logging
# ============================================================================
wandb_name: nist20_inchikey_fraggnn_d3_ma_mi_all_sqrt2
wandb_tags:
- retrieval
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- dynamic_sampler
- new_metrics
- nodemlp
- oos_multiple_1
- gaussian_renormalize
- b256          # batch size 256
- vectorized_loss
- lb16          # loss batch size 16
- preload
- preprocess
- new_no_edges  # no edge features in fragment GNN
- skip_extra_losses
- binned_cosine_similarity
- m+h
- m-h
- m+na
- m+cl
- frag_mode     # HCD/CID conditioning token
- frag_mode_scale  # mode-conditioned affine output scaling
- ce_scale      # CE-conditioned FiLM scaler
- nce
- cmf           # charge-migration fragments included
- inst_tol      # per-instrument loss tolerance
- boundary_pair   # boundary_pair node feature in fragment GNN

# ============================================================================
# Data File Paths
# ============================================================================
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey   # inchikey split: [M+H]+ and [M-H]- adducts
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse_smpFalse/dags  # depth-3 DAGs, ±4 H-transfers, no isotopes

# ============================================================================
# Model Architecture
# Fixed to best values from nist20_d3_ma_mi_sqrt sweep.
# ============================================================================
num_depth: 4
num_hs: 4
frag_gnn_type: NodeMLP
mol_hidden_size: 384    # top-4/5 runs in sqrt sweep
mol_num_layers: 4
mol_gnn_type: GINE
mol_normalization: batch
mol_pool_type: mean

cc_interstage_type: direct
cc_interstage_use_rest: False

frag_hidden_size: 256
frag_num_layers: 4
frag_normalization: graph
frag_pool_type: max     # top-3 runs in sqrt sweep
frag_embed_combine: cat
frag_pool_combine: none

mlp_output_format: formula
mlp_hidden_size: 256
mlp_normalization: none
mlp_num_layers: 2
mlp_use_residuals: True

# ============================================================================
# Fragment DAG Parameters
# ============================================================================
frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
    - boundary_pair
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
  include_cmf: True

# ============================================================================
# Spectrum Parameters
# ============================================================================
spec_params:
  merge: False
  nce: True
  ace: False
  merge_keep_ces: False
  preprocess: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"

# ============================================================================
# Molecule Parameters
# ============================================================================
mol_params:
  preprocess: True

# ============================================================================
# Conditioning Embeddings (CE / Precursor / Instrument / Frag-mode)
# All inserted at the mol encoder input ("mol" location)
# ============================================================================
ce_insert_type: embed_clamped         # learned CE embedding (vs. linear/bin)
ce_insert_location: mol       # inject into molecule encoder input
ce_insert_merge: True         # merge embeddings when injected at multiple locations
ce_insert_size: 32            # CE embedding dimension
prec_insert_location: mol     # inject precursor-type embedding into molecule encoder
prec_insert_size: 32
inst_insert_location: mol     # inject instrument-type embedding into molecule encoder
inst_insert_size: 32
frag_mode_insert_location: mol  # inject frag-mode embedding into molecule encoder
frag_mode_insert_size: 32
frag_mode_scale: True         # enable mode-conditioned affine scaling on output logits
ce_scale: True                # enable CE-conditioned FiLM scaler on output logits
ce_scaler_hidden_dim: 64      # hidden dim of CE→FiLM MLP

# ============================================================================
# Training Hyperparameters
# ============================================================================
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
debug_overfit: False

# ============================================================================
# Regularization — mol_dropout fixed from sqrt sweep; others swept
# ============================================================================
mol_dropout: 0.1     # clear winner in sqrt sweep (all top-5 runs)
frag_dropout: 0.2
mlp_dropout: 0.3
weight_decay: 0.001

# ============================================================================
# Optimization
# ============================================================================
lr_schedule: False
lr: 0.0007           # center of top-performing range in sqrt sweep (0.0006–0.001)
lr_schedule_type: cosine
lr_warmup_steps: 5000
lr_total_steps: 390000
lr_min_ratio: 0.01
lr_decay_rate: 0.95
lr_decay_steps: 5000

# ============================================================================
# Loss Configuration
# ============================================================================
ints_transform: sqrt
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
node_normalized_entropy_weight: 0.01

# ============================================================================
# Spectrum Binning & Evaluation
# ============================================================================
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
upload_checkpoints: False
disable_checkpoints: True
delete_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
  - jss
  - true_spec_ne
  - pred_spec_ne
eval_mz_bin_res:
  - 0.01
eval_bin_sqrt: True

inst_type_loss_tol:
  FT:   {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# ============================================================================
# PyTorch / Lightning Options
# ============================================================================
precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: True
dynamic_batch_sampler_mode: frag_node
dynamic_batch_sampler_max: 200000

# ============================================================================
# Group Sampler
# ============================================================================
group_sampler: False
group_sampler_type: group
group_sampler_max_per_group: 5
simple_group_sampler: True
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group

# ============================================================================
# Miscellaneous
# ============================================================================
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
activation_checkpointing: False
compile: False
pin_memory: True
loss_vectorized: True
loss_batch_size: 16
