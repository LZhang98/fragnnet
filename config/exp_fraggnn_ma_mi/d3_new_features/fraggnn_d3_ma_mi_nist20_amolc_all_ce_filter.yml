# ============================================================================
# W&B Logging
# ============================================================================
wandb_name: nist20_inchikey_fraggnn_d3_ma_mi_all_ce_filter
wandb_tags:
- retrieval
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- dynamic_sampler
- new_metrics
- nodemlp
- oos_multiple_1
- gaussian_renormalize
- b256
- vectorized_loss
- lb16
- preload
- preprocess
- new_no_edges
- skip_extra_losses
- binned_cosine_similarity
- m+h
- m-h
- m+na
- m+cl
- frag_mode
- frag_mode_scale
- ce_scale
- nce
- cmf
- inst_tol
- boundary_pair
- ce_filter           # per-instrument CE range filter applied at dataset load
- nce_0_60           # FT: keep NCE in [0, 60]
- qtof_ace_0_40      # QTOF: keep ACE in [0, 40 eV]

# ============================================================================
# Data File Paths
# ============================================================================
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse_cmf/dags

# ============================================================================
# Model Architecture
# ============================================================================
num_depth: 4
num_hs: 4

# ============================================================================
# Fragment DAG Parameters
# ============================================================================
frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
    - boundary_pair
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
  include_cmf: True

# ============================================================================
# Spectrum Parameters
# ============================================================================
spec_params:
  merge: False
  nce: True
  ace: False            # filter_ce_by_inst reads raw ace column from pickle (QTOF always has it)
  merge_keep_ces: False
  preprocess: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  # Per-split CE + adduct filters applied at dataset load time.
  # val and test receive no filter so evaluation covers the full held-out set.
  split_filters:
    train:
      filter_ce_by_inst:
        FT:   {nce_min: 0, nce_max: 60}    # drop FT spectra outside NCE 0-60%
        QTOF: {ace_min: 0, ace_max: 40}    # drop QTOF spectra outside ACE 0-40 eV
    val: 
      filter_ce_by_inst:
        FT:   {nce_min: 0, nce_max: 60}    # drop FT spectra outside NCE 0-60%
        QTOF: {ace_min: 0, ace_max: 40}    # drop QTOF spectra outside ACE 0-40 eV
    test: {}

# ============================================================================
# Molecule Parameters
# ============================================================================
mol_params:
  preprocess: True

# ============================================================================
# Conditioning Embeddings
# ============================================================================
ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: True
ce_scale: True
ce_scaler_hidden_dim: 64

# ============================================================================
# Training Hyperparameters
# ============================================================================
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
debug_overfit: False

# ============================================================================
# Molecular GNN Configuration
# ============================================================================
mol_hidden_size: 128
mol_num_layers: 4
mol_gnn_type: GINE
mol_dropout: 0.3
mol_normalization: layer
mol_pool_type: mean_max_sum

# ============================================================================
# Inter-stage Configuration
# ============================================================================
cc_interstage_type: direct
cc_interstage_use_rest: False

# ============================================================================
# Fragment GNN Configuration
# ============================================================================
frag_hidden_size: 256
frag_num_layers: 4
frag_gnn_type: NodeMLP
frag_dropout: 0.1
frag_normalization: graph
frag_pool_type: attention
frag_embed_combine: cat
frag_pool_combine: none

# ============================================================================
# MLP/Output Configuration
# ============================================================================
mlp_output_format: formula
mlp_hidden_size: 256
mlp_dropout: 0.4
mlp_normalization: none
mlp_num_layers: 2
mlp_use_residuals: True

# ============================================================================
# LR Schedule
# ============================================================================
lr_schedule: False
lr: 0.000387
lr_schedule_type: cosine
lr_warmup_steps: 5000
lr_total_steps: 390000
lr_min_ratio: 0.01
lr_decay_rate: 0.95
lr_decay_steps: 5000
weight_decay: 0.0

# ============================================================================
# Loss Configuration
# ============================================================================
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True

# ============================================================================
# Spectrum Binning & Evaluation
# ============================================================================
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01

inst_type_loss_tol:
  FT:   {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# ============================================================================
# PyTorch / Lightning Options
# ============================================================================
precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: True

# ============================================================================
# Group Sampler
# ============================================================================
group_sampler: False
group_sampler_type: group
group_sampler_max_per_group: 5
simple_group_sampler: True
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group

# ============================================================================
# Miscellaneous
# ============================================================================
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
activation_checkpointing: False
compile: True
pin_memory: True
loss_vectorized: True
loss_batch_size: 16

