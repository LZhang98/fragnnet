# ============================================================================
# W&B Logging
# ============================================================================
wandb_name: nist20_inchikey_fraggnn_d3_ma_mi_all_new_mol_feats_hard_peak_temp
wandb_tags:
- retrieval
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- dynamic_sampler
- new_metrics
- nodemlp
- oos_multiple_1
- gaussian_renormalize
- b256
- vectorized_loss
- lb16
- preload
- preprocess
- new_no_edges
- skip_extra_losses
- binned_cosine_similarity
- m+h
- m-h
- m+na
- m+cl
- frag_mode
- frag_mode_scale
- ce_scale
- nce
- cmf
- inst_tol
- boundary_pair
- a_ring_size    # new: per-atom ring size membership [in3,in4,in5,in6,inGe7]
- a_charge       # new: Gasteiger partial charge (continuous)
- b_ring         # new: bond ring membership
- b_conj         # new: bond conjugation
- frag_q         # new: per-fragment Gasteiger charge sum (charge-routing prior)
- rwpe_k16       # new: random-walk positional encoding, k=16 steps
- hard_peak_temp # new: continuous per-spectrum error-magnitude peak reweighting

# ============================================================================
# Data File Paths
# ============================================================================
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse_smpFalse/dags

# ============================================================================
# Model Architecture
# ============================================================================
num_depth: 4
num_hs: 4
frag_gnn_type: NodeMLP
mol_hidden_size: 384

# ============================================================================
# Molecule Parameters — new atom/bond features enabled
# ============================================================================
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_mass
    - a_chiral
    - a_ring_size  # ring size membership: [in3, in4, in5, in6, inGe7]
    - a_charge     # Gasteiger partial charge; computed on-the-fly
  pyg_edge_feats:
    - b_degree
    - b_ring       # bond ring membership (2 bits)
    - b_conj       # bond conjugation (2 bits)
  pyg_pe_embed_k: 16  # random-walk PE: breaks 1-WL repeating-chain symmetry

# ============================================================================
# Fragment DAG Parameters
# ============================================================================
frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
    - boundary_pair
    - frag_q         # per-fragment Gasteiger charge sum; computed on-the-fly, no DAG recomputation
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
  include_cmf: True

# ============================================================================
# Spectrum Parameters
# ============================================================================
spec_params:
  merge: False
  nce: True
  ace: True
  merge_keep_ces: False
  preprocess: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"

# ============================================================================
# Conditioning Embeddings
# ============================================================================
ce_insert_type: embed_clamped
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: True
ce_scale: True
ce_scaler_hidden_dim: 64

# ============================================================================
# Training Hyperparameters
# ============================================================================
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
debug_overfit: False

# ============================================================================
# Regularization
# ============================================================================
mol_dropout: 0.1
frag_dropout: 0.1
mlp_dropout: 0.3
weight_decay: 0.01

# ============================================================================
# LR Schedule
# ============================================================================
lr_schedule: False
lr: 0.0004
lr_schedule_type: cosine
lr_warmup_steps: 5000
lr_total_steps: 390000
lr_min_ratio: 0.01
lr_decay_rate: 0.95
lr_decay_steps: 5000

# ============================================================================
# Loss Configuration
# ============================================================================
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True

# Hard-example mining (see docs/... none yet — new feature, this is its first
# real training run). Only difference from fraggnn_d3_ma_mi_nist20_amolc_new_mol_feats.yml
# is this one line, so any score delta is attributable to it alone. T=1.0 is an
# untuned starting point (matches the magnitude sanity-checked on a debug run);
# treat this run as the ablation that decides whether to keep/tune/drop it, not
# as a config to trust by default. Watch val_oos_prob and per-CE breakdown, not
# just val_cos_sim/cos_hun — this dataset has known GT calibration artifacts, and
# hard-example mining can't distinguish learnable-but-under-fit peaks from
# irreducible label noise, so a regression may show up as worse calibration
# before it shows up as a worse headline cosine score.
hard_peak_temperature: 1.0

# ============================================================================
# Spectrum Binning & Evaluation
# ============================================================================
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
mol_pool_type: mean
frag_pool_type: max
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01
eval_bin_sqrt: False

inst_type_loss_tol:
  FT:   {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# ============================================================================
# PyTorch / Lightning Options
# ============================================================================
precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: True
dynamic_batch_sampler_mode: frag_node
dynamic_batch_sampler_max: 400000

# ============================================================================
# Group Sampler
# ============================================================================
group_sampler: False
group_sampler_type: group
group_sampler_max_per_group: 5
simple_group_sampler: True
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group

# ============================================================================
# Miscellaneous
# ============================================================================
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
activation_checkpointing: False
compile: False
pin_memory: True
loss_vectorized: True
loss_batch_size: 32
