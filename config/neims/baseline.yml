wandb_name: neims_baseline
wandb_tags:
- hyperparams
- nist20
- d4
- wr00
- inchikey
- new_proc
- neims
- new_metrics
- mz_bin_res_1,0
- m_nce_embed

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr00_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
model_type: neims
loss_type: cosine_distance
sparse_cosine_similarity: True
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  pyg: False
frag_params:
  pyg: False
mlp_hidden_size: 2000
mlp_dropout: 0.1
mlp_num_layers: 5
mlp_use_residuals: True
ff_prec_mz_offset: 5
ff_bidirectional: True
mz_max: 1500.0
mz_bin_res: 1.0
sum_ints: True
ints_transform: sqrt
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
m_ce_insert_mlp_embed: True
m_ce_insert_mlp_bin: False
eval_mz_bin_res:
- 1.0

train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
disable_checkpoints: True
precision: 32
use_tensor_float32: True
automatic_optimization: True
checkpoint_metric: val_cos_sim_1.0_epoch/mean
