wandb_name: massspecgym_iceberg_inten_s2
wandb_group: massspecgym_iceberg_inten
wandb_tags: null

# seed
seed: 444303

# data stuff
spec_fp: data/proc/massspecgym/spec_df.pkl
mol_fp: data/proc/massspecgym/mol_df.pkl
split_dp: data/split/massspecgym_f
magma_dp: data/magma/inten/massspecgym_100_s2
spec_params:
  merge: True
  nce: False
  ace: False # True
  merge_keep_ces: False # True
  preprocess: True
  inst_type: True
  inst_types:
  - "OB"
  - "OB_F"
  - "QTOF"
mol_params:
  smiles: True
  fingerprint: False
  pyg: False
  preprocess: False
magma_params:
  pe_embed_k: 0
  root_encode: gnn
  add_hs: True
  binned_targs: False
  mz_bin_res: 0.01
  mz_max: 1500.0
  sum_ints: True
  preprocess: True

# model stuff
model_type: iceberg_inten
iceberg_hidden_size: 512
iceberg_num_mlp_layers: 3
iceberg_num_gnn_layers: 3
iceberg_num_set_layers: 0
iceberg_num_frag_set_layers: 3
iceberg_dropout: 0.3
iceberg_gnn_type: GGNN
iceberg_pool_type: attn
iceberg_inject_early: False
iceberg_embed_adduct: True
iceberg_encode_forms: True
iceberg_fix_batch_bug: True
output_formula_str: False

# loss stuff
loss_type: cosine_distance
oos_tolerance_multiple: 1
oos_loss: False
sparse_cosine_similarity: True
ints_transform: sqrt

# optimization stuff
train_batch_size: 32
eval_batch_size: 32
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004645
weight_decay: 0.0000001
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: True
lr_decay_rate: 0.8147
lr_warmup_steps: 1000
lr_decay_steps: 5000
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
compile: True
