wandb_name: nist20_inchikey_fraggnn_d3_ma_mi_pairwise_cos_dual
wandb_tags:
- retrieval
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- dual_dynamic_sampler
- new_metrics
- nodemlp
- oos_multiple_1
- gaussian_renormalize
- b256
- vectorized_loss
- lb32
- preload
- preprocess
- new_no_edges
- skip_extra_losses
- binned_cosine_similarity
- m+h
- m-h
- m+na
- m+cl
- frag_mode
- frag_mode_scale
- ce_scale
- nce
- pairwise_cos

spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse/dags
num_depth: 4
num_hs: 4
frag_gnn_type: NodeMLP
frag_params:
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
spec_params:
  merge: False
  nce: True
  ace: False
  merge_keep_ces: False
  preprocess: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
mol_params:
  preprocess: True

ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: True
ce_scale: True
ce_scaler_hidden_dim: 64

train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
mol_pool_type: mean
frag_pool_type: mean
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01

precision: 32
use_tensor_float32: True
automatic_optimization: False

pl_enable_progress_bar: False
activation_checkpointing: False
compile: False
pin_memory: True
num_workers: 2
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: True

# pairwise losses
pairwise_cosine_loss_weight: 0.5
pairwise_jss_loss_weight: 0.0
pairwise_cross_entropy_loss_weight: 0.0

# dynamic batch samplers (mutually exclusive)
dynamic_batch_sampler: False
dual_group_dynamic_batch_sampler: True
dual_group_dynamic_batch_sampler_mode: frag_node
dual_group_dynamic_batch_sampler_max: 100000
# 4 distinct molecules seeded per batch (group1 = same adduct+mol_id).
# Together with k1_per_key=5 this places 4*5=20 same-molecule spectra per batch,
# yielding 4*(5 choose 2)=40 informative same-molecule pairs for the pairwise loss.
dual_group_sampler_k1: 4
# 1 isomer key seeded per batch (group2 = same adduct+formula, different mol_id).
# A single isomer alongside the k1 anchors is sufficient for isomer contrast.
dual_group_sampler_k2: 1
# 5 spectra per molecule (different CEs) taken from each group-1 key.
# Raises pairwise pair count from ~10 (k1_per_key=1) to 40 without increasing
# total batch size.
dual_group_sampler_k1_per_key: 5
# 1 spectrum per isomer key is enough; the contrast comes from the different mol_id.
dual_group_sampler_k2_per_key: 1

group_sampler: False
group_sampler_type: group
group_sampler_max_per_group: 5
simple_group_sampler: False
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group
