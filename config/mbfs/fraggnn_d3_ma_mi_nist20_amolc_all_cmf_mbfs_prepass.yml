spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
frag_dp: data/frag/nist20_ma_mi_d3_h4_isoFalse_mbfs_prepass/dags
num_depth: 4
num_hs: 4
frag_gnn_type: NodeMLP
frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - cmf_h_formulae_idx
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
  include_cmf: True
spec_params:
  merge: False
  nce: True
  ace: False
  merge_keep_ces: False
  preprocess: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
mol_params:
  preprocess: True

ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32
frag_mode_scale: True
ce_scale: True
ce_scaler_hidden_dim: 64

train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
mol_pool_type: mean
frag_pool_type: mean
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
  - cos_sim
eval_mz_bin_res:
  - 0.01

precision: 32
use_tensor_float32: True
automatic_optimization: False
dynamic_batch_sampler: True
dynamic_batch_sampler_mode: frag_edge
dynamic_batch_sampler_max: 100000

group_sampler: False
group_sampler_type: group
group_sampler_max_per_group: 5
simple_group_sampler: True
simple_group_sampler_avg_per_group: 5
simple_group_sampler_type: group

pl_enable_progress_bar: True
activation_checkpointing: False
compile: False
pin_memory: True
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: True