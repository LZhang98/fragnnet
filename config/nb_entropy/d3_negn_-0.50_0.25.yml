wandb_name: d3_negn_-0.50_0.25
wandb_tags:
- nb_entropy
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- new_metrics
- nodemlp
- m_nce_embed
- nb_iso
- node_ne_neg
- formula_ne_pos

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr00_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse_nb2/dags
num_depth: 4
num_hs: 4
frag_gnn_type: NodeMLP
frag_params:
  pyg_node_feats:
    - cc
    - base_formula
    - depth
    - h_formulae_idx
    - nb_iso_idx
  pyg_edge_feats: []
  pyg_bigraph: False
frag_remove_edges: True
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
