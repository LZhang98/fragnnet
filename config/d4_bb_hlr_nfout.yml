wandb_name: d4_bb_hlr_nfout
split_dp: data/split/d4_h4_isoTrue
frag_dp: data/frag/d4_h4_isoTrue/dags
num_depth: 5
num_hs: 4

train_batch_size: 8
eval_batch_size: 8
accumulate_grad_batches: 16
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
lr_warmup_steps: 0
lr_decay_steps: 100
lr_decay_rate: 0.9
debug_overfit: False
formula_entropy_weight: 0.0
node_entropy_weight: 0.0
node_formula_entropy_weight: 0.0
frag_pyg_node_feats:
  - cc
  - base_formula
  - depth
  - h_formulae_idx
frag_pyg_edge_feats:
  - cc
  - base_formula
precision: bf16-mixed
mlp_output_format: node_formula
