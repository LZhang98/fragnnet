wandb_name: massformer_old_long
wandb_tags:
- hyperparams
- nist20
- d4
- wr00
- inchikey
- new_proc
- massformer
- new_metrics
- mz_bin_res_1,0
- m_nce_embed

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr00_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
model_type: massformer
loss_type: cosine_distance
sparse_cosine_similarity: True
mol_params:
  pyg: False
  mf: True
frag_params:
  pyg: False
mlp_hidden_size: 1000
mlp_dropout: 0.4
mlp_num_layers: 4
mlp_use_residuals: True
mz_max: 1500.0
mz_bin_res: 1.0
sum_ints: True
ff_prec_mz_offset: 5
ff_bidirectional: True
ints_transform: log10t3
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
m_ce_insert_mlp_embed: True
m_ce_insert_mlp_bin: False
eval_mz_bin_res:
- 1.0

train_batch_size: 100
eval_batch_size: 100
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004 # ignored
weight_decay: 0.001
pt_weight_decay: 0.0
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: True
debug_overfit: False
upload_checkpoints: False
disable_checkpoints: True
precision: 32
use_tensor_float32: True
automatic_optimization: True
checkpoint_metric: val_cos_sim_1.0_epoch/mean
