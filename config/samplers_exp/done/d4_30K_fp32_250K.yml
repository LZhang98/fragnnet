wandb_name: d4_30K_ds_fp32_250K
wandb_tags:
- d4
- DynamicBatchSampler

split_dp: data/split/d4_h4_isoTrue_v2_3
frag_dp: data/frag/d4_h4_isoTrue_v2/dags
num_depth: 5
num_hs: 4

train_batch_size: 2
eval_batch_size: 2
accumulate_grad_batches: 32
gradient_clip_val: 5.0
lr: 0.0001
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
lr_warmup_steps: 0
lr_decay_steps: 100
lr_decay_rate: 0.9
debug_overfit: False
formula_entropy_weight: 0.0
node_entropy_weight: 0.0
node_formula_entropy_weight: 0.0
frag_pyg_node_feats:
  - cc
  - base_formula
  - depth
  - h_formulae_idx
frag_pyg_edge_feats:
  - cc
  - base_formula
precision: 32
mol_pool_type: none
frag_pool_type: none

automatic_optimization: False
custom_sampler: SpecMolFragDynamicBatchSampler
specmolfrag_dynamic_batch_sampler_mode: frag_node
specmolfrag_dynamic_batch_sampler_max: 250000