wandb_name: d3_nodemlp_coshunloss
wandb_tags:
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- feature_ablations
- no_edges
- nodemlp
- cos_hun_loss

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr00_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse/dags
num_depth: 4
num_hs: 4
subsample_params:
  subsample_size: 0.25
frag_gnn_type: NodeMLP
frag_params:
  pyg_edge_feats: []
  pyg_bigraph: False
frag_remove_edges: True
loss_type: cosine_distance_hungarian

train_batch_size: 32
eval_batch_size: 32
accumulate_grad_batches: 4
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
precision: 32
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 3
mz_bin_res: 0.01
mz_max: 1500.0
sparse_cosine_similarity: True
mol_pool_type: mean
frag_pool_type: mean
upload_checkpoints: True
checkpoint_metric: val_cos_hun_epoch/mean

precision: 32
use_tensor_float32: True
automatic_optimization: True
