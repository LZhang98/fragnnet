wandb_name: msg_prec_only
wandb_tags:
- msg
- nist20v2
- d4
- wr00
- inchikey
- new_proc
- new_metrics
- mz_bin_res_0,1
- no_auxiliary_scores
- precursor_model
- unmerged

# data stuff
spec_fp: data/proc/ms_gymv2/spec_df.pkl
mol_fp: data/proc/ms_gymv2/mol_df.pkl
split_dp: data/split/ms_gym_d3_h4_benchmarkv2
frag_dp: data/frag/ms_gym_d3_h4v2/dags
frag_params:
  pyg: False
spec_params:
  merge: False
  nce: True
  merge_keep_ces: False
  preprocess: False
  inst_types:
    - "QTOF"
    - "FT"
  prec_types:
    - "[M+H]+"
mol_params:
  pyg: False

# model stuff
model_type: precursor
train_sample_weight: none
eval_sample_weight: none

# loss stuff
mask_null_formula: False
predict_oos: False
oos_tolerance_multiple: 1
oos_loss: False
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: True
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0
weight_decay: 0.0
accelerator: gpu
devices: 1
min_epochs: 1 #100
max_epochs: 1 #100
lr_schedule: False
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.1_epoch/mean
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
- 0.1
precision: 32
use_tensor_float32: True
automatic_optimization: True
dynamic_batch_sampler: False
pl_enable_progress_bar: True
compile: False
mp_sharing_strategy: file_system
