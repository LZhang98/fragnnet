wandb_name: exp_fraggnn_d3_b-0,01_no-oos_sqrt
wandb_group: 

# seed
seed: 397623

# data stuff
spec_fp: data/proc/nist20mona23v3/spec_df.pkl
mol_fp: data/proc/nist20mona23v3/mol_df.pkl
split_dp: data/split/nist20mona23v3_d4_wr00_inchikey
frag_dp: data/frag/nist20mona23v3_d3_h4_isoFalse_nb3/dags
frag_params:
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
mol_params:
  preprocess: True

# model stuff
frag_gnn_type: NodeMLP
num_depth: 4
num_hs: 4
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True
mol_pool_type: mean
frag_pool_type: mean
mol_normalization: batch
mol_hidden_size: 256
mol_dropout: 0.2
frag_hidden_size: 256
frag_normalization: graph
frag_embed_combine: avg
frag_pool_combine: subtract
frag_dropout: 0.1
mlp_normalization: layer
mlp_hidden_size: 64
mlp_dropout: 0.2

# loss stuff
loss_type: cosine_distance
loss_vectorized: False
mask_null_formula: False
predict_oos: False
oos_loss: False
sparse_cosine_similarity: True
mz_max: 1500.0
mz_bin_res: 0.01
skip_extra_losses: True
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
ints_transform: sqrt

# optimization stuff
train_batch_size: 32
eval_batch_size: 32
accumulate_grad_batches: 4
gradient_clip_val: 5.0
lr: 0.0003033
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
- cos_sim
- cos_hun
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
dynamic_batch_sampler: False
pl_enable_progress_bar: True
compile: True
