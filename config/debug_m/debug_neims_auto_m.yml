wandb_name: debug_neims_auto_m
wandb_tags:
- debug
- nist20
- d4
- wr00
- inchikey
- new_proc
- neims
- new_metrics
- mz_bin_res_0,01
- ce_embed
- merged
- ouput_map
- preload
- preprocess

# data stuff
spec_fp: data/proc/debug_small/spec_df.pkl
mol_fp: data/proc/debug_small/mol_df.pkl
split_dp: data/split/debug_small
frag_dp: 
frag_params:
  pyg: False
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: False #True
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  pyg: False
  preprocess: False #True
subsample_params:
  subsample_size: 0.05

# model stuff
model_type: neims
mlp_hidden_size: 1024
mlp_dropout: 0.1
mlp_num_layers: 5
mlp_use_residuals: True
ff_prec_mz_offset: 5
ff_bidirectional: True
ff_output_map_size: 256
mz_max: 1500.0
mz_bin_res: 0.01
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True

# loss stuff
loss_type: cosine_distance
sparse_cosine_similarity: True
ints_transform: log10t3
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 5
max_epochs: 5
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
disable_checkpoints: False
delete_checkpoints: False
precision: 32
use_tensor_float32: True
automatic_optimization: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
checkpoint_save_last: False
compile: False
