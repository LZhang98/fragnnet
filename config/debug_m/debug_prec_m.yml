wandb_name: debug_prec_m
wandb_tags:
- debug
- nist20v2
- d4
- wr00
- inchikey
- new_proc
- precursor_model
- merged

# data stuff
spec_fp: data/proc/debug_smallv2/spec_df.pkl
mol_fp: data/proc/debug_smallv2/mol_df.pkl
split_dp: data/split/debug_smallv2
frag_params:
  pyg: False
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
  precursor_mz: True
mol_params:
  pyg: False

# model stuff
model_type: precursor

# loss stuff
mask_null_formula: False
predict_oos: False
oos_tolerance_multiple: 1
oos_loss: False
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: True
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none

# optimization stuff
train_batch_size: 128
eval_batch_size: 128
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0
weight_decay: 0.0
accelerator: gpu
devices: 1
min_epochs: 1 #100
max_epochs: 1 #100
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
dynamic_batch_sampler: False
pl_enable_progress_bar: True
compile: False
