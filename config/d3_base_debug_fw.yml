wandb_name: fw_debug
split_dp: data/split/d3_h4_isoTrue
frag_dp: data/frag/d3_h4_isoTrue/dags
num_depth: 4
num_hs: 4

train_batch_size: 1
eval_batch_size: 1
accumulate_grad_batches: 4
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
lr_warmup_steps: 0
lr_decay_steps: 100
lr_decay_rate: 0.9
debug_overfit: False
# formula_entropy_weight: 0.0
# node_entropy_weight: 0.0
# node_formula_entropy_weight: 0.0
frag_pyg_node_feats:
  - cc
  - base_formula
  - depth
  - h_formulae_idx
frag_pyg_edge_feats:
  - cc
  - base_formula
precision: 32
mol_pool_type: softmax
frag_pool_type: softmax

mol_hidden_size: 128
mol_num_layers: 2
frag_hidden_size: 128
frag_num_layers: 2
frag_gnn_type: GAT

formula_entropy_weight: -0.2
node_entropy_weight: 0.0
node_formula_entropy_weight: 0.0
spec_merge: True
#spec_nce: True
ce_insert_type: frag_insert

automatic_optimization: False
custom_sampler: SpecMolFragDynamicBatchSampler
specmolfrag_dynamic_batch_sampler_mode: frag_node
specmolfrag_dynamic_batch_sampler_max: 100000