# ============================================================================
# W&B Logging
# ============================================================================
wandb_name: nist20_spec_mol_clip_pretraining
wandb_tags:
  - clip
  - pretraining
  - nist20
  - inchikey
  - no_leak_split
  - fragnnet_mol_base

# ============================================================================
# Data File Paths
# ============================================================================
model_type: spec_mol_clip_pretraining
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
# Molecule/InChIKey split. Keep train/val/test separated here so the spectrum
# encoder never validates on another spectrum of a molecule seen during training.
split_dp: data/split/nist20_ma_mi_inchikey

# ============================================================================
# Dataset Parameters
# ============================================================================
subsample_params:
  subsample_size: 0
  subsample_seed: 42
  train: True
  val: True
  test: True
  secondary: True

spec_params:
  merge: False
  merge_keep_ces: False
  sparse: True
  prec_type: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  prec_mz: True
  prec_mass_diff: True
  nce: True
  ace: False
  preprocess: True
  unique_id: True
  counts: True
  test_ces:
  split_filters:
    train:
      filter_prec_types: True
    val:
      filter_prec_types: True
    test:
      filter_prec_types: True

mol_params:
  smiles: False
  pyg: True
  preprocess: True

# ============================================================================
# Spectrum-Molecule CLIP Pretraining
# ============================================================================
clip_temperature: 0.07
clip_embed_dim: 256
clip_intensity_transform: sqrt
spectrum_encoder_params:
  encoder_type: set_transformer
  input_dim: 2
  hidden_dim: 256
  embed_dim: 256
  num_layers: 2
  num_heads: 4
  num_inds: 32
  dropout: 0.1
  normalization: layer

# ============================================================================
# Molecule GNN Base
# These match the FraGNNet molecule encoder shape used by the NIST20 D3 MA/MI
# configs, so CLIP checkpoints can seed downstream mol_embedder/mol_pool weights.
# ============================================================================
mol_hidden_size: 384
mol_num_layers: 4
mol_gnn_type: GINE
mol_dropout: 0.1
mol_normalization: batch
mol_pool_type: mean
mol_num_heads: 4

mlp_hidden_size: 256
mlp_dropout: 0.1
mlp_num_layers: 2
mlp_use_residuals: True

# ============================================================================
# Metadata Conditioning
# ============================================================================
ce_insert_type: embed_clamped
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
use_nce: True
use_ace: False

prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32

# ============================================================================
# Optimization
# ============================================================================
seed: 42
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
lr: 0.0004
lr_schedule: False
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
precision: 32
use_tensor_float32: True
automatic_optimization: True
gradient_clip_val: 5.0

# CLIP treats other examples in a batch as negatives, so do not use the pairwise
# or dynamic samplers that intentionally place same-molecule spectra together.
dynamic_batch_sampler: False
dual_group_dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: True
simple_group_sampler_type: mol
simple_group_sampler_avg_per_group: 1
formula_prec_type_group_sampler: False
drop_last: True

# ============================================================================
# Checkpointing / Runtime
# ============================================================================
checkpoint_metric: val_s2m_top1
checkpoint_metric_mode: max
checkpoint_save_last: True
checkpoint_save_top_k: 1
upload_checkpoints: False
delete_checkpoints: False
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
compile: False
num_workers: 7
pin_memory: True
