# ============================================================================
# W&B Logging
# ============================================================================
wandb_name: nist20_spec_mol_siglip_pretraining
wandb_tags:
  - clip
  - siglip
  - pretraining
  - nist20
  - inchikey
  - no_leak_split
  - fragnnet_mol_base

# ============================================================================
# Data File Paths
# ============================================================================
model_type: spec_mol_clip_pretraining
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey

# ============================================================================
# Dataset Parameters
# ============================================================================
subsample_params:
  subsample_size: 0
  subsample_seed: 42
  train: True
  val: True
  test: True
  secondary: True

spec_params:
  merge: False
  merge_keep_ces: False
  sparse: True
  prec_type: True
  prec_type_str: False
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  prec_mz: True
  prec_mass_diff: True
  nce: True
  ace: True
  preprocess: True
  unique_id: True
  counts: True
  test_ces:
  split_filters:
    train:
      filter_prec_types: False
    val:
      filter_prec_types: False
    test:
      filter_prec_types: False

mol_params:
  smiles: False
  pyg: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
  pyg_pe_embed_k: 0
  pyg_bigraph: True
  preprocess: True

# ============================================================================
# Spectrum-Molecule CLIP Pretraining
# ============================================================================
clip_temperature: 0.1
clip_embed_dim: 256
clip_intensity_transform: sqrt
clip_loss_type: siglip
spectrum_encoder_params:
  encoder_type: set_transformer
  input_dim: 4          # (mz, intensity, neutral_loss, prec_scale) — conditioning dims added automatically
  hidden_dim: 256
  embed_dim: 256
  num_layers: 4
  num_heads: 4
  num_inds: 32
  dropout: 0.1
  normalization: layer
  spec_ce_embed_size: 16
  spec_inst_embed_size: 16
  spec_frag_mode_embed_size: 16

# ============================================================================
# Molecule GNN Base
# ============================================================================
mol_hidden_size: 384
mol_num_layers: 4
mol_gnn_type: GINE
mol_dropout: 0.1
mol_normalization: batch
mol_pool_type: mean
mol_num_heads: 4

mlp_hidden_size: 256
mlp_dropout: 0.3
mlp_num_layers: 2
mlp_use_residuals: True

# ============================================================================
# Metadata Conditioning
# ============================================================================
ce_insert_type: embed_clamped
ce_insert_location: mol
ce_insert_merge: True
ce_insert_size: 32
use_nce: True
use_ace: True

prec_insert_location: mol
prec_insert_size: 32
inst_insert_location: mol
inst_insert_size: 32
frag_mode_insert_location: mol
frag_mode_insert_size: 32

# CE normalization params
int_embedder: abs-sines
nce_max: 200
nce_mean: 60
nce_std: 40
ace_max: 100.0
ace_mean: 20.0
ace_std: 15.0

# Inference / misc
mz_max: 1500.0
retrieval_eval_size: 2000
optimizer: adam

# ============================================================================
# Optimization
# ============================================================================
seed: 42
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 2
lr: 0.0002
lr_schedule: True
lr_schedule_type: cosine
lr_warmup_steps: 200
lr_decay_rate: 0.9
lr_decay_steps: 1000
lr_total_steps: 9000
lr_min_ratio: 0.01
weight_decay: 0.01
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
precision: 32
use_tensor_float32: True
automatic_optimization: True
gradient_clip_val: 1.0

dynamic_batch_sampler: False
dual_group_dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: True
simple_group_sampler_type: mol
simple_group_sampler_avg_per_group: 3
formula_prec_type_group_sampler: False
drop_last: True

# ============================================================================
# Checkpointing / Runtime
# ============================================================================
checkpoint_metric: val_s2m_top1
checkpoint_metric_mode: max
checkpoint_save_last: True
checkpoint_save_top_k: 1
upload_checkpoints: True
delete_checkpoints: False
pl_enable_progress_bar: False
pandarallel_enable_progress_bar: False
compile: False
num_workers: 7
pin_memory: True
