model_type: neims
mol_fingerprint: True
mol_pyg: False
frag_pyg: False
mlp_num_layers: 5
mlp_hidden_size: 2000
mlp_dropout: 0.1
ints_transform: none #log10t3
mz_bin_res: 0.1
loss_tolerance_ppm: 
