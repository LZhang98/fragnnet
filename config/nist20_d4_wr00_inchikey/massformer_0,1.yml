wandb_name: massformer_0,1
wandb_tags:
- splits
- nist20
- d4
- wr00
- inchikey
- new_proc
- massformer
- new_metrics
- mz_bin_res_0,1

spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_d4_wr00_inchikey
frag_dp: data/frag/nist20_d3_h4_isoFalse_nb2/dags
subsample_params:
  subsample_size: 0.25

model_type: massformer
loss_type: cosine_distance
sparse_cosine_similarity: True
mol_params:
  pyg: False
  mf: True
frag_params:
  pyg: False
mlp_hidden_size: 2000
mlp_dropout: 0.01
mlp_num_layers: 5
mlp_use_residuals: True
mz_max: 1500.0
mz_bin_res: 0.1
sum_ints: True
ff_prec_mz_offset: 5
ff_bidirectional: True
ints_transform: sqrt

train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
upload_checkpoints: False
disable_checkpoints: True
precision: 32
use_tensor_float32: True
automatic_optimization: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
