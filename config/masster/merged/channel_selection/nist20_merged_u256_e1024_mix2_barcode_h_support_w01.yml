wandb_name: nist20_merged_u256_e1024_mix2_barcode_h_support_w01
wandb_group: nist20_mass_shatter_channel_selection
wandb_tags:
  - masster
  - vulcan_l40s
  - nist20
  - merged
  - unique_fragments_256
  - max_enumerated_masks_1024
  - proposal_bernoulli_mixture_2
  - proposal_barcode_target
  - separate_h_support
  - h_support_loss_0.1
  - dense_channels

seed: 397623

# 1. Merge spectra within each precursor/adduct group while retaining collision
# energies as context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: True
  merge_normalize_each_spectrum: True
  merge_equal_ce_weight: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Match the Mix2/U256 control and add barcode proposal targets plus the
# separately supervised H-support head. Keep selection disabled during training.
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
masster_unique_fragment_target: 256
masster_unique_fragment_mode: True
masster_ranked_mask_budget: 1024
masster_min_mask_relative_probability: 0.0
masster_min_fragment_relative_probability: 0.0
masster_include_single_bond_cuts: False
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_proposal_num_mixtures: 2
masster_intensity_transformer_dim: 384
masster_intensity_transformer_num_layers: 3
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 1024
masster_intensity_transformer_num_inducing_points: 128
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: True
masster_proposal_anchored: True
masster_log_base_ce: True
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: True
masster_proposal_selection_only: True
masster_proposal_loss_weight: 0.1
masster_proposal_barcode_target: True
masster_separate_proposal_encoder: True
masster_separate_ion_mode_proposal_head: False
masster_min_ion_mode_relative_probability: 0.0
masster_ion_mode_proposal_loss_weight: 0.0
masster_separate_ion_h_support_head: True
masster_ion_h_support_binary_logits: True
masster_min_ion_h_relative_probability: 0.0
masster_ion_h_support_loss_weight: 0.1
masster_apply_channel_selection_in_training: False
masster_channel_support_attribution: gaussian_posterior
masster_channel_diagnostics: False

# 3. Keep the control loss and optimization setup unchanged apart from barcode
# proposal targets and the explicitly named 0.1 H-support auxiliary loss.
loss_type: cross_entropy
predict_oos: False
oos_loss: False
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 8
target_rel_ints_thresh: 0.001
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 64
eval_batch_size: 64
accumulate_grad_batches: 4
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 200
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - wrecall
  - precision
eval_mz_bin_res:
  - 0.01

# Per-instrument loss tolerance. QTOF floors at 0.015 Da to cover NIST23
# floor-truncated m/z; FT stays at 10 ppm.
inst_type_loss_tol:
  OB: {rel: 1.0e-5, min_mz: 200.0}
  OB_F: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}
