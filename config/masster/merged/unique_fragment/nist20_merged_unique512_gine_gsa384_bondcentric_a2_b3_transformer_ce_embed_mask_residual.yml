wandb_name: nist20_merged_unique512_gine_gsa384_bondcentric_a2_b3_transformer_ce_embed_mask_residual
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - masster
  - vulcan_l40s
  - nist20
  - merged
  - unique_fragments_512
  - max_enumerated_masks_512
  - pathway_marginalization
  - deterministic
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - ce_embed
  - adduct_embed
  - mask_residual
  - charge_logsumexp

seed: 397623

# 1. Match the established NIST20 merged condition: merge spectra within each
# precursor/adduct group while retaining the collision energies as context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: True
  merge_normalize_each_spectrum: True
  merge_equal_ce_weight: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Match the no-residual unique512 model, but let the transformer redistribute
# retained probability among unique fragments before allocating ion/H channels.
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
masster_unique_fragment_target: 512
masster_unique_fragment_mode: True
masster_ranked_mask_budget: 512
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: True
# Variant A: preserve the original probability feature and log base CE without
# adding it to the training objective.
masster_proposal_anchored: False
masster_log_base_ce: True
masster_base_ce_weight: 0.0

# 3. Keep the objective identical to the no-residual paired control.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 8
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. Keep optimization and physical batching identical to the paired control.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 128
eval_batch_size: 128
accumulate_grad_batches: 2
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01

# Per-instrument loss tolerance. QTOF floors at 0.015 Da to cover NIST23 floor-truncated
# m/z; FT stays at 10 ppm. FT-only configs are numerically unaffected.
inst_type_loss_tol:
  OB: {rel: 1.0e-5, min_mz: 200.0}
  OB_F: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}
