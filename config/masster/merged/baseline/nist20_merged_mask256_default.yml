wandb_name: nist20_merged_mask256_default
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - masster
  - vulcan_l40s
  - masks_256
  - default

seed: 397623

# 1. Use merged NIST20 spectra and fragmentation-relevant molecular features.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: True
  merge_normalize_each_spectrum: True
  merge_equal_ce_weight: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Keep the molecular backbone local and use the endpoint bond-scoring baseline.
model_type: masster
mol_gnn_type: GINE
mol_hidden_size: 256
mol_num_layers: 4
mol_normalization: batch
mol_dropout: 0.1
masster_bond_num_layers: 0
masster_selected_mask_limit: 256
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_context_dim: 64
masster_metadata_embedding_dim: 16
masster_head_hidden_dim: 256
masster_head_dropout: 0.1

# 3. Use the established sparse spectrum objective with memory-safe loss chunks.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 1
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. L40S: physical batch 16 with gradient accumulation gives effective batch 128.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 16
eval_batch_size: 4
accumulate_grad_batches: 8
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01

# Per-instrument loss tolerance. QTOF floors at 0.015 Da to cover NIST23 floor-truncated
# m/z; FT stays at 10 ppm. FT-only configs are numerically unaffected.
inst_type_loss_tol:
  OB: {rel: 1.0e-5, min_mz: 200.0}
  OB_F: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}
