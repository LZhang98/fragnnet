# Spectraverse v1.0.3, arm `reg_pow075` (fold cv0), 2026-10-19. reg + pow0.75 intensity target with same-m/z row merging (the MSGYM pow075 pair).
# Read against: reg. Plan: docs/plans/masster/spectraverse_1_0_3_msgym_arms_plan.md
#
# Data: v1.0.3 (464,228 spectra) at the on-disk paths data/proc/spectraverse_1_0_3 and
# data/split/spectraverse_benchmark_1_0_3 (docs and preproc defaults still say
# spectraverse_1_0_3_benchmark). The stored spec_df labels the 20,688 ion-trap spectra `Other`,
# so inst_types stays ORB/QTOF/Other/NA; if spec_df is rebuilt with the fixed parser they
# become `IT` and must be added here with a tolerance.
# Schedule: 40 epochs x ceil(367,561 / 256) = 40 x 1436 = 57440 steps,
# warmup 2000 (the v1.0.2 control's ~3.5% fraction).
#
# MSGYM regularization (config/masster/massspecgym/msgym_sweep_leader_720jwmai.yml, sweep tiwhun9q leader): mol_dropout 0.2 (0.1),
# masster_head_dropout 0.3 (0.1), boundary-encoder and intensity-input dropout 0.2 (0),
# weight_decay 0.1 (0.01), lr 1.55e-3 (1e-3), train batch 256 (512). Encoder dropout and LR
# were the sweep's strongest signals (it tested 0-0.3); nothing higher, since md05 (0.5) loses
# ~0.01 on NIST20 i4. Depths stay at the SPV values (2/3/2): the sweep resolved no depth winner.
#
# pow075 pair: ints_transform pow0.75 + masster_merge_same_mz_rows (required with an exact-mass
# transformed target). MSGYM q3oxbpgx: val cosine level, formula-test mspred_ent hit@1 +0.031.
# val_primary_loss is CE on pow0.75 targets, so rank on val cosine, not loss.
#
# Unchanged from the v1.0.2 control (see its header for the reasoning): CMF on, unmerged, dual
# CE with missing-CE token, fourier CE table, EMA 0.999, U256/E4096, no fragment floor (MSGYM:
# U128 and floor 0.01 cost formula-test retrieval), loss_batch_size 4 for the peak tail, and
# checkpoint on val_cos_hun_inst_tol so every arm is selected the same way.
