# Tiny smoke config for the 2026-09-22 GLACIER-parity features, ALL of them on at once:
#   mol_params:  a_fused_ring, b_ring_size, b_fused_ring   (the c4a_ring_topology arm)
#   head:        c_nl_composition                          (the c4a_complement_composition arm)
# The two production arms are single-purpose diffs from `c4a_base_s1`; this config deliberately
# stacks both so one short run exercises every new code path: the two feature registries in
# feat_utils.py, the widened GNN input, `_element_counts_by_group`, and the widened intensity
# token in CandidateIntensityTransformerHead.
#
# Architecture mirrors the c4a arms (unique-fragment mode, bond layers, intensity transformer,
# CUDA candidate backend) at toy width so the shapes that change are the same shapes the arms
# change. It is a shape/finiteness smoke test on 64 spectra, NOT a measurement.
#
# Run the paired control by overriding the new keys off, which is the only difference that
# matters here:
#   --override "masster_candidate_features=[c_cut_count, c_size, c_mass, c_charge]"
# (a CLI override is the one place the inline list form is correct; config bodies use the
# block form. The mol_params feature lists are still edited rather than overridden, since
# they are nested.)
wandb_name: debug_tiny_masster_glacier_feats
wandb_group: glacier_feature_parity_smoke
wandb_tags: [debug, masster, glacier_parity, ring_topology_feats, complement_composition]

model_type: masster
seed: 42

spec_fp: data/proc/debug_tinyv4/spec_df.pkl
mol_fp: data/proc/debug_tinyv4/mol_df.pkl
split_dp: data/split/debug_tinyv4
subsample_params:
  subsample_size: 64
  subsample_seed: 42
  train: true
  val: true
  test: true
  secondary: true

spec_params:
  merge: false
  merge_keep_ces: false
  nce: true
  ace: true
  preprocess: false
  prec_types: ["[M+H]+", "[M-H]-", "[M+Na]+"]
  inst_type: true
  inst_types: [ORB, ORB_F, QTOF]
  frag_mode: true
  frag_modes: [HCD, CID]

# Atom/bond feature list of the c4a arms plus the three 2026-09-22 additions. Resolves to the
# arms' 73-dim atom / 16-dim bond input; nothing is cached, so no preprocessing is needed.
mol_params:
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  - a_fused_ring   # NEW 2026-09-22
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
  - b_ring_size    # NEW 2026-09-22
  - b_fused_ring   # NEW 2026-09-22
  preprocess: false

mol_gnn_type: GINE_GSA
mol_hidden_size: 64
mol_num_layers: 2
mol_normalization: layer
mol_dropout: 0.0
masster_unique_fragment_mode: true
masster_unique_fragment_target: 8
masster_ranked_mask_budget: 16
masster_include_single_bond_cuts: true
masster_max_h_transfer: 2
masster_h_transfer_bound: valence
masster_include_cmf: true
masster_charge_pooling: logsumexp
masster_context_dim: 32
masster_metadata_embedding_dim: 8
masster_head_hidden_dim: 64
masster_head_dropout: 0.0
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 64
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 4
masster_intensity_transformer_feedforward_dim: 128
masster_intensity_transformer_num_inducing_points: 8
masster_intensity_transformer_dropout: 0.0
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false

# CUDA candidate construction, as in the c4a arms. Requires one mixture, unique mode, zero mask
# floors and SMARTS off, all of which hold above.
masster_candidate_backend: cuda

# Pinned, not inherited: these three are what the new features sit next to in the intensity
# token, so a later default flip must not silently change what this smoke test covers.
masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
- c_nl_composition

loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 8
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0

dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
formula_prec_type_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 4
eval_batch_size: 4
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: false

accelerator: gpu
devices: 1
num_workers: 0
precision: 32
use_tensor_float32: true
min_epochs: 1
max_epochs: 2
debug_overfit: false
compile: false
detect_anomaly: true
pl_enable_progress_bar: true
upload_checkpoints: false
disable_checkpoints: true
eval_test_split: false
auxiliary_scores: [cos_sim, precision, recall]
eval_mz_bin_res: [0.01]
