# Tiny smoke config for the 2026-09-22 candidate-token changes, ALL THREE on at once:
#   c_cut_bonds       the severed bonds' own input features (arm e1)
#   c_cut_adjacency   cut pairs meeting at a shared atom (arm e4)
#   masster_candidate_atom_dropout  per-atom dropout on the component pool (arms e2/e3)
# The production arms in config/masster/ma_mi_merged/candidate_token_2026_09_22/ are
# single-key diffs from `c4a_base_s1`; this config deliberately stacks all three so one short run
# exercises every new code path: the c_cut_bonds and c_cut_adjacency builders (including the
# boundary endpoint orientation it reuses), `_candidate_atom_dropout`, and the two widened blocks
# of the intensity token in CandidateIntensityTransformerHead.
#
# Architecture mirrors the c4a arms (unique-fragment mode, bond layers, intensity transformer,
# CUDA candidate backend) at toy width, so the shapes that move here are the shapes the arms move.
# It is a shape/finiteness smoke test on 64 spectra, NOT a measurement.
#
# The dropout is training-only and never empties a candidate, so it is exercised by the fit loop
# and is inert in the validation pass; a clean run therefore covers both branches. Paired control:
#   --override "masster_candidate_features=[c_cut_count, c_size, c_mass, c_charge]" \
#              masster_candidate_atom_dropout=0.0
wandb_name: debug_tiny_masster_cut_features
wandb_group: candidate_token_smoke
wandb_tags: [debug, masster, cut_bond_feats, cut_adjacency_feats, cc_atom_dropout]

model_type: masster
seed: 42

spec_fp: data/proc/debug_tinyv4/spec_df.pkl
mol_fp: data/proc/debug_tinyv4/mol_df.pkl
split_dp: data/split/debug_tinyv4
subsample_params:
  subsample_size: 64
  subsample_seed: 42
  train: true
  val: true
  test: true
  secondary: true

spec_params:
  merge: false
  merge_keep_ces: false
  nce: true
  ace: true
  preprocess: false
  prec_types: ["[M+H]+", "[M-H]-", "[M+Na]+"]
  inst_type: true
  inst_types: [ORB, ORB_F, QTOF]
  frag_mode: true
  frag_modes: [HCD, CID]

# The c4a_base_s1 feature lists, unchanged: this config tests the candidate token, not the graph
# registries. Bond width resolves to 9, so the cut-bond block is 2 x 9 = 18 columns.
mol_params:
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
  preprocess: false

mol_gnn_type: GINE_GSA
mol_hidden_size: 64
mol_num_layers: 2
mol_normalization: layer
mol_dropout: 0.0
masster_unique_fragment_mode: true
masster_unique_fragment_target: 8
masster_ranked_mask_budget: 16
masster_include_single_bond_cuts: true
masster_max_h_transfer: 2
masster_h_transfer_bound: valence
masster_include_cmf: true
masster_charge_pooling: logsumexp
masster_context_dim: 32
masster_metadata_embedding_dim: 8
masster_head_hidden_dim: 64
masster_head_dropout: 0.0
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 64
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 4
masster_intensity_transformer_feedforward_dim: 128
masster_intensity_transformer_num_inducing_points: 8
masster_intensity_transformer_dropout: 0.0
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false

# CUDA candidate construction, as in the c4a arms. Requires one mixture, unique mode, zero mask
# floors and SMARTS off, all of which hold above.
masster_candidate_backend: cuda

# Pinned, not inherited: these three are what the new blocks sit next to in the intensity token,
# so a later default flip must not silently change what this smoke test covers.
masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
- c_cut_bonds
- c_cut_adjacency
# No width change; training-only, and higher than any production arm so the restore-an-emptied-
# candidate branch is actually exercised: 40 of 184 unique candidates on debug_tinyv4 are
# single-atom, an expected restore rate of 0.070 per candidate at this p.
masster_candidate_atom_dropout: 0.3

loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 8
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0

dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
formula_prec_type_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 4
eval_batch_size: 4
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: false

accelerator: gpu
devices: 1
num_workers: 0
precision: 32
use_tensor_float32: true
min_epochs: 1
max_epochs: 2
debug_overfit: false
compile: false
detect_anomaly: true
pl_enable_progress_bar: true
upload_checkpoints: false
disable_checkpoints: true
eval_test_split: false
auxiliary_scores: [cos_sim, precision, recall]
eval_mz_bin_res: [0.01]
