wandb_name: nist20_merged_mask512_gine_gsa384_bondcentric_a2_b3_transformer_logmeanexp_explore512_bond_curriculum
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - masster
  - vulcan_l40s
  - masks_512
  - explore_512
  - bounded_additive
  - bond_size_curriculum
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - charge_logmeanexp

seed: 397623

# 1. Match the 512+512 logmeanexp exploration run data exactly.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Keep all 512 deterministic masks and add up to 512 bounded masks in training.
# Validation, testing, and inference remain deterministic top-K with K=512.
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
masster_selected_mask_limit: 512
masster_explore_masks: 512
masster_exploration_temperature: 1.0
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logmeanexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1

# 3. Keep the objective identical to the 512+512 exploration run.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 1
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. Start near the smallest 5% by bond count and expand to all training data.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 32
eval_batch_size: 4
accumulate_grad_batches: 4
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False
bond_size_curriculum: True
bond_size_curriculum_start_fraction: 0.05
bond_size_curriculum_epochs: 20

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01
