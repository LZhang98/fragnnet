# ARM msgym k1_ema999_fourier_pow075_s2 -- 2026-10-08 (prepared, not run).
# Exactly msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda_k1_ema999_fourier_pow075.yml
# (q3oxbpgx) plus: seed 20261003 (the control's s2 seed), loss_batch_size 16.
# Everything else (data, model, schedule, transform) is pow075's.
#
# WHY. pow075 is the best retrieval checkpoint (mspred_ent hit@1 +0.031 [+0.017, +0.046] over
# ll04i00m) on one seed; its val best 0.5790 sits below the control mean, so the retrieval gain is
# not visible on val cosine and needs its own replicate before the sweep base and any headline
# rely on it. docs/findings/masster/masster_msgym_arm_screen_formula_retrieval_2026_10_07.md
# loss_batch_size 64 -> 16 lets this fit the default fir:h100-3g.40gb profile; it only sets the
# padded loss-chunk window (float accumulation order, not a modeling knob).
# docs/plans/masster/masster_regularization_sweep_plan.md#slice-sizing-is-a-measured-open-question-not-a-settled-choice
#
# READ: formula test retrieval on the best checkpoint (mspred_ent, loglik, loglik_cal re-selected
# on val) paired against q3oxbpgx@55 and ll04i00m@60; the pow075 gain holds if this seed also
# clears ll04i00m with a CI excluding zero. Val cosine against pow075 and |control - s2|.
#
# ---- pow075 config header follows ----
# ARM msgym k1_ema999_fourier_pow075 -- pow0.75 intensity targets, gaussian CE, 2026-10-03 (prepared, not run).
# Exactly msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda_k1_ema999_fourier.yml (the control) plus: ints_transform pow0.75, masster_merge_same_mz_rows true.
#
# WHY. The calibrated retrieval rule ll_g0.75_t2_e1e-4_a0.5 (val-selected; test hit@1 0.528 vs 0.485
# for the frozen ll on ll04i00m predictions) flattens both sides of the likelihood: query weights
# sqrt(y)/sum sqrt(y) and p^0.75 of a linear-trained model, with p-hat the predicted mass inside a
# tolerance window. These arms put that likelihood into training. Cross-entropy is minimized at
# q = target weights, so the transform is applied to the target (ints_transform), not as a
# prediction exponent; peak_marginal replaces the Gaussian m/z density by the summed predicted mass
# inside pm_tolerance_multiple x instrument tolerance (1.0 = the window the Gaussian path already
# uses for support). The e1e-4 floor is scoring-only and is not trained.
# docs/findings/masster/masster_msgym_formula_retrieval_full_2026_10_03.md#calibrated-likelihood-val-selected-one-test-read-added-2026-10-03
#
# GRID (one seed each, same seed and schedule): control (linear, gaussian), _sqrt,
# _pow075, _pm1, _sqrt_pm1, _pow075_pm1.
#
# EVAL. Evaluation and export untransform to linear, so val_cos_sim_0.01 stays comparable to the
# control. For retrieval, reselect the scoring rule on val per checkpoint: a transformed arm's
# learned q is p^0.5 (sqrt) or p^0.75 (pow0.75) of the exported linear p, so the frozen g0.75
# rule does not carry over.
#
# ---- control config header follows ----
# ARM msgym k1_ema999_fourier -- the best NIST20 MASSter stack on MassSpecGym v1.5, 2026-10-02.
# msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda.yml (W&B 1imawkx1) plus four keys:
#   masster_boundary_encoder_dropout 0.2, masster_intensity_input_dropout 0.2 (k1),
#   ema_decay 0.999, and int_embedder fourier. upload_checkpoints is on as well.
# The base already has pre-norm, so the model is i4 (i1 + k1 + EMA + pre-norm) on MSGYM data.
#
# WHY THESE KEYS. NIST20 unmerged [M+H]+ on ORB / ORB_F labels, 54-63 tail of
# val_cos_sim_0.01_epoch/mean: i1 0.7607, i3 (i1 + k1 + EMA, xypkkfti) 0.7710 (+0.0102,
# 2.4x the 0.0042 seed spread), i4 (i3 + pre-norm, rd9rsdqx) 0.7729 (+0.0019 over i3, a hold).
# docs/history/masster_memorization_route_plan_log.md#batch-5-read-from-wb-i3-i4-fa1-and-mz1-2026-09-29
# fourier: at nce_max 300 abs-sines gives x and 512 - x one code (44 pairs in 212-300), and MSGYM's
# derived NCE reaches p99 284. fourier gives every integer 0-300 its own row, as in the Spectraverse
# and Enveda configs. Its NIST20 test (n4) passed with no expected gain.
#
# NOT TAKEN FROM NIST20. The i-series trained 64 epochs at constant lr; this keeps the base's
# 128-epoch cosine schedule (warmup 1000, floor 1%), so the read against 1imawkx1 changes only the
# four keys. On NIST20 the schedule did not add to k1_ema (s1_k1_ema -0.0011), so it is not
# expected to matter. Full attention (fa1) is left out: it is 0.0059 below i3 and untested on top.
# NIST20 dual CE (i5) was its own arm; MSGYM keeps the base's NCE-from-ACE dual CE.
#
# DATA: data/proc/ms_gym_benchmark_1_5/spec_df.pkl md5 c202b893a90d826f8eda6183e1f3e77c after the
# 2026-10-01 ORB rename (ORB 81,313 / QTOF 37,678, all [M+H]+); mol_df.pkl
# 9771ea6fd72c875785ff596475a41902; split train_ids.csv 177747cc33c383c976f279f3fa76fb36,
# val_ids.csv a03315970b74703fb6aea0dd8ae9bdcd, test_ids.csv 1f93415c451b4aef5fd50380ffe31bf5.
# The base header's "FT 81,313" is the same rows before the rename.
#
# CONTROL: 1imawkx1 (base config, n=1): best 0.5754 at epoch 62, 118-127 tail 0.5695. It peaked
# near epoch 60 and drifted after; val primary loss was lowest at epoch 14.
# READ: best val_cos_sim_0.01_epoch/mean and the 118-127 tail against 1imawkx1. No MSGYM seed
# spread exists; the NIST20 0.0042 is the only reference. Then score the best checkpoint on the
# 9,954-spectrum test set against ll04i00m's 0.5713 and GLACIER's 0.5455
# (docs/findings/masster/masster_msgym_vs_glacier_released_ckpt_2026_09_24.md).
#
# Base config follows: msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda.yml.
# MASSter on MassSpecGym v1.5 (benchmark subset), forked from
# config/masster/ma_mi_unmerged/cmf/nist20_ma_mi_unmerged_cmf_dual_ce_fast_batch512_cuda.yml
# (run 6ks7v8ce). Candidate enumeration, loss and batching are unchanged from that arm; the data,
# metadata vocabularies and CE range differ (1-3 below), and on 2026-09-23 the recipe was moved
# to the best measured NIST20 settings (4-6 below). Trained as W&B 1imawkx1 (2026-09-24).
#
# Measured from data/proc/ms_gym_benchmark_1_5/spec_df.pkl (2026-09-20):
#   118,991 spectra / 16,960 molecules / 19,409 groups.
#   Split data/split/ms_gym_benchmark_1_5: 99,306 train, 9,731 val, 9,954 test.
#   prec_type : [M+H]+ for every row.
#   inst_type : FT 81,313 / QTOF 37,678 (no NA, unlike ms_gym_all_1_5).
#   frag_mode : CID for every row.
#   ce        : ce_type "single" everywhere; ACE present on 100% of rows, NCE absent on 100%.
#               base_dataset fills NCE from ACE (nce = ace * 500 / prec_mz), so both CE
#               channels of the dual-CE input are populated.
#   elements  : C H O N S Cl F P Br I B Si As Se -- all in ELEMENT_TO_VE, no "other" bucket hits.
#   peaks     : p50 17, p90 58, p99 208, max 299 per spectrum.
#
# The three msgym-specific deltas from the nist20 arm:
#
# 1. masster_include_cmf false. Every spectrum is [M+H]+ and
#    cmf_duplicate_crf_h_shift("[M+H]+", 4) == -1, i.e. the CMF ion IS the CRF ion at
#    delta_h = -1, so cmf_precursor_valid masks the whole channel. Leaving CMF on would only
#    double num_ion_modes (masster_model.py:1210) for channels that can never be selected.
#    [M+Na]+ and [M+Cl]- stay distinct, which is why the nist20 arm keeps CMF on.
#
# 2. nce_max 300 (template default 200). NCE here is derived from ACE on a small-precursor
#    dataset, so the derived values run high: p50 50, p99 284, max 874. At 200, 3.11% of rows
#    clamp onto one embedding row; at 300, 0.79% do. ace_max stays 300 -- only 0.01% of the raw
#    ACE values (max 358.4) exceed it.
#
# 3. min_epochs/max_epochs 128/128 (was 174/290, exposure-matched to the parent's 100 epochs).
#    drop_last is off, so an epoch is ceil(99,306 / 512) = 194 steps and 128 epochs = 24,832.
#    The parent (562 steps/epoch, constant LR) had plateaued by ~17k steps: 0.6988 @ep20,
#    0.6999 @ep30, 0.7033 @ep99. 128 epochs is past that on steps and on passes per molecule
#    (12,310 train molecules here at 8.07 spectra each; 15,514 at 18.55 in nist20 ma_mi).
#    The cosine schedule (5) needs a fixed length, so min == max.
#
# 4. masster_intensity_norm_placement: pre. `a1_prenorm` (q4t4udee) is the only clean
#    single-key PASS of the 128-epoch merged screen: +0.0056 tail mean (118-127) against the
#    0.7270 control, parameter-identical, and it halves the calibration drift.
#    docs/findings/masster/masster_architecture_arms_epoch128_2026_09_22.md
#
# 5. Cosine LR to 1% of peak with the template's 1000-step linear warmup, i.e. arm
#    `d3_cosine_warmup1000` (rcfzf67p): best <=127 0.7357 against a 0.7286 control mean; d1/d2
#    (no warmup) reached 0.7329/0.7326. n=1. lr_total_steps = 128 x 194 = 24,832; change it
#    with max_epochs. The schedule clamps at the floor, so an overshoot is harmless.
#    docs/findings/masster/masster_overfit_readout_2026_09_22.md
#    4 + 5 together are UNTESTED: every NIST20 read above changed one of them alone, and a7
#    showed attention-side gains are not additive.
#
# 6. The three 2026-09-20 defaults (h_transfer_bound valence, boundary_bond_encoder, the
#    candidate feature list) are PINNED at the values c4a_base_s1 pins, so a later default flip
#    cannot move this run. They equal today's template defaults; the architecture is unchanged.
#
# Measured and deliberately NOT applied: a1+a6 attention stacks (not additive), the subformula
# target filter (a denominator effect), candidate atom dropout, wd/dropout arms, g1 encoder
# simplification (all nulls or rejections). Boundary-block dropout was never trained, and
# fragment-marginal selection closed null. EMA (ema_decay) passed on NIST20 after this was
# written (2026-09-24) and is the _ema999 arm.
#
# frag_modes keeps HCD next to CID although msgym is 100% CID, matching
# config/massspecgym/ms_gym_all_1_5.yml, so a checkpoint stays usable on HCD data.
# No frag_dp: MASSter enumerates cut masks from the molecular graph and reads no DAG files.
