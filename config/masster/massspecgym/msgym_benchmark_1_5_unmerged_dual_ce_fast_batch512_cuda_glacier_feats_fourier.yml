seed: 397623
spec_fp: data/proc/ms_gym_benchmark_1_5/spec_df.pkl
mol_fp: data/proc/ms_gym_benchmark_1_5/mol_df.pkl
split_dp: data/split/ms_gym_benchmark_1_5
spec_params:
  merge: false
  merge_keep_ces: false
  nce: true
  ace: true
  prec_type: true
  prec_types:
  - '[M+H]+'
  inst_type: true
  inst_types:
  - ORB
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  - a_fused_ring   # GLACIER parity: atom at a ring fusion
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
  - b_ring_size    # GLACIER parity: size of the smallest ring containing the bond
  - b_fused_ring   # GLACIER parity: bond at a ring fusion
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
