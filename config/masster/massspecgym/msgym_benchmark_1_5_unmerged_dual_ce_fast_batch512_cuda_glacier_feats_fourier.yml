lr_total_steps: 24832
lr_min_ratio: 0.01
lr_warmup_steps: 1000
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 128
max_epochs: 128
debug_overfit: false
compile: false
pl_enable_progress_bar: true
