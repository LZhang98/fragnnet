# ARM glacier_feats_fourier -- glacier_feats plus int_embedder fourier, 2026-10-03.
# msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda_glacier_feats.yml (the config ll04i00m
# was run with) plus ONE key: int_embedder fourier. Nothing else changes.
#
# WHY. At nce_max / ace_max 300 the template abs-sines table gives CE x and 512 - x the same row
# (44 NCE pairs in 212-300; MSGYM's derived NCE reaches p99 284) and gives neighbouring CEs
# unrelated rows. fourier (sin + cos) gives every integer 0-300 its own row. In MASSter the
# int_embedder feeds only the NCE / ACE tables (masster_model.py, MassterContextEncoder), so this
# re-encodes CE and nothing else. NIST20 test of the same swap: n4 (shjgv9im).
# The glacier_feats file itself stays on abs-sines: inference builds the model from the config,
# so ll04i00m must keep loading against it.
#
# READ against ll04i00m (glacier_feats, abs-sines) on val, best and tail of
# val_cos_sim_0.01_epoch/mean; then the formula-retrieval val scores (ll hit@1, by instrument).
#
# ARM glacier_feats -- MassSpecGym simulation challenge, GLACIER-parity features ON, 2026-09-24.
#
# The base run msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda (W&B 1imawkx1) plus the four
# GLACIER-parity features that have never been trained anywhere (the c4a_ring_topology and
# c4a_complement_composition NIST arms were written, never run):
#   a_fused_ring, b_ring_size, b_fused_ring   ring topology on atoms and bonds (GNN input)
#   c_nl_composition                          log1p element counts of the complementary neutral
#                                             loss in the intensity token: GLACIER's formula term,
#                                             which separates CO (27.9949) from C2H4 (28.0313)
# The formula-only finding (731fe493:docs/findings/masster/masster_formula_only_baseline_2026_09_23.md, removed 2026-10-18)
# puts the transferable formula-level signal at +0.005 (largest above NCE 60), so expect small.
# The cut features (c_cut_bonds, c_cut_adjacency) are NOT added: null on the merged NIST screen.
# upload_checkpoints is turned on (not a training key) for the offline reads.
#
# DATA: ms_gym_benchmark_1_5 is exactly MassSpecGym's official spectrum-simulation challenge set
# (simulation_challenge == True: 119,029 [M+H]+ spectra, all with collision energy). The other
# 112,075 MassSpecGym spectra lack collision energy on 97.6% of rows and are not part of it.
# READ against 1imawkx1 on the same val set at matched epoch (tail mean of the last 10 epochs, and
# best), then offline on the simulation test set (9,954 spectra). Four keys, so a gain is not
# attributable to one of them; split into ring-topology and composition arms only if it moves.
#
# Base header follows.
# MASSter on MassSpecGym v1.5 (benchmark subset), forked from
# config/masster/ma_mi_unmerged/cmf/nist20_ma_mi_unmerged_cmf_dual_ce_fast_batch512_cuda.yml
# (run 6ks7v8ce). Candidate enumeration, loss and batching are unchanged from that arm; the data,
# metadata vocabularies and CE range differ (1-3 below), and on 2026-09-23 the recipe was moved
# to the best measured NIST20 settings (4-6 below). This config has never been trained.
#
# Measured from data/proc/ms_gym_benchmark_1_5/spec_df.pkl (2026-09-20):
#   118,991 spectra / 16,960 molecules / 19,409 groups.
#   Split data/split/ms_gym_benchmark_1_5: 99,306 train, 9,731 val, 9,954 test.
#   prec_type : [M+H]+ for every row.
#   inst_type : FT 81,313 / QTOF 37,678 (no NA, unlike ms_gym_all_1_5).
#   frag_mode : CID for every row.
#   ce        : ce_type "single" everywhere; ACE present on 100% of rows, NCE absent on 100%.
#               base_dataset fills NCE from ACE (nce = ace * 500 / prec_mz), so both CE
#               channels of the dual-CE input are populated.
#   elements  : C H O N S Cl F P Br I B Si As Se -- all in ELEMENT_TO_VE, no "other" bucket hits.
#   peaks     : p50 17, p90 58, p99 208, max 299 per spectrum.
#
# The three msgym-specific deltas from the nist20 arm:
#
# 1. masster_include_cmf false. Every spectrum is [M+H]+ and
#    cmf_duplicate_crf_h_shift("[M+H]+", 4) == -1, i.e. the CMF ion IS the CRF ion at
#    delta_h = -1, so cmf_precursor_valid masks the whole channel. Leaving CMF on would only
#    double num_ion_modes (masster_model.py:1210) for channels that can never be selected.
#    [M+Na]+ and [M+Cl]- stay distinct, which is why the nist20 arm keeps CMF on.
#
# 2. nce_max 300 (template default 200). NCE here is derived from ACE on a small-precursor
#    dataset, so the derived values run high: p50 50, p99 284, max 874. At 200, 3.11% of rows
#    clamp onto one embedding row; at 300, 0.79% do. ace_max stays 300 -- only 0.01% of the raw
#    ACE values (max 358.4) exceed it.
#
# 3. min_epochs/max_epochs 128/128 (was 174/290, exposure-matched to the parent's 100 epochs).
#    drop_last is off, so an epoch is ceil(99,306 / 512) = 194 steps and 128 epochs = 24,832.
#    The parent (562 steps/epoch, constant LR) had plateaued by ~17k steps: 0.6988 @ep20,
#    0.6999 @ep30, 0.7033 @ep99. 128 epochs is past that on steps and on passes per molecule
#    (12,310 train molecules here at 8.07 spectra each; 15,514 at 18.55 in nist20 ma_mi).
#    The cosine schedule (5) needs a fixed length, so min == max.
#
# 4. masster_intensity_norm_placement: pre. `a1_prenorm` (q4t4udee) is the only clean
#    single-key PASS of the 128-epoch merged screen: +0.0056 tail mean (118-127) against the
#    0.7270 control, parameter-identical, and it halves the calibration drift.
#    docs/findings/masster/masster_architecture_arms_epoch128_2026_09_22.md
#
# 5. Cosine LR to 1% of peak with the template's 1000-step linear warmup, i.e. arm
#    `d3_cosine_warmup1000` (rcfzf67p): best <=127 0.7357 against a 0.7286 control mean; d1/d2
#    (no warmup) reached 0.7329/0.7326. n=1. lr_total_steps = 128 x 194 = 24,832; change it
#    with max_epochs. The schedule clamps at the floor, so an overshoot is harmless.
#    docs/findings/masster/masster_overfit_readout_2026_09_22.md
#    4 + 5 together are UNTESTED: every NIST20 read above changed one of them alone, and a7
#    showed attention-side gains are not additive.
#
# 6. The three 2026-09-20 defaults (h_transfer_bound valence, boundary_bond_encoder, the
#    candidate feature list) are PINNED at the values c4a_base_s1 pins, so a later default flip
#    cannot move this run. They equal today's template defaults; the architecture is unchanged.
#
# Measured and deliberately NOT applied: a1+a6 attention stacks (not additive), the subformula
# target filter (a denominator effect), candidate atom dropout, wd/dropout arms, g1 encoder
# simplification (all nulls or rejections). EMA (ema_decay), boundary-block dropout and
# fragment-marginal selection exist but have not been trained yet.
#
# frag_modes keeps HCD next to CID although msgym is 100% CID, matching
# config/fragnnet/massspecgym/ms_gym_all_1_5.yml, so a checkpoint stays usable on HCD data.
# No frag_dp: MASSter enumerates cut masks from the molecular graph and reads no DAG files.
