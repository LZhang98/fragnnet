# Arm f3 -- marginal K128 from a U512 pool (still E4096): f2 with a larger pool to rank from.
# Read against f2: does a deeper pool help at the same intensity-head budget?
#
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml, same seed (397623), same
# 128-epoch box. The existing c4a_base_s1/s2 runs are the control (tail mean 0.7270, the two
# replicates spanning 0.0007); read the 118-127 tail mean against them with the +/-0.005 gate of
# 95341fce:docs/findings/masster/masster_architecture_arms_epoch128_2026_09_22.md, removed 2026-10-18.
#
# All three arms also switch on masster_candidate_coverage_metrics and
# masster_candidate_cut_diagnostics. Both are monitoring only: they add validation
# coverage per cut count and, in marginal mode, val_pool_candidate_wrecall, and change nothing
# the model trains on. The control never logged them, so compare coverage among the arms.
#
# Plan and reading rules: docs/plans/masster/masster_fragment_marginal_selection_plan.md.
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_f3_marginal_k128_pool512
wandb_group: nist20_mass_shatter_fragment_selection
wandb_tags:
- f3_marginal_k128_pool512
- fragment_selection_2026_09_23
- masster
- cuda_candidates
- fir_h100_mig
- nist20_ma_mi
- unique_fragments_512
- marginal_selection
- selected_fragments_128
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_64
- microbatch_512
- effective_batch_512
- merged
- merged_consensus
- nce_only
- no_cmf
- exposure_matched_epochs
- horizon_probe_2026_09_20
- train_aux_metrics
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: true
  merge_keep_ces: true
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+Cl]-'
  inst_type: true
  inst_types:
  - ORB
  - ORB_F
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 512
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_fragment_selection: marginal
masster_selected_fragment_target: 128
masster_candidate_coverage_metrics: true
masster_candidate_cut_diagnostics: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: false
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 128
max_epochs: 128
debug_overfit: false
compile: false
pl_enable_progress_bar: true
upload_checkpoints: false
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01

# Train-side auxiliary metrics off: see the header. This keeps peak GPU near 26.8 GiB so the run
# fits a 3g.40gb slice, at the cost of the train cosine (and therefore the train/val gap).
compute_train_auxiliary_metrics: false

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
masster_candidate_backend: cuda

# Campaign override(s) not present in the base file:
masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
