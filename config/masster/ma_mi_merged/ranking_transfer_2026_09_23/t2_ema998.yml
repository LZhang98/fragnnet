# ARM t2_ema998 -- exponential moving average of the weights, decay 0.998, 2026-09-23.
# Two runs of the same architecture disagree per spectrum (prediction cosine p10 0.65); averaging
# their predictions adds +0.020 cosine and cuts the val ranking gap 0.120 -> 0.110, and averaging
# two ADJACENT checkpoints of one run adds +0.008 (their weights: +0.003) -- optimizer noise at the
# constant LR 1e-3 (lr_schedule: false). This arm keeps a per-step EMA of the weights; validation,
# the best-checkpoint choice and saved state_dicts use the average (fragnnet.utils.pl_utils.
# ExponentialMovingAverage). The lineage runs 90 steps/epoch (c4a_base_s1, 5qws8g9x), so 0.998 gives
# the average a mean age of ~500 steps, ~5.5 epochs. CAUTION reading the gap: train-side auxiliary
# metrics measure the RAW training weights while val measures the average, so the logged train/val
# gap mixes two models. Take train metrics for this arm from an offline eval of the checkpoint.
#
# Question: the ranking error is a generalization failure. On a 25.6k-spectrum train sample the
# unmerged [M+H]+/FT checkpoint 6h67zps9 has ranking gap 0.011 and base-peak hit 84.5%; on val
# 0.121 and 56.7% (docs/findings/masster/masster_ranking_decomposition_2026_09_23.md).
# This arm tests one way of making the ranking transfer (the boundary-dropout sibling t1 was
# dropped 2026-09-24: blocking one head input can reroute the lookup). Plan:
# docs/plans/masster/masster_ranking_transfer_plan.md.
#
# CONTROL: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1_trainaux.yml (same seed 397623,
# 128/128 epochs, compute_train_auxiliary_metrics on). This file is that control plus ONE key and
# wandb naming; the resolved one-key diff is asserted in the plan's validation section.
# READ at matched epoch: tail mean of val_cos_sim_0.01 over epochs 118-127 against the control
# (standing gate +/-0.005; tail-mean reproducibility floor 0.0004), AND the ranking gap and
# base-peak hit from an offline decomposition of the best checkpoint's val export. A narrowed
# train/val gap without a val gain is not a pass: three arms have done that and lost.
# PROFILE fir:h100-80gb for the train metrics (peak ~37 GiB), 3 h box.
#
# Control header follows.
# ARM c4a_base_s1_trainaux -- train-metric control, 2026-09-22.
# Identical to nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml except for
# compute_train_auxiliary_metrics (false -> true) and wandb naming. Exists so that arms
# carrying that key -- starting with c4d_wd10 -- have a matched TRAIN cosine to read the
# train/val gap against; c4a_base_s1/s2 supply the matched val cosine and nothing else.
# This is also recommendation 1 of the 2026-09-22 overfit read-out.
# PROFILE: fir:h100-80gb, not 3g.40gb -- the key takes peak GPU from 30.4 to ~37 GiB,
# which is 99.9% of a 3g slice. Same seed 397623 as c4a_base_s1, so the val cosine of this
# run is also a third same-seed replicate of the control and a free check that turning the
# metric on does not move the optimization.
#
# Original c4a_base_s1 header follows.
# ARM c4a_base_s1 -- 4 h exploration campaign, 2026-09-21.
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_long_control.yml. Differs from the base by exactly: (nothing but wandb naming).
# The candidate feature list, boundary-bond-encoder and h-transfer-bound keys below
# are PINNED, not inherited, so a later default flip cannot move this comparison underneath
# it. boundary_bond_encoder was NOT pinned before 2026-09-21 and silently rode the template
# default (True) in every c4 arm; that is the defect this campaign exists to avoid.
#
# Tier A control. Current defaults (candidate mass features, candidate charge feature,
# h_transfer_bound: valence) at the campaign's 4 h box. No MASSter run has ever trained
# on this architecture: all three defaults flipped on 2026-09-20, after the regularization
# sweep read out. This arm IS the new baseline; every other arm in the campaign is a
# single-key diff from it. Seed 397623, the seed in 81 of 83 historical runs.
#
# HORIZON (2026-09-21): resized 630 -> 128 epochs. The horizon probe `tkkesus9` ran the full
# 630-epoch schedule and val cosine SATURATES BY ~EPOCH 100: 0.7232@64 -> 0.7292@100 ->
# 0.7287@300 -> 0.7309@629, i.e. the last 529 epochs buy +0.0017, inside the 0.0016 control
# replicate floor. 128 epochs (~1.8 h at the measured 70 ep/h) reaches the plateau, so the
# saved wall clock is spent on n>=2 replicates instead -- which is what this family actually
# needs at a 0.003-0.005 replicate floor.
