# ARM c4d_wd10 -- 4 h exploration campaign, 2026-09-21.
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_long_control.yml. Differs from the base by exactly: weight_decay.
# The candidate feature list and h-transfer-bound keys below are PINNED at their
# 2026-09-20 template values, not inherited, so a later default flip cannot move this
# comparison underneath it.
#
# Weight decay 0.01 -> 0.1. The other gap-mover (0.122), nominally the sweep's best arm at
# +0.0015 but inside the 0.0016 control spread, and it was climbing fastest of any arm at
# the wall (+0.0047 val cosine per 10 epochs vs the control's +0.0034). Retested where that
# slope can actually express itself.
#
# HORIZON (2026-09-22): resized 630 -> 128 to match the screen every current arm is read at,
# and train auxiliary metrics turned on (see the key near the bottom for its measured cost).
# This arm has NEVER run; `kalc4mzo` is the wd 0.1 run in the index and it is NOT this arm's
# predecessor -- it ran 2026-09-19, before the three candidate/h-transfer defaults flipped on
# 2026-09-20, so it trained a different architecture even though re-resolving its config today
# inherits the new defaults. Read this arm against `c4a_base_s1_trainaux`, NOT against
# `kalc4mzo` and NOT against `ctrl_a`/`ctrl_b`, which are on the same superseded base.
#
# CONTROL: `c4a_base_s1/s2` have compute_train_auxiliary_metrics FALSE, so they give a matched
# val cosine but no matched train cosine. The train/val gap -- the whole question here -- needs
# `..._c4a_base_s1_trainaux.yml` on the same 80gb profile at the same seed.
#
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4d_wd10
wandb_group: nist20_mass_shatter_campaign4h
wandb_tags:
- c4d_wd10
- campaign_4h_2026_09_21
- masster
- cuda_candidates
- fir_h100_mig
- nist20_ma_mi
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_64
- microbatch_512
- effective_batch_512
- merged
- merged_consensus
- nce_only
- no_cmf
- exposure_matched_epochs
- horizon_probe_2026_09_20
- train_aux_metrics
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: true
  merge_keep_ces: true
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+Cl]-'
  inst_type: true
  inst_types:
  - FT
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0
inst_type_loss_tol:
  FT:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.1
lr_schedule: false
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 128
max_epochs: 128
debug_overfit: false
compile: false
pl_enable_progress_bar: true
upload_checkpoints: false
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01

# Train-side auxiliary metrics ON, deliberately: the train cosine (and therefore the train/val
# gap) IS the measurement this arm exists to make, and the 2026-09-19 screen's claim that wd 0.1
# narrows the gap without suppressing train cosine cannot be confirmed without it.
# COST, measured 2026-09-22 on the two runs that had it on (`kalc4mzo`, `ri3zm215`):
# peak GPU 36.2-37.2 GiB against 30.4 GiB for `c4a_base_s1` without it, and +6% wall clock
# (0.91 vs 0.86 min/epoch). 37.2 GiB is 99.9% of a 3g.40gb slice's 37.25 GiB, so THIS ARM MUST
# RUN ON fir:h100-80gb. Do not move it back to 3g.40gb without turning this key off again.
compute_train_auxiliary_metrics: true

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
masster_candidate_backend: cuda

# Campaign override(s) not present in the base file:
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
