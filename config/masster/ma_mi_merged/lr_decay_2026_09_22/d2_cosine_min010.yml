# Arm d2 -- cosine LR decay to 10%% of peak, NO warmup. 2026-09-22 LR-decay screen.
#
# Same one-knob construction as d1 with a higher floor. d1 vs d2 asks how far the LR has to fall
# before the proposal head stops drifting; if d1 helps and d2 does not, the effect is in the last
# decade of LR rather than in decay generally.
#
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64.yml, which is byte-for-byte the config of
# the 630-epoch horizon probe `tkkesus9` apart from name/group/epochs. **Read tkkesus9 at its
# epoch 128 as the control** (val_cos_sim_0.01 = 0.7300); do not read it at epoch 629.
#
# Why: the proposal head overfits far earlier than the spectrum metric. Measured on three runs,
# val_proposal_loss bottoms at epoch 30-47 and then climbs for the rest of training, while
# val cosine keeps improving to ~epoch 100:
#   tkkesus9  best val_proposal 2.1991 @ep46 -> 2.3371 @ep629  (train 1.66, gap 0.67)
#   h1        best val_proposal 2.2250 @ep30 -> 2.2944 @ep127  (train 1.78, gap 0.52)
#   c1        best val_proposal 2.2187 @ep47 -> 2.3110 @ep115
# Every one of those runs trains at a CONSTANT lr 1e-3 with lr_schedule: false and no warmup.
#
# lr_total_steps = 128 epochs x 90 optimizer steps/epoch = 11520. 90 steps/epoch was read
# off trainer/global_step and is the same for 512/lb64 and 256x2/lb32 (accum makes the optimizer
# step count identical). build_lr_scheduler RAISES for cosine without lr_total_steps, and the
# total is the run's planned steps -- if you change max_epochs, change this with it.
#
# Select on val_cos_sim_0.01_epoch/mean at matched epochs, and report val_proposal_loss
# separately: the point of the arm is whether decay moves the proposal minimum later, so a
# cosine win with an unchanged proposal curve is a different result from a cosine win with a
# flattened one.
