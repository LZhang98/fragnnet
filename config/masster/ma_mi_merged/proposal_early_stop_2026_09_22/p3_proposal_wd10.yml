# Proposal early-stop / proposal-decay arms, 2026-09-22.
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml (the 128-epoch control,
# tail mean of epochs 118-127 = 0.7270 over two replicates, spread 0.0007, gate +/-0.005).
# Each arm differs from that control by EXACTLY ONE resolved key, named in its header.
#
# Why this family exists. The 2026-09-22 overfit read-out records that the validation
# proposal term "degrades MORE (+0.06 to +0.14) and turns even earlier (epochs 26-47)" than
# the spectrum term, whose own optimum sits at epochs 52-120. The two branches want
# different horizons, and the proposal branch is 44.8% of the parameters (4,128,642 of
# 9,217,181: BondFocusedBreakHead 3,865,473 + AtomChargeAffinityHead 263,169). Under
# `masster_proposal_selection_only: true` its inputs are detached, so the proposal loss
# updates those parameters and nothing else -- they can be early-stopped or decayed on their
# own without touching what the spectrum objective optimizes.
#
# What these arms do NOT do. Only proposal-only modules are frozen or re-decayed. The shared
# molecular and context encoders keep training on the spectrum objective, so the proposal
# FUNCTION still drifts; a fully static proposal needs
# `masster_separate_proposal_encoder: true`, which is off in every ma_mi_merged config.
#
# Expected reading. The overfit read-out also finds coverage flat (train `wrecall` 0.8975 vs
# val 0.8911, worth ~0.0027 of cosine), so if these arms move val cosine it is because the
# candidate SET's composition improved, not its coverage. Watch `val_wrecall` alongside
# cosine: flat coverage plus moved cosine is the mechanism; both flat is a null.
#
# ARM p3_proposal_wd10. Differs from the control by exactly:
# masster_proposal_weight_decay (null -> 0.1).
#
# The continuous alternative to freezing: 10x the global 0.01 decay on proposal-only
# parameters, the whole-model value that `c4d_wd10` tests. Unlike the freeze this needs no
# epoch chosen in advance, and unlike `c4d_wd10` it leaves the intensity head at 0.01.
