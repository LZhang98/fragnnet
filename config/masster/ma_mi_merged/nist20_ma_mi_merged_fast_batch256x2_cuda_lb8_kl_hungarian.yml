# LOSS-BATCHING VALIDATION ARM -- see `git show e65339ed:docs/plans/masster/masster_direct_loss_batching_plan.md`.
# Exercises the batched sparse_peak_list_distance / round_aggregate_peaks rewrite (86cbf98d) in a
# real training run on the 2g.20gb MIG slice. Derived from ..._ctrl_2g.yml by changing exactly
# loss_type and masster_peak_matching (plus wandb_name/group/tags); every model, data, shape
# and instrumentation key is byte-identical, so ms_reg_ctrl_2g is a same-shape cross_entropy
# throughput baseline and the 1.46x jss/kl epoch-time penalty is read directly against it.
#
# The hungarian arms are the point of the exercise: _solve_batch_assignment dispatches to
# torch_linear_assignment on the cluster (the wheel is installed by the generated job) and to a
# scipy loop locally, so that backend has NEVER executed -- no local test reaches it. Run
# pytest tests/test_masster_peak_list_distance.py on a cluster node before trusting these.
#
# loss_batch_size is 8 here, not the control's 32. Per-mode tuning, from
# 95341fce:docs/findings/masster/masster_loss_audit_2026_09_19.md, removed 2026-10-18 finding 1: on the real ragged merged
# peak-count distribution every spectrum is padded to its chunk's widest peak list, so hungarian
# gets WORSE as the chunk widens (116 ms at lb8 -> 442 ms at lb64), the opposite of the
# uniform-input benchmark; closest peaks near 32 and stays there. lb only changes float
# accumulation order, never the loss value, so the closest-vs-hungarian correctness read is
# unaffected -- only cross-MODE throughput stops being comparable, which it never was.
#
# Intensity output stays `probability`, not `independent`: the loss code under test is reached
# identically either way, and keeping it avoids the 6-key CE-vs-JSS bundle confound.
#
# Read at matched epoch against ms_reg_ctrl_2g only. These are merged tolerance_consensus targets
# (post 2026-09-03), so nothing here compares to earlier merged cosines or to the L40S replicates.
wandb_name: nist20_ma_mi_merged_fast_batch256x2_cuda_lb8_kl_hungarian
wandb_group: nist20_mass_shatter_loss_batching_check
wandb_tags:
- masster
- cuda_candidates
- fir_h100_mig
- nist20_ma_mi
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_8
- microbatch_256
- effective_batch_512
- merged
- merged_consensus
- nce_only
- no_cmf
- exposure_matched_epochs
- loss_batching_check_2026_09_19
- kl_distance
- peak_matching_hungarian
- train_aux_metrics
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: true
  merge_keep_ces: true
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+Cl]-'
  inst_type: true
  inst_types:
  - ORB
  - ORB_F
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: kl_distance
masster_peak_matching: hungarian
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 8
primary_loss_weight: 1.0
