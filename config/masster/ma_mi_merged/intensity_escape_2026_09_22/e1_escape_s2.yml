# 2026-09-22 intensity-escape campaign, derived from the loss-objective arm
# h1_hellinger_closest.yml (run oykkffls, val cos 0.7247 @ep121).
#
# Why a two-step ladder and not one arm: h1 deliberately keeps
# `masster_intensity_output: probability` to avoid the CE-vs-direct-loss bundle confound,
# but the escape is only read by the peak-list path and MassterPL REQUIRES `independent`.
# Turning the escape on against h1 would therefore move two keys at once. So:
#
#   h1  (already run)  probability, no escape   <- existing anchor, oykkffls
#   e0  (this campaign) independent, no escape  <- isolates the output mode
#   e1  (this campaign) independent, escape ON  <- isolates the escape
#
# Read e1 against e0, never against h1. Each step is one key.
#
# What the escape does: candidate coverage is incomplete -- merged MA/MI val wrecall is 0.891 --
# so ~10.9% of observed intensity sits at m/z no candidate reaches, and a predicted distribution
# normalized over candidates alone must over-allocate everything it CAN reach. The escape
# collapses every unreachable observed peak into one coordinate whose mass the model predicts.
# Design and algebra: docs/plans/masster/masster_supervised_escape_plan.md. Sizing:
# docs/findings/masster/unexplained_peak_split_2026_09_22.md.
#
# SELECT ON val_cos_sim_0.01_epoch/mean ONLY. The escape changes the objective -- it adds a
# coordinate the model can trivially get right -- so `spec_peak_distance` is GUARANTEED to fall
# and is not comparable across e0/e1. The toy smoke pair showed exactly that: Hellinger halved
# while cosine moved slightly DOWN. Treat a loss improvement here as meaningless.
#
# The escape does not change coverage. `wrecall`/`recall`/`precision` were identical to the last
# digit between the smoke arms; if they move here, something is wrong, not better.
#
# `escape_share` is logged per spectrum. At init it is 0.1 by construction; if it stays there the
# head never learned, and if it tracks 1 - wrecall (~0.109 on this split) the mechanism works.
#
# Budget: 128 epochs, matching h1 and the 2026-09-21 saturation finding. n=2 seeds per arm,
# because this family's replicate floor is 0.003-0.005 and an n=1 arm cannot resolve it.
#
# These are merged tolerance_consensus targets (post 2026-09-03). Nothing here compares to
# earlier merged cosines.
