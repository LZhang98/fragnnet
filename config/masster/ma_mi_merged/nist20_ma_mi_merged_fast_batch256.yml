- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
