# Merged MASSter arm on the multi-adduct split, NCE only and CMF off.
# Derived from nist20_ma_mi_unmerged_cmf_dual_ce_fast_batch256.yml but NOT a controlled A/B against it:
# merging is deliberately confounded here with two other changes, by decision of the user.
#   1. `masster_include_cmf: false`  (the unmerged base has it on)
#   2. `spec_params.ace: false`           (the unmerged base is dual CE)
# Rationale: no merged MASSter run has ever trained a live CMF channel or used dual CE, so
# these arms stay inside the merged family's established settings instead of introducing both
# at once. To isolate merging alone, build unmerged siblings with the same two flags off.
# `ace_max: 300` is retained but inert while `ace: false`: no ACE embedder is constructed.
# All four adducts stay in `prec_types`; turning CMF off removes the charged-molecular-formula
# channel, not the Na/Cl spectra (5,993 [M+Na]+ and 748 [M+Cl]- of 45,639 merged train rows).
# Merging groups by acquisition `group_id`: measured train 287,721 -> 45,639 rows (6.304x) and
# val 96,153 -> 15,257 on data/split/nist20_ma_mi_inchikey. Epochs are scaled by that ratio
# (378/630 against the base's 60/100) so the row budget matches the unmerged arm; per-epoch
# validation cost scales down by the same factor. A merged row conditions on the mean-pooled
# acquisition CE ladder (median 4 readings, max 86), not a single energy.
# Merged and unmerged validation cosine score different targets and are not directly comparable;
# compare checkpoints on one common test set at inference.
# See docs/guides/benchmark_masster_merged_control.md.
