# Arm h2 -- linear cosine, closest matching. 2026-09-21 loss-objective campaign.
# Plan: docs/plans/masster/masster_nonprobabilistic_intensity_plan.md, "Follow-up objective amendment".
#
# The matched linear-cosine control step 1 of the plan requires. The lineage has
# cross_entropy, jss_distance and kl_distance arms but has never run cosine_distance, so
# without this arm the Hellinger result has no linear-space reference at the same alignment.
# Derived from ..._lb32_jss_closest.yml by changing exactly loss_type (plus name/tags/epochs).
#
# This is the WEAK-recovery end of the probe: absolute correct-logit gradient 0.0000655, about
# 1/62 of Hellinger's. Expect it to lose; the point is to measure by how much.
#
# NOTE: ints_transform stays `none`. `ints_transform: sqrt` + cosine is NOT a cheap Hellinger:
# SpectrumPL.preproc_spec square-roots training TARGETS and leaves predictions in their learned
# coordinates, so sqrt never enters the prediction-side autograd path. Do not substitute it.
#
# Budget: 128 epochs, not the lineage's 630. Validation cosine saturates near epoch 100
# (docs/plans/masster/masster_regularization_sweep_plan.md, 2026-09-21: the last 529 of 630 epochs
# buy +0.0017). Read every control at ITS epoch 128 from W&B, never at its final epoch, and
# give only the selected objective a full-budget rerun.
#
# These are merged tolerance_consensus targets (post 2026-09-03). Nothing here compares to
# earlier merged cosines or to the 512-microbatch L40S replicates.
wandb_name: nist20_ma_mi_merged_fast_batch256x2_cuda_lb32_cosine_closest
wandb_group: nist20_mass_shatter_loss_objective
wandb_tags:
- masster
- cuda_candidates
- fir_h100_mig
- nist20_ma_mi
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_32
- microbatch_256
- effective_batch_512
- merged
- merged_consensus
- nce_only
- no_cmf
- exposure_matched_epochs
- loss_objective_2026_09_21
- cosine_distance
- peak_matching_closest
- train_aux_metrics
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: true
  merge_keep_ces: true
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+Cl]-'
  inst_type: true
  inst_types:
  - ORB
  - ORB_F
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cosine_distance
masster_peak_matching: closest
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 32
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0
inst_type_loss_tol:
