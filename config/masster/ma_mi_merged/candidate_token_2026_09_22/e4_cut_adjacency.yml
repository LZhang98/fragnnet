# Arm e4 -- adjacency of the cut set, alone. Differs from the base by exactly one list entry:
# c_cut_adjacency.
#
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml, same seed (397623), same
# 128-epoch box. Read c4a_base_s1 as the control; its two replicates span 0.0007 val cosine,
# against a 0.003-0.005 same-seed replicate floor for the family, so call nothing below ~0.007
# at n=1.
#
# Measured on MASSter's OWN candidates, 200 molecules, uniform bond logits
# (scripts/debug/debug_candidate_cut_descriptors.py; the plan's earlier numbers came from the
# depth-3 BFS DAG and are superseded):
#   87.3% of candidates are cut at >= 2 bonds (DAG said 96.8%)
#   of those, 82.7% have two cuts sharing a ring and 80.0% two cuts sharing an ATOM
#   within-molecule candidates per bucket: cut count 48.0 -> cut-bond sum 23.2
#     -> + adjacency in/out 10.9 -> + ring terms 10.9
#   46.0% of candidates share a summed cut-bond vector with one that disagrees about whether
#     ANY cuts are adjacent; the same figure for the ring-sharing flag is 0.0%
# The pooled bond sum already implies ring sharing. Adjacency is what is missing, and it needs
# no ring identity, so it needs no new graph field and no cache regeneration.
#
# Two columns: how many pairs of the candidate's cut bonds meet at a shared atom, split by
# whether that atom is retained or lost. A shared RETAINED atom means one atom of the fragment
# lost two substituents; a shared LOST atom means the fragment expelled a bridging atom, which is
# the CO/CH2/S extrusion shape. This is a relation BETWEEN cuts, so mean pooling over per-bond
# encodings destroys it by construction and no bond feature can carry it.
#
# Run alongside e5, which stacks it on the pooled cut-bond features: e4 - base is what adjacency
# is worth on its own, e5 - e1 is what it is worth given the bond sum, and the measurement above
# says those are different questions.
