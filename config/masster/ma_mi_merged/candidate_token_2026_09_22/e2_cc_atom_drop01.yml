# Arm e2 -- per-atom dropout on the pooled component embeddings, p = 0.1. Differs from the
# base by exactly one key: masster_candidate_atom_dropout.
#
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml, same seed (397623), same
# 128-epoch box, so the pair is a matched comparison. Read c4a_base_s1 as the control; its two
# replicates span 0.0007 val cosine, against a 0.003-0.005 same-seed replicate floor for the
# family, so call nothing below ~0.007 at n=1.
#
# Why this family exists: the 2026-09-22 read-out puts the train/validation gap at 0.151 cosine
# by epoch 127 with train wrecall 0.8975 against validation 0.8911 -- a 0.0064 coverage
# difference. ~98% of the gap is which candidate gets the intensity, not which candidates
# exist, and the candidate token is what drives that choice.
# See docs/plans/masster/masster_cut_set_features_plan.md and
# docs/findings/masster/masster_overfit_readout_2026_09_22.md.
#
# The mechanism. The candidate token's first two blocks are mean pools over the candidate's
# atoms and over its complement -- 768 of 1,285 columns, and the most identifiable thing the
# head sees: on 882 molecules / 57,925 fragments the cc atom mask is 1.00 distinct fragments per
# descriptor bucket, i.e. 100% singletons. This arm drops each atom from the membership set with
# probability p before pooling, in training only, so the pooled embedding sees a random subset.
#
# Why the complement is NOT held exact. The complement is derived as precursor minus candidate,
# so an exact complement beside a corrupted candidate would leave the true candidate sum
# recoverable by subtraction -- the memorization route this is aimed at. Dropped atoms therefore
# migrate to the complement side and both pools stay means over a well-formed atom set. Sizes,
# masses, charges, compositions, cut counts and the boundary embedding all keep the TRUE
# membership, so the intervention is confined to the pooled component embeddings.
#
# Precedent: FraGNNet's `cc_atom_dropout` is the same hypothesis, is implemented, and its
# written p = {0.0, 0.1, 0.2} sweep has never been run. No token width change, no parameters,
# and no effect at evaluation, so validation metrics stay deterministic.
