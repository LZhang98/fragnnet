# Arm e1 -- the severed bonds' own input features in the candidate token. Differs from the
# base by exactly one list entry: c_cut_bonds.
#
# Base: nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml, same seed (397623), same
# 128-epoch box, so the pair is a matched comparison. Read c4a_base_s1 as the control; its two
# replicates span 0.0007 val cosine, against a 0.003-0.005 same-seed replicate floor for the
# family, so call nothing below ~0.007 at n=1.
#
# Why this family exists: the 2026-09-22 read-out puts the train/validation gap at 0.151 cosine
# by epoch 127 with train wrecall 0.8975 against validation 0.8911 -- a 0.0064 coverage
# difference. ~98% of the gap is which candidate gets the intensity, not which candidates
# exist, and the candidate token is what drives that choice.
# See docs/plans/masster/masster_cut_set_features_plan.md and
# docs/findings/masster/masster_overfit_readout_2026_09_22.md.
#
# What it adds. `_boundary_embeddings` builds the boundary block from ATOM ENDPOINT embeddings
# and never reads `mol_pyg.chemical_bond_attr`, so a cut bond's own attributes reach the
# intensity head only through endpoint atom mixing -- and an internal atom mixes all of its
# incident bonds into one state, so for an endpoint of degree > 1 they are not cleanly
# recoverable. This arm pools `chemical_bond_attr[boundary_bond_indices]` per candidate, summed
# and averaged. The summed half is the multiset of broken bond types ("two aromatic ring bonds
# and one single bond") and delivers how many cut bonds were ring bonds for free.
#
# Cost: 2 x 9 = 18 columns on this arm's 1,285-dim token (b_degree/b_ring/b_conj), and no new
# parameters -- the existing input projection absorbs them. Raw input features, so there is no
# coupling to the proposal head, unlike feeding its learned bond states forward.
#
# Measured motivation, with its caveat. On 200 molecules / 85,819 depth-3 DAG fragments, 96.8%
# are cut at >= 2 bonds and 55.4% have two cuts sharing a ring -- a ring opening, which mean
# pooling represents identically to two unrelated cuts. The 77%-at-exactly-3-cuts DISTRIBUTION
# is an artifact of depth-3 enumeration, not of MASSter's own candidate sets; recompute it on
# real candidate batches before quoting it. The qualitative point -- multi-cut candidates
# dominate and ring-sharing among them is common -- is what this arm rests on.
#
# Note the token width changes, so a checkpoint trained without this key will not load into it.
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_e1_cut_bond_feats
wandb_group: nist20_mass_shatter_candidate_token
