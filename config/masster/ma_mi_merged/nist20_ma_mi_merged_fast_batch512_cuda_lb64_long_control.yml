# HORIZON PROBE: one complete 630-epoch run of the merged MA/MI control.
#
# Why: nobody has ever run this family to convergence. The 2026-09-19 sweep stopped at epoch 64
# -- about 10% of the schedule -- with every arm still climbing (control +0.0034 val cosine per
# 10 epochs, wd10 +0.0047) and the train/val gap growing monotonically, 0.064 at epoch 20 ->
# 0.109 at 40 -> 0.128 at 64. Every null in that sweep therefore carries "at 10% exposure" as a
# caveat, and no screen can be sized properly until the peak epoch is known.
#
# What it answers: where val cosine peaks, whether the train/val gap plateaus or keeps widening,
# and how many epochs a future screen actually needs. At the measured 0.84 min/epoch on an H100,
# 630 epochs is about 8.8 h, so a 12 h allocation completes the schedule with margin.
#
# Instrumentation is OFF here, by decision: `compute_train_auxiliary_metrics` drives peak GPU
# from 26.2-26.8 GiB to 36-53 GiB (model-dependent, via the dense |true| x |pred| tensor that
# precision/recall build in `calculate_match_mzs`), which forces a full 80 GB card. Off, the run
# fits `fir:h100-3g.40gb` at roughly half the price. The cost is that this run reports only the
# VALIDATION curve: it answers "where does val peak", not "does the train/val gap plateau". The
# gap trajectory to epoch 64 already exists from the 2026-09-19 sweep arms; if the plateau
# question matters later, re-run with the flag on and budget an 80 GB card.
#
# Deliberate difference from the sweep's controls: the hydrogen-transfer bound is on, matching
# the template default since 2026-09-20. Measured cost at epoch 64 was -0.0002 val cosine
# (inside a control pair that agreed to 0.0016), so the curves should overlay; it is set here
# explicitly rather than inherited so this file states what it ran.
# Arm of the regularization/normalization sweep -- see
# docs/plans/masster/masster_regularization_sweep_plan.md. Every config in the sweep sets
# compute_train_auxiliary_metrics: true so the train cosine is logged next to the validation
# cosine; no MASSter run before this sweep has ever logged one. Compare arms at matched
# epoch against ..._ctrl_a / ..._ctrl_b, never at matched wall clock and never against the
# 2026-09-18 L40S runs. loss_batch_size and num_workers are slice-dependent and are set at
# launch (2g.20gb needs loss_batch_size=16, num_workers=3); they do not change the loss.
# loss_batch_size 64 counterpart of nist20_ma_mi_merged_fast_batch512_cuda.yml (the arm it derives from
# used 8; template default is 32). Only loss_batch_size, wandb_name and tags
# differ. Measured cost: the merged peak-count tail (sigma 1.29, max 1168) makes
# the padded loss tensors spiky -- budget ~+4 GB over lbs=8 at microbatch 256.
# CUDA candidate counterpart of nist20_ma_mi_merged_fast_batch512.yml.
# Exact FP32 single-mixture selection/topology; CPU remains the template default.
# Local correctness/throughput checks passed; L40S acceptance is pending.
# Requires an existing compatible CUDA toolkit for the first native build.
# See docs/guides/benchmark_masster_merged_control.md for scope and confounds.
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_long_control
wandb_group: nist20_mass_shatter_horizon
