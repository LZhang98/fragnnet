# BASELINE -- MASSter on Enveda-180 alone, [M+H]+ and [M-H]-, 2026-09-26.
#
# First Enveda run. It was built as control `i0` of
# 95341fce:docs/plans/masster/masster_isotope_envelope_plan.md, removed 2026-10-18, which closed null at its model-free gate on
# 2026-09-27, so it is now only the Enveda baseline. Forked from
# config/masster/massspecgym/msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda.yml
# (QTOF, unmerged, dual CE, cosine LR with warmup, no EMA). Model and loss keys are unchanged
# except the deltas below. Until 2026-09-28 this file was
# enveda_180_inchikey_811_unmerged_mh_mmh_dual_ce_fourier_ema999.yml (NCE + ACE, EMA 0.999);
# it was never submitted.
# Dataset: docs/findings/enveda_180_dataset_2026_09_25.md.
#
# Data (split enveda_180_inchikey_811, 8:1:1 by InChIKey first block):
#   Bruker timsTOF Pro 2, CID, ACE 20/40/60 eV only (no NCE); 38% stepped 20,40,60.
#   Split holds six adducts; this run keeps [M+H]+ and [M-H]- (97%) through filter_prec_types:
#   train 620,120 / val 77,320 spectra ([M+H]+ 472,208 + [M-H]- 147,912 in train).
#   The split and filtered export are described in the finding, sections 3, 4 and 7.
#
# Deltas from the MSGYM arm:
# 1. Data paths and prec_types [M+H]+, [M-H]-, with split_filters.filter_prec_types on every
#    split: the split also holds [M+Na]+, [M+NH4]+, [M+Cl]- and [M+K]+, and an adduct missing
#    from prec_types raises KeyError in base_dataset. masster_include_cmf stays false: both kept
#    adducts' CMF ions duplicate a CRF hydrogen shift, so the channel is masked anyway.
# 2. ce_insert_type embed with int_embedder fourier (MSGYM arm: embed on the template's
#    abs-sines), 2026-09-27, as in config/masster/spectraverse/cv*.yml. fourier gives every
#    integer 0-300 its own row; abs-sines gives x and 2**k - x the same code. Not qet (this
#    config's 2026-09-26 setting): on NIST20 [M+H]+/FT, n1 (qet), n2 and n3 trail c0 by
#    0.012 / 0.010 / 0.009, and n4 (c0 + fourier) runs ahead of c0
#    (docs/findings/masster/masster_qet_projection_candidate_union_2026_09_26.md).
#    int_embedder is global, so any other integer table MASSter reads uses fourier too, as in
#    n4 and the Spectraverse folds.
# 2a. ACE only (spec_params.nce false; MSGYM arm: NCE + ACE), 2026-09-28, user decision. The
#    instrument records only ACE 20/40/60 eV. The dataset's NCE is derived from it
#    (nce = ace * 500 / prec_mz), so it adds no measurement. ace_max 300 clamps nothing.
#    Stepped 20,40,60 spectra mean-pool the three ACE embeddings.
# 3. QTOF loss tolerance 10 ppm with a 200 m/z floor (was 20 ppm, 15 mDa floor below m/z 750).
#    The 15 mDa floor exists for NIST23 floor-truncated m/z, which Enveda does not have. Enveda's
#    per-spectrum mean fragment error is 3.8 ppm median, 6.7 p90, 10.1 p99 (mostly a
#    per-spectrum offset), so 5 ppm would drop real matches. At 10 ppm a 13C satellite and a
#    +1 H channel (4.47 mDa apart) stay separate below m/z 447 instead of sharing every window.
# 4. filter_subformula_peaks and filter_above_precursor_peaks pinned False (template defaults),
#    so the target keeps its isotope peaks: 6.5% of val intensity, ~0.008 cosine of positive-mode
#    target that a monoisotopic model cannot reach (isotope plan, Stage 0a).
# 5. min_epochs/max_epochs 20/20. 1,212 steps/epoch at batch 512, so 24,240 steps, matching the
#    MSGYM arm's 24,832. MSGYM ran 0.51 s/step on an H100 (1imawkx1, 98.9 s/epoch), so about
#    10-11 min/epoch here plus validation: roughly 4 h, unmeasured. lr_total_steps 24,240.
# 6. inst_types keep ORB/ORB_F next to QTOF and frag_modes keep HCD next to CID, as in the MSGYM
#    arm, so the checkpoint can later score mixed data; the ORB/ORB_F/HCD rows stay untrained.
# 7. upload_checkpoints true (MSGYM arm: false), so the baseline checkpoint is kept on W&B.
#
# READ: val_cos_sim_0.01 tail mean (epochs 16-19) and best, per polarity. No seed replicate
# exists yet, so the Enveda seed spread is unknown; a second seed is needed before any arm is
# read against this run.
wandb_name: enveda_180_inchikey_811_unmerged_mh_mmh_ace_fourier
wandb_group: enveda_masster
wandb_tags:
- cuda_candidates
- loss_batch_64
- masster
- enveda_180
- enveda_180_inchikey_811
- standalone
- unmerged
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- ce_fourier
- ace_only
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- no_cmf
- prenorm
- lr_decay
- cosine_schedule
- warmup
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- microbatch_512
- effective_batch_512
seed: 397623
spec_fp: data/proc/enveda_180/spec_df.pkl
mol_fp: data/proc/enveda_180/mol_df.pkl
split_dp: data/split/enveda_180_inchikey_811
spec_params:
  merge: false
  merge_keep_ces: false
  nce: false  # header 2a: ACE only
  ace: true
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  inst_type: true
  inst_types:
  - ORB
  - ORB_F
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  filter_subformula_peaks: false
  filter_above_precursor_peaks: false
  split_filters:
    train:
      filter_prec_types: true
    val:
      filter_prec_types: true
    test:
      filter_prec_types: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
int_embedder: fourier  # header 2
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 1.0e-05
    min_mz: 200.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: true
lr_schedule_type: cosine
lr_total_steps: 24240
lr_min_ratio: 0.01
lr_warmup_steps: 1000
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 50
max_epochs: 50
debug_overfit: false
compile: false
pl_enable_progress_bar: true
upload_checkpoints: false
checkpoint_dp: /mnt/data/masster_checkpoints
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
- cos_hun
- jss
- jss_hun
eval_mz_bin_res:
- 0.01
compute_train_auxiliary_metrics: true

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
masster_candidate_backend: cuda

masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
masster_intensity_norm_placement: pre
