# Small GPU debug training run of RTandCCSHead plus MS/MS.
# Samples 256 rows per existing split before filters; test evaluation stays off.
# CPU candidate construction, GPU neural network; fixed LR for 10 epochs.
# Protocol: docs/plans/masster/masster_rt_ccs_plan.md.
wandb_name: enveda_180_rt_ccs_debug
wandb_group: enveda_masster
wandb_tags:
- masster
- rt_ccs
- debug
- enveda_180
seed: 397623
spec_fp: data/proc/enveda_180/spec_df.pkl
mol_fp: data/proc/enveda_180/mol_df.pkl
split_dp: data/split/enveda_180_inchikey_811
spec_params:
  rt: true
  ccs: true
  rt_labels_fp: data/df/enveda_180_df.csv
  ccs_labels_fp: data/df/enveda_180_df.csv
  merge: false
  merge_keep_ces: false
  nce: false
  ace: true
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  inst_type: true
  inst_types:
  - ORB
  - ORB_F
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  filter_subformula_peaks: false
  filter_above_precursor_peaks: false
  split_filters:
    train:
      filter_prec_types: true
    val:
      filter_prec_types: true
    test:
      filter_prec_types: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 64
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
int_embedder: fourier
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 32
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 128
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 32
masster_metadata_embedding_dim: 16
masster_head_hidden_dim: 128
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 64
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 128
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 1.0e-05
    min_mz: 200.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 16
eval_batch_size: 16
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: false
accelerator: gpu
devices: 1
num_workers: 0
precision: 32
use_tensor_float32: false
min_epochs: 10
max_epochs: 10
debug_overfit: false
compile: false
pl_enable_progress_bar: false
upload_checkpoints: false
checkpoint_metric: val_loss_epoch/mean
checkpoint_metric_mode: min
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01
compute_train_auxiliary_metrics: false
masster_candidate_backend: cpu
masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
masster_intensity_norm_placement: pre
masster_predict_rt: true
masster_predict_ccs: true
masster_rt_loss_weight: 0.1
masster_ccs_loss_weight: 0.1
masster_rt_scale: 60.0
masster_ccs_scale: 100.0
subsample_params:
  subsample_size: 256
  subsample_seed: 42
  train: true
  val: true
  test: true
  secondary: true
masster_mask_selection_threads: 2
delete_checkpoints: false
checkpoint_save_top_k: -1
pandarallel_enable_progress_bar: false
log_every_n_steps: 1
logging:
- console
eval_test_split: false
track_datapoint_metrics: false
log_adduct_inst_ce_metrics: false
