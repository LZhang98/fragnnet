# RT/CCS multitask arm of the standalone Enveda MS/MS baseline; not submitted.
# Protocol and metrics: docs/plans/masster/masster_rt_ccs_plan.md.
wandb_name: enveda_180_rt_ccs
wandb_group: enveda_masster
wandb_tags:
- cuda_candidates
- loss_batch_64
- masster
- enveda_180
- enveda_180_inchikey_811
- standalone
- unmerged
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- ce_fourier
- ace_only
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- no_cmf
- prenorm
- lr_decay
- cosine_schedule
- warmup
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- microbatch_512
- effective_batch_512
seed: 397623
spec_fp: data/proc/enveda_180/spec_df.pkl
mol_fp: data/proc/enveda_180/mol_df.pkl
split_dp: data/split/enveda_180_inchikey_811
spec_params:
  rt: true
  ccs: true
  rt_labels_fp: data/df/enveda_180_df.csv
  ccs_labels_fp: data/df/enveda_180_df.csv
  merge: false
  merge_keep_ces: false
  nce: false  # header 2a: ACE only
  ace: true
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  inst_type: true
  inst_types:
  - ORB
  - ORB_F
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  filter_subformula_peaks: false
  filter_above_precursor_peaks: false
  split_filters:
    train:
      filter_prec_types: true
    val:
      filter_prec_types: true
    test:
      filter_prec_types: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
int_embedder: fourier  # header 2
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  ORB_F:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 1.0e-05
    min_mz: 200.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: true
lr_schedule_type: cosine
lr_total_steps: 24240
lr_min_ratio: 0.01
lr_warmup_steps: 1000
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 20
max_epochs: 20
debug_overfit: false
compile: false
pl_enable_progress_bar: true
upload_checkpoints: true
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01
compute_train_auxiliary_metrics: false

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
masster_candidate_backend: cuda

masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
masster_intensity_norm_placement: pre

masster_predict_rt: true
masster_predict_ccs: true
masster_rt_loss_weight: 0.1
masster_ccs_loss_weight: 0.1
masster_rt_scale: 60.0
masster_ccs_scale: 100.0
