# Selected full-metadata conditioning baseline; see docs/plans/conditioning_refactor_plan.md.
# Keep global loss tolerance and CE-specific proposals fixed.
wandb_name: nist20_ma_mi_unmerged_mask1024_full_meta_dual_ce
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - masster
  - vulcan_l40s
  - nist20_ma_mi
  - unmerged
  - masks_1024
  - deterministic
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - context_embed
  - ce_embed
  - adduct_embed
  - full_metadata
  - dual_ce
  - charge_logsumexp

seed: 397623

# 1. Preserve the baseline spectra; add instrument and fragmentation-mode context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: False
  merge_keep_ces: False
  nce: True
  ace: True
  prec_type: True
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types: [FT, QTOF, IT]
  frag_mode: True
  frag_modes: [HCD, CID]
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Feed full acquisition context to the existing proposal and intensity heads.
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
masster_selected_mask_limit: 1024
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_share_proposal_across_ev: False
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1

# 3. Keep the objective identical to the merged CE-embedding control.
inst_type_loss_tol: null  # Match the baseline; isolate model metadata conditioning.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 1
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. Preserve the control's effective batch size of 128.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 32
eval_batch_size: 2
accumulate_grad_batches: 4
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01
