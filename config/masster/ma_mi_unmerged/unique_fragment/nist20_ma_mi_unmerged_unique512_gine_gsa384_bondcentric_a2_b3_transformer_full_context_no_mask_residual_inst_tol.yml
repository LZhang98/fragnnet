wandb_name: nist20_ma_mi_unmerged_unique512_gine_gsa384_bondcentric_a2_b3_transformer_full_context_no_mask_residual_inst_tol
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - masster
  - vulcan_l40s
  - nist20_ma_mi
  - unmerged
  - unique_fragments_512
  - max_enumerated_masks_512
  - pathway_marginalization
  - deterministic
  - instrument_tolerance
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - full_context
  - ce_embed
  - adduct_embed
  - inst_type_embed
  - frag_mode_embed
  - no_mask_residual
  - charge_logsumexp

seed: 397623

# 1. Keep individual NIST20 MA/MI spectra and use all acquisition context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: False
  merge_keep_ces: False
  nce: True
  ace: False
  prec_type: True
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Enumerate up to 512 learned latent masks toward a 512-unique-fragment target,
# then marginalize duplicate charged pathways before the transformer. Required
# empty and single-cut masks retain the established outside-budget behavior.
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
masster_unique_fragment_target: 512
masster_unique_fragment_mode: True
masster_ranked_mask_budget: 512
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: False

# 3. Keep the objective identical to the existing unmerged controls.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 32
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# Use acquisition-aware peak matching for the loss and candidate-support metrics.
# Unlisted instrument types retain the global 10 ppm / 0.002 Da-floor fallback.
inst_type_loss_tol:
  FT: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# 4. Use a larger physical batch to improve L40S utilization.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 256
eval_batch_size: 128
accumulate_grad_batches: 1
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
  - wrecall
  - wprecision
eval_mz_bin_res:
  - 0.01
