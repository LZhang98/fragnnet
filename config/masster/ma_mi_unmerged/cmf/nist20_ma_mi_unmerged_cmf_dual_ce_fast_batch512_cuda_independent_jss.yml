# Ports the merged "independent JSS" output bundle onto the fastest unmerged arm
# (nist20_ma_mi_unmerged_cmf_dual_ce_fast_batch512_cuda.yml). Seven substantive keys move
# together, because that is how they were measured on merged -- this is a bundle port, not
# an isolation:
#
#   masster_intensity_output                        probability   -> independent
#   loss_type                                            cross_entropy -> jss_distance
#   masster_peak_matching                           closest       -> hungarian
#   masster_separate_ion_h_support_head             False         -> True
#   masster_ion_h_support_binary_logits             False         -> True
#   masster_ion_h_support_loss_weight               0.0           -> 0.1
#   masster_gate_independent_intensity_with_support False         -> True
#   masster_channel_support_use_intensity_prior     True          -> False
#
# Encoder, head size, candidate budgets, batch, LR, seed, split and epoch budget are
# unchanged, so this costs essentially no parameters -- the whole delta is one small
# support head.
#
# WHY THIS MAY NOT PAY HERE. On the current merged target with the head held fixed
# (384x3/ff1024/ind128/ad4), independent/jss beats probability/CE by only +0.0025 overall
# and is BEHIND early:
#
#     <=ep20   0.7522  vs  0.7577   (probability/CE ahead by 0.0055)
#     <=ep40   0.7792  vs  0.7762
#     <=ep60   0.7912  vs  0.7872
#     best     0.8010  vs  0.7985
#
# Unmerged runs die at epoch 15-25 against the 12h wall, which is exactly the window where
# the probability/CE arm is ahead. So the honest prior is that this arm LOSES on unmerged
# unless the extra epochs bought by cuda + loss_batch_64 carry it past the crossover.
# A null here is a real result: it would say the merged gain is a late-training effect and
# does not transfer to a wall-clock-limited regime.
#
# Comparability: masster_peak_matching changes the LOSS, not the metric.
# val_cos_sim_0.01_epoch/mean is a binned cosine and is unaffected, so this stays directly
# comparable to dny62x0i (0.7018) and to its own _fast_batch512_cuda parent.
#
# Known-null component kept on purpose: masster_gate_independent_intensity_with_support
# has no measured benefit in the merged channel-selection work. It is included so this is a
# faithful port of the 0.8010 arm; stripping it is the obvious follow-up ablation.
#
# loss_batch_size raised 8 -> 64 on 2026-09-18, from the measured ma_mi MERGED speed arms
# (same model, same target, matched one-hour jobs, median seconds per epoch):
#
#     backend  train_batch  lb=8   lb=32  lb=64
#     cuda     256          144    146    152
#     cuda     512          143    120     88
#
# The gain is batch-size dependent, which is what the implementation predicts:
# loss_batch_size is a CEILING on chunk width in build_loss_chunks and the inner guard
# breaks a chunk as soon as padded_pairs > flat_pairs, so a wider ceiling only merges
# chunks where padding still pays -- and there is only something to merge once a step
# carries enough spectra. At 256 it is flat to slightly negative; at 512 it is 1.63x.
# NOT raised on the batch-128/256 arms for that reason.
#
# Chunking is a partition, so it changes float association order only, not the loss.
# The lb=64 merged arm also reached the best cosine of that family (0.7167 at ep56
# against 0.6980 at ep22 for lb=8) purely by covering more epochs in the same hour.
