# Intensity-head capacity arm on the fastest unmerged config
# (nist20_ma_mi_unmerged_cmf_dual_ce_fast_batch512_cuda.yml). Four keys move, all of them
# the induced-attention stack; the atom decoder stays OFF:
#
#   masster_intensity_transformer_dim                 256 -> 384
#   masster_intensity_transformer_num_layers            2 -> 3
#   masster_intensity_transformer_feedforward_dim     512 -> 1024
#   masster_intensity_transformer_num_inducing_points  64 -> 128
#
# This is the merged model's head WITHOUT its 7,891,456-parameter atom decoder. Encoder,
# candidate budgets, output parameterization, loss, batch, LR, seed and split are unchanged,
# so it isolates intensity-head capacity -- the one axis never varied in any of the 31
# unmerged runs, all of which use 256x2/ff512/ind64.
#
# WHY THIS SHAPE. Measured across 211 runs: the encoder is a plateau (identical 1,808,256 in
# both families; depth 2->5 buys +0.003; every heavier encoder loses), and on merged the
# whole "bigger model" is this one module. Of the merged head, the atom decoder is 47.2% and
# its benefit decays from +0.0130 at ep20 to +0.0008 by ep100 while costing ~1.7x per epoch,
# so it is excluded here and tested separately by the merged _ad0 arm.
#
# WHY IT MAY NOT PAY. On merged, small head vs big head crosses over late:
#
#     <=ep20   0.7546 (7.4M) vs 0.7522 (22.7M)   small AHEAD
#     <=ep40   0.7682        vs 0.7792           big ahead by 0.011
#     best     0.7791        vs 0.8010
#
# Unmerged dies at epoch 15-25 against the 12h wall, i.e. at or before the crossover. The
# batch-512 + cuda + loss_batch_64 parent is the fastest unmerged configuration measured, so
# this arm gets the best chance available of reaching the far side of it. Judge it against
# its parent at matched wall clock first, matched epoch second.
#
# MEMORY: this widens the head while the parent already runs train_batch_size 512. If it
# OOMs on an L40S, drop to train_batch_size 256 with accumulate_grad_batches 2, which keeps
# effective batch 512 and the optimization identical.
#
# loss_batch_size raised 8 -> 64 on 2026-09-18, from the measured ma_mi MERGED speed arms
# (same model, same target, matched one-hour jobs, median seconds per epoch):
#
#     backend  train_batch  lb=8   lb=32  lb=64
#     cuda     256          144    146    152
#     cuda     512          143    120     88
#
# The gain is batch-size dependent, which is what the implementation predicts:
# loss_batch_size is a CEILING on chunk width in _build_loss_chunks and the inner guard
# breaks a chunk as soon as padded_pairs > flat_pairs, so a wider ceiling only merges
# chunks where padding still pays -- and there is only something to merge once a step
# carries enough spectra. At 256 it is flat to slightly negative; at 512 it is 1.63x.
# NOT raised on the batch-128/256 arms for that reason.
#
# Chunking is a partition, so it changes float association order only, not the loss.
# The lb=64 merged arm also reached the best cosine of that family (0.7167 at ep56
# against 0.6980 at ep22 for lb=8) purely by covering more epochs in the same hour.
