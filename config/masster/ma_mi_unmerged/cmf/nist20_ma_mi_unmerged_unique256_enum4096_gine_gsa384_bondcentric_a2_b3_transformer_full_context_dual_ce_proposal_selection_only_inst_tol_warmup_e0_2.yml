# Proposal warmup arm of the unmerged CMF anchor. The ONLY difference from
# nist20_ma_mi_unmerged_unique256_enum4096_gine_gsa384_bondcentric_a2_b3_transformer_full_context_dual_ce_proposal_selection_only_inst_tol.yml
# is masster_proposal_only_until_epoch: 2; that anchor, with the key left
# null, is this ladder's no-warmup control. Boundaries mirror the merged
# config/masster/merged/warmup_duration ladder (2, 4, 9) and the e0_15 of the merged
# loss/transform screen, so the two scopes stay comparable.
# Corrected unmerged CMF anchor. Identical to the lead unmerged arm
# (../unique_fragment/nist20_ma_mi_unmerged_unique256_enum4096_gine_gsa384_bondcentric_a2_b3_transformer_full_context_proposal_selection_only_inst_tol.yml,
# W&B run ef7fl5c6, val cos_sim_0.01 0.7515) except for three deltas:
#   1. ace: True, so NCE and ACE are both context inputs (the selected full-metadata
#      conditioning baseline; see docs/plans/conditioning_refactor_plan.md).
#   2. inst_types drops IT. Measured on data/split/nist20_ma_mi_inchikey: 480,002 spectra,
#      FT and QTOF only, zero IT rows. The IT slot only widened the embedding table.
#   3. masster_channel_diagnostics: True, so the valid/attributed/retained ion-H
#      channel counts are logged. These are the metrics that show the CMF alignment.
# This is step 1 of docs/plans/masster/masster_improvement_plan.md ("establish a corrected
# unmerged control") and the convergence prerequisite that blocks Arm C in
# docs/plans/masster/masster_ion_h_channel_selection_plan.md.
wandb_name: nist20_ma_mi_unmerged_unique256_enum4096_gine_gsa384_bondcentric_a2_b3_transformer_full_context_dual_ce_proposal_selection_only_inst_tol_warmup_e0_2
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - masster
  - vulcan_l40s
  - nist20_ma_mi
  - unmerged
  - unique_fragments_256
  - max_enumerated_masks_4096
  - pathway_marginalization
  - deterministic
  - instrument_tolerance
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - full_context
  - full_metadata
  - ce_embed
  - dual_ce
  - adduct_embed
  - inst_type_embed
  - frag_mode_embed
  - m+h
  - m-h
  - m+na
  - m+cl
  - cmf
  - channel_diagnostics
  - proposal_selection_only
  - proposal_warmup_epochs_0_2
  - proposal_loss_0.1
  - candidate_conditional
  - charge_logsumexp

seed: 397623

# 1. Keep individual NIST20 MA/MI spectra and use all acquisition context:
# both collision-energy units, adduct, instrument, and fragmentation mode.
# The four-adduct scope is what makes the CMF fix observable. On this split
# [M+Na]+ (38,156 spectra) and [M+Cl]- (7,820) have a chemically distinct
# charge-migration ion, so they now enumerate the full +/-4 H CMF ladder;
# [M+H]+ and [M-H]- keep CMF suppressed because their base CMF state
# duplicates a reachable CRF shift (-1 and +1 respectively).
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: False
  merge_keep_ces: False
  nce: True
  ace: True
  prec_type: True
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "ORB"
    - "ORB_F"
    - "QTOF"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
    - a_charge
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Search up to 4096 masks for 256 unique fragments. Proposal probabilities
# select support; the candidate transformer owns the conditional intensity shape.
# The enumeration budget is held at the lead arm's 4096 so this run stays
# comparable with ef7fl5c6.
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
# The context encoder clamps each CE reading to its max before integer featurization, so
# ace_max is a real ceiling once ace is on. Measured over the 383,874 train+val spectra of
# this split: ACE p50 27, p90 73, max 329 eV, and 13,406 spectra (3.49%, all FT) exceed the
# template's ace_max: 100 and would collapse into one saturated embedding row. 300 leaves 4.
# Matches config/masster/merged/context_ablation. NCE is left at the template's 200,
# which only 0.02% of readings exceed.
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: True
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: True
masster_max_h_transfer: 4
masster_include_cmf: True
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: True
masster_proposal_anchored: True
masster_log_base_ce: True
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: True
masster_proposal_selection_only: True
masster_proposal_loss_weight: 0.1
# Inclusive boundary: epochs 0..N are proposal-only, so this is N+1 warmup epochs.
# Proposal gradients continue into the shared molecular and context encoders afterwards.
masster_proposal_only_until_epoch: 2

# Log dense valid/attributed/retained ion-H channel counts without adding a support
# loss. These are the diagnostics that report the added CMF-H channels.
masster_channel_diagnostics: False

# 3. Train final spectral intensity and H-independent proposal support separately.
loss_type: cross_entropy
predict_oos: False
oos_loss: False
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 8
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# Match FT/QTOF peaks at acquisition-aware tolerances. The split holds no other
# instrument, so every spectrum is covered by this table.
inst_type_loss_tol:
  ORB: {rel: 1.0e-5, min_mz: 200.0}
  ORB_F: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# 4. Match the existing unmerged unique-fragment optimization setup.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 128
eval_batch_size: 64
accumulate_grad_batches: 2
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_hun_inst_tol_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - cos_hun_inst_tol
  - recall
  - precision
  - wrecall
  - wprecision
eval_mz_bin_res:
  - 0.01
