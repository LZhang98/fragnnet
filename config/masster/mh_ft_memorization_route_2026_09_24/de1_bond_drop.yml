# ARM de1_bond_drop -- unmerged [M+H]+/FT, bond dropout in the encoder, 2026-09-27.
# masster_encoder_bond_dropout 0.1: in training, each chemical bond leaves the shared GINE_GSA
# encoder's local message passing with probability 0.1, both directions together and in both
# layers, drawn once per forward pass (per spectrum's graph copy). Kept neighbour messages are
# scaled by 1/(1 - 0.1), so each atom's summed message keeps its expectation and the BatchNorm
# statistics learned on dropped graphs still fit full graphs at eval. Global attention, the
# candidate set, the cut-bond features and the boundary encoder see every bond. No parameters; at
# eval the arm is c0's architecture exactly. The element-wise encoder dropout (0.1) is unchanged.
# c0's local encoder has 2 layers, so a dropped bond removes part of each nearby atom's 2-hop view.
# DropEdge was under "Not changing" in the plan, because the route map put the key in global
# attention rather than topology. The audit found the route map does not predict which arms pay
# (r2 null; k1 predicted weak, then replicated), so that reason no longer holds.
#
# WHY. The 2026-09-27 audit
# (docs/findings/masster/masster_memorization_attempts_audit_2026_09_27.md) found that removing an
# identity route never helped, while noise on a route that other routes back up did: k1
# (replicated) and gm1 (one seed). Every earlier atom dropout acted after the encoder, on the
# fragment pools (e2/e3, null), or everywhere at once (drop03, -0.0149). This arm perturbs the
# molecule the encoder sees on each exposure and leaves every route in place.
#
# PROPOSAL. c0 has no separate proposal encoder, so the proposal reads the perturbed atom
# embeddings in training and clean ones at eval. Read val_candidate_wrecall first.
#
# CONTROL: c0_control.yml in this directory (vcpho5qm; val cos_sim_0.01 tail mean 0.7276 over
# epochs 54-63). This arm runs on newer code than c0: the encoder-noise keys are off in c0 and draw
# nothing at their defaults (tests/test_gine_gsa.py), and no other training-path code changed.
# Seed 397623, 64 epochs, raw target, no EMA, so the read is matched to k1's and gm1's.
# TRAIN METRICS stay OFF (control match, 3g fit); the train side is read offline.
# READ (plan § Objective and acceptance): (1) tail mean of val_cos_sim_0.01_epoch/mean over epochs
# 54-63 against c0, at least +0.003; by the audit's reading rule a single seed needs about +0.006,
# else a second seed; (2) offline ranking decomposition of the best checkpoint's val export and a
# 25.6k train sample: the val ranking gap must fall; (3) the Step 0 route map re-run on this
# checkpoint: no route's train/val asymmetry at matched validation damage may grow; (4) val cosine
# by nearest-train Tanimoto bin, gain largest at <= 0.6; (5) val_candidate_wrecall within 0.005 of
# c0. An arm that only lowers train fit is underfitting, not a pass.
# upload_checkpoints is true, so the checkpoints land on W&B for the offline reads.
# Plan: docs/plans/masster/masster_memorization_route_plan.md
#
# Control header follows.
# CONTROL f0 -- [M+H]+/FT, no target cleaning
#
# [M+H]+ / FT only, on the CURRENT architecture (the c4a_base_s1 lineage: cuda candidate
# backend, 2026-09-20 feature bundle, seed 397623), run UNMERGED at a 64-epoch screen. Derived from
# config/masster/ma_mi_merged/nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml
# by narrowing the scope and setting the cleanup switches. Nothing else is touched.
#
# SPLIT: data/split/nist20_inchikey ALREADY EXISTS and is already the [M+H]+/FT split --
# 157,678 train / 52,020 val / 52,621 test spectra, 60.1/19.8/20.1 by 2D InChIKey. No new
# split is needed and no new DAG: spec_fp, mol_fp and frag_dp are byte-identical to the ma_mi
# lineage; only split_dp differs.
#
# inst_type_loss_tol deliberately keeps its FT *and* QTOF rows. It is a lookup table, not a
# scope list, and a trimmed or unset table is what made cos_hun_inst_tol export -1.0.
#
# HORIZON, re-derived for unmerged. The 128-epoch screen was calibrated on MERGED runs. An
# unmerged epoch sees ~18x the rows, and the two reference unmerged runs on this architecture
# (6ks7v8ce, h0gvuf4f, same batch 512 / loss_batch 64) both plateau far earlier: at epoch 64
# they sit 0.0043 and 0.0011 below their own best, and h0gvuf4f then DECLINES to -0.0043 by
# epoch 99. So 64 epochs is the screen here, not 128.
# COST: those runs measured 8.9 and 7.0 epochs/hour on ma_mi unmerged against 70.0 ep/h merged.
# This split is 1.825x smaller (157,678 vs 287,721 spectra), giving ~12.8-16.2 ep/h, so 64
# epochs is ~4.0-5.0 h. The job asks 6 h and passes j=<job_name>, so a requeue resumes.
#
# THIS PAIR IS NOT A LIKE-FOR-LIKE COSINE COMPARISON BY ITSELF. clean_spectra runs at dataset
# load (base_dataset.py:430), so f1 is scored against its own cleaned target while f0 is scored
# against the raw one. Removing peaks the model was failing on raises cosine by construction --
# the same mechanism that appears as a uniform +0.026 val_candidate_wrecall in filtered vs
# unfiltered pairs. To claim f1 is a real improvement, evaluate the f1 CHECKPOINT against f0's
# UNFILTERED target. That cross-eval is the acceptance criterion, not this pair's delta.
#
# CONTROL: filters off. Prices the scope change separately from the cleaning.
