# ARM md05_mol_dropout05_ob_obf -- unmerged [M+H]+, i4 with GNN encoder dropout 0.5, 2026-10-18.
# i4_k1_ema_prenorm_ob_obf.yml plus mol_dropout 0.1 -> 0.5 (one key; parameter names and count
# unchanged). mol_dropout is the dropout inside the precursor GNN (masster_pl.py precursor_dropout).
#
# QUESTION. Does heavy encoder dropout narrow the NIST20 val gap? In the MSGYM 48-trial random
# search (W&B sweep tiwhun9q), mean best val loss improved monotonically with mol_dropout over the
# sampled grid 0.0 / 0.1 / 0.2 / 0.3 (-1.4526 / -1.5504 / -1.5868 / -1.6089), and 11 of the top
# 12 trials used 0.2 or 0.3. The best value is at the grid edge; no MASSter run on W&B has ever
# used mol_dropout above 0.3 (152 runs checked 2026-10-18), so 0.5 is an extrapolation (user
# decision, 2026-10-18). On NIST20 the only higher-dropout arm, drop03 (mol, head and transformer
# dropout all 0.3, merged MA/MI, one-hour box), read -0.0149 at 10% of its schedule; it changed
# three keys and was read early, so it does not decide this arm.
# Sweep read: docs/plans/masster/msgym_val_loss_sweep_48_2026_10_03.md#what-the-random-search-suggests
#
# CONTROL: i4_k1_ema_prenorm_ob_obf (rd9rsdqx, tail 0.7729 over epochs 54-63). This config differs
# from it by mol_dropout and W&B naming only; init RNG is unchanged (dropout has no parameters).
# READ: tail mean of val_cos_sim_0.01_epoch/mean over epochs 54-63 against i4, at least +0.005 to
# count on one seed (seed spread 0.0042); val_candidate_wrecall within 0.005 of i4. Heavier
# regularization tends to trail early, so also compare the epoch-63 slope against i4's before
# rejecting a negative tail.
#
# Base config follows: i4_k1_ema_prenorm_ob_obf.yml.
# ARM i4_k1_ema_prenorm_ob_obf -- unmerged [M+H]+, i3 with a pre-norm candidate transformer,
# 2026-09-28. i3_k1_ema_ob_obf.yml plus masster_intensity_norm_placement: pre (one key; parameter
# names and count unchanged).
#
# QUESTION. Does pre-norm, the one architecture key that passed the merged 128-epoch screen, carry
# to the unmerged lineage? a1_prenorm (q4t4udee) was +0.0056 over its merged control and was
# still rising at epoch 127; it has never run unmerged. Pre-norm is the placement that tolerates a
# constant LR with no warmup, which every arm here uses.
# Finding: 95341fce:docs/findings/masster/masster_architecture_arms_epoch128_2026_09_22.md, removed 2026-10-18
#
# CONTROL: i3_k1_ema_ob_obf, submitted alongside. This config differs from it by
# masster_intensity_norm_placement and W&B naming only.
# READ: tail mean of val_cos_sim_0.01_epoch/mean over epochs 54-63 against i3, at least +0.005 to
# count on one seed; val_candidate_wrecall within 0.005 of i3.
#
# Base config follows: i3_k1_ema_ob_obf.yml.
# ARM i3_k1_ema_ob_obf -- unmerged [M+H]+, i1 plus k1's key dropout and weight EMA, 2026-09-28.
# i1_inst_ob_obf.yml plus the three k1_ema keys: masster_boundary_encoder_dropout 0.2,
# masster_intensity_input_dropout 0.2, ema_decay 0.999. Same relabelled data (see i1's DATA
# IDENTITY), seed 397623, 64 epochs, constant lr 1e-3.
#
# QUESTION. Do the two levers that replicated on the FT labels add on top of the instrument input?
# On FT labels, against c0 (vcpho5qm, tail 0.7276 over epochs 54-63): EMA +0.0116 (u2, c8hh9j1b;
# +0.0072 at seed 811237), k1 +0.0074 (wg0nxymi; +0.0048 at seed 811237), k1_ema +0.0145
# (j4u25qfd). The cosine LR schedule does not add to k1_ema (s1_k1_ema f2oacs52 -0.0011), so it
# is left out. i1 leads n4 by +0.021 mid-run, part of which may be the same generalization gap
# these levers act on, so the stack may add less than on FT labels.
# Finding: docs/findings/nist_orbitrap_instrument_ce_scales_2026_09_28.md (section 8)
# Plan: docs/plans/masster/masster_memorization_route_plan.md
#
# CONTROL: i1_inst_ob_obf (i50ig7rf). This config differs from it by the three keys at the end and
# W&B naming only.
# READ: tail mean of val_cos_sim_0.01_epoch/mean over epochs 54-63 against i1, at least +0.005 (the
# 0.0042 seed spread) to count on one seed; val_candidate_wrecall within 0.005 of i1. With EMA on,
# validation scores the averaged weights, as for u2 and k1_ema.
#
# Base config follows: i1_inst_ob_obf.yml.
# ARM i1_inst_ob_obf -- unmerged [M+H]+, n4 on the ORB / ORB_F instrument labels, 2026-09-28.
# n4_nce_fourier.yml unchanged except W&B naming. The difference is the data: data/proc/nist20/
# spec_df.pkl relabelled FT -> ORB / ORB_F from the raw NIST20 MSP Instrument field (Elite and
# Velos -> ORB, Orbitrap Fusion Lumos -> ORB_F). inst_types [ORB, ORB_F] and inst_type: true were
# already in n4, but every row was FT, so n4's instrument embedding had one class and carried
# nothing. Here it has two (ORB = 0, ORB_F = 1).
#
# QUESTION. Does an instrument input remove c0's Lumos under-fragmentation? c0 val, [M+H]+, raw
# labels: Elite cosine 0.7450 / precursor-fraction bias -0.0008 (36,864 spectra); Lumos 0.6880 /
# +0.0923 (13,710). The gap is +0.053 after matching NCE bin, novelty and m/z, and train shows no
# bias, so for a new molecule the energy response follows the Elite majority. Relabelling the NCE
# at inference failed (-0.006 and -0.039), so the instrument must be an input at training time.
# Finding: docs/findings/nist_orbitrap_instrument_ce_scales_2026_09_28.md
#
# DATA IDENTITY: spec_df.pkl is the only NIST20 spec_df; no FT copy is kept. It is the local
# file after the 2026-09-28 relabel (preproc_scripts/README.md, "Relabelling existing Orbitrap
# spectra"), uploaded over each cluster copy, md5 bdc009bbeaf6a38d126326d127630cad; renamed to
# ORB / ORB_F on 2026-10-01, md5 ce029870badc9e9e05935a4424f44c8d: ORB 778,672
# (712,969 by instrument field + 65,703 unnamed MoNA), ORB_F 251,326, 212,366 groups. It pairs
# with mol_df.pkl md5 be4b5794040e68f661e6ff165dacb3b0 and data/split/nist20_inchikey
# (train_ids.csv d8a07ccfcb7e4d80128b441bef7daca9, val_ids.csv 7c870661872e1a2c0ef80a25d2ff44da).
# group_id is not read here (merge, group_sampler off); splits select by spec_id.
#
# CONTROL: n4_nce_fourier (shjgv9im), same config on FT labels; c0_control (vcpho5qm).
# READ: (1) Lumos val cosine and precursor-fraction bias on the best checkpoint against n4 and
# c0, by raw instrument (output/ev_ladder_census_2026_09_28/nist20_raw_labels.py re-reads c0).
# Pass if the Lumos bias falls well below +0.09 without an Elite loss. (2) Tail mean of
# val_cos_sim_0.01_epoch/mean over epochs 54-63 against n4; Lumos is 26% of val, so closing half
# the gap is about +0.007, 1.7x the 0.0042 seed spread.
#
# Base config follows: n4_nce_fourier.yml.
# ARM n4_nce_fourier -- unmerged [M+H]+/FT, the per-NCE code without aliasing, 2026-09-26.
# c0_control.yml with int_embedder fourier instead of the template's abs-sines. Seed 397623, 64
# epochs, constant lr 1e-3. ce_insert_type stays embed, so each integer NCE keeps its own code.
# In MASSter, int_embedder reaches only the CE table (MassterContextEncoder). The table feeds the
# existing Linear(num_dim, ce_insert_size), whose input width goes from 8 to 20.
#
# QUESTION. Can the abs-sines table be replaced by one that does not alias, at no cost?
# abs-sines is |sin(pi x / 2^j)|, unchanged under x -> 256 - x at nce_max 200. fourier is sin and
# cos at the same powers of 1/2, down to period 512. No two integers in 0-300 share a row, and the
# nearest two occurring NCE rows are 1.41 apart; under abs-sines, 76 and 180 are 5.5e-6 apart.
# On this split the one occurring collision is 76/180 (2.1% of val spectra). No molecule has both,
# and feeding 76 to the NCE-180 val spectra cost nothing measurable on u2. So no gain is expected
# here: n4 prices the table swap before it becomes the default per-NCE code for other datasets.
# Why keep a per-NCE code at all: mid-run, n1 (qet), n2 (qet_mlp) and n3 (id) all trail c0 while
# fitting train as well, so the code carries something that transfers.
# fourier does not fix unseen energies: its high-frequency columns are still arbitrary there.
# Finding: docs/findings/masster/masster_qet_projection_candidate_union_2026_09_26.md
#
# CONTROL: c0_control (vcpho5qm, tail 0.7276 over epochs 54-63). This config differs from c0 by
# int_embedder and W&B naming only.
# READ: (1) tail mean of val_cos_sim_0.01_epoch/mean over epochs 54-63 against c0. Inside the
# 0.0042 seed spread is a pass, since no gain is expected; a drop beyond it rules the table out.
# (2) On the best checkpoint, val cosine at NCE 76 and at 180 against c0's: the only spectra the
# change can reach on this split. Inputs 76 and 180 must now give different predictions.
# upload_checkpoints is true, so the checkpoints land on W&B for the offline reads.
#
# Base config follows: c0_control.yml.
# CONTROL c0 -- same-code control for the memorization-route Step 1 arms, 2026-09-24.
# f0_mh_ft_control.yml plus wandb naming only: no model or data key changes. Submitted with the
# arms, because the code has moved since the f0 run 3bej6fq7 (CutBondEncoder deduplication, equal
# up to float rounding, and the Step 1 options, all off here and bit-identical at their defaults).
# Plan: docs/plans/masster/masster_memorization_route_plan.md
#
# Control header follows.
# CONTROL f0 -- [M+H]+/FT, no target cleaning
#
# [M+H]+ / FT only, on the CURRENT architecture (the c4a_base_s1 lineage: cuda candidate
# backend, 2026-09-20 feature bundle, seed 397623), run UNMERGED at a 64-epoch screen. Derived from
# config/masster/ma_mi_merged/nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml
# by narrowing the scope and setting the cleanup switches. Nothing else is touched.
#
# SPLIT: data/split/nist20_inchikey ALREADY EXISTS and is already the [M+H]+/FT split --
# 157,678 train / 52,020 val / 52,621 test spectra, 60.1/19.8/20.1 by 2D InChIKey. No new
# split is needed and no new DAG: spec_fp, mol_fp and frag_dp are byte-identical to the ma_mi
# lineage; only split_dp differs.
#
# inst_type_loss_tol deliberately keeps its FT *and* QTOF rows. It is a lookup table, not a
# scope list, and a trimmed or unset table is what made cos_hun_inst_tol export -1.0.
#
# HORIZON, re-derived for unmerged. The 128-epoch screen was calibrated on MERGED runs. An
# unmerged epoch sees ~18x the rows, and the two reference unmerged runs on this architecture
# (6ks7v8ce, h0gvuf4f, same batch 512 / loss_batch 64) both plateau far earlier: at epoch 64
# they sit 0.0043 and 0.0011 below their own best, and h0gvuf4f then DECLINES to -0.0043 by
# epoch 99. So 64 epochs is the screen here, not 128.
# COST: those runs measured 8.9 and 7.0 epochs/hour on ma_mi unmerged against 70.0 ep/h merged.
# This split is 1.825x smaller (157,678 vs 287,721 spectra), giving ~12.8-16.2 ep/h, so 64
# epochs is ~4.0-5.0 h. The job asks 6 h and passes j=<job_name>, so a requeue resumes.
#
# THIS PAIR IS NOT A LIKE-FOR-LIKE COSINE COMPARISON BY ITSELF. clean_spectra runs at dataset
# load (base_dataset.py:430), so f1 is scored against its own cleaned target while f0 is scored
# against the raw one. Removing peaks the model was failing on raises cosine by construction --
# the same mechanism that appears as a uniform +0.026 val_candidate_wrecall in filtered vs
# unfiltered pairs. To claim f1 is a real improvement, evaluate the f1 CHECKPOINT against f0's
# UNFILTERED target. That cross-eval is the acceptance criterion, not this pair's delta.
#
# CONTROL: filters off. Prices the scope change separately from the cleaning.
wandb_name: md05_mol_dropout05_ob_obf
wandb_group: nist20_mh_ft_memorization_route_2026_09_24
wandb_tags:
- no_filters
- md05_mol_dropout05_ob_obf
- mol_dropout_0.5
- intensity_prenorm
