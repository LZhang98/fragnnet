# ARM s1_lr_cosine -- unmerged [M+H]+/FT, the d3 learning-rate schedule on c0, 2026-09-25.
# c0_control.yml with lr_schedule on: a 1000-step linear warmup (3.2 epochs), then cosine from
# 1e-3 to 1e-5 at the end of epoch 63. Seed 397623, 64 epochs.
#
# QUESTION (plan decision C). Every MASSter run so far, c0 and every Step 1 and batch 2 arm
# included, trains at a constant lr 1e-3 with no warmup. A large initial rate followed by decay
# keeps a network from memorizing an easy-to-fit patch first (Li, Wei & Ma 2019; You et al.
# 2019), and a per-molecule key is such a patch. d3 gained +0.0072 on the merged lineage at 128
# epochs (n=1). The warmup is d3's 1000 steps, not its 11-of-128-epoch share: it is there for the
# post-LN stack, whose instability is counted in steps.
#
# CONTROL: c0_control (vcpho5qm; val cos_sim_0.01 tail 0.7276 over epochs 54-63). This config
# differs from it by the four schedule keys and W&B naming only.
# READ (plan § Objective and acceptance): (1) tail mean of val_cos_sim_0.01_epoch/mean over epochs
# 54-63 against c0, at least +0.003; val_candidate_wrecall within 0.005. The tail is where the
# rate has fallen to 7.5-1.0% of peak, so it compares settled weights with c0's constant-rate ones.
# (2) Against u2_ema999 (c8hh9j1b, 0.7392) as well: weight EMA and decay both remove late weight
# noise, so a gain near u2's may be the same gain. (3) The eval-mode train/val gap on the best
# checkpoint (plan § Eval-mode train/val gap): only a narrower gap makes it a memorization lever;
# lifting train and val together is an optimization gain, as EMA's was.
# (4) The schedule halves the weight decay too: AdamW shrinks weights by (1 - lr*wd) at the current
# rate, so this arm's total decay is half of c0's. At wd 0.01 the decay timescale (100,000 steps,
# ~325 epochs) is five times this run in both, so the second change is small.
# upload_checkpoints is true, so the checkpoints land on W&B for the offline reads.
# Plan: docs/plans/masster/masster_memorization_route_plan.md
#
# Base config follows: c0_control.yml.
# CONTROL c0 -- same-code control for the memorization-route Step 1 arms, 2026-09-24.
# f0_mh_ft_control.yml plus wandb naming only: no model or data key changes. Submitted with the
# arms, because the code has moved since the f0 run 3bej6fq7 (CutBondEncoder deduplication, equal
# up to float rounding, and the Step 1 options, all off here and bit-identical at their defaults).
# Plan: docs/plans/masster/masster_memorization_route_plan.md
#
# Control header follows.
# CONTROL f0 -- [M+H]+/FT, no target cleaning
#
# [M+H]+ / FT only, on the CURRENT architecture (the c4a_base_s1 lineage: cuda candidate
# backend, 2026-09-20 feature bundle, seed 397623), run UNMERGED at a 64-epoch screen. Derived from
# config/masster/ma_mi_merged/nist20_ma_mi_merged_fast_batch512_cuda_lb64_c4a_base_s1.yml
# by narrowing the scope and setting the cleanup switches. Nothing else is touched.
#
# SPLIT: data/split/nist20_inchikey ALREADY EXISTS and is already the [M+H]+/FT split --
# 157,678 train / 52,020 val / 52,621 test spectra, 60.1/19.8/20.1 by 2D InChIKey. No new
# split is needed and no new DAG: spec_fp, mol_fp and frag_dp are byte-identical to the ma_mi
# lineage; only split_dp differs.
#
# inst_type_loss_tol deliberately keeps its FT *and* QTOF rows. It is a lookup table, not a
# scope list, and a trimmed or unset table is what made cos_hun_inst_tol export -1.0.
#
# HORIZON, re-derived for unmerged. The 128-epoch screen was calibrated on MERGED runs. An
# unmerged epoch sees ~18x the rows, and the two reference unmerged runs on this architecture
# (6ks7v8ce, h0gvuf4f, same batch 512 / loss_batch 64) both plateau far earlier: at epoch 64
# they sit 0.0043 and 0.0011 below their own best, and h0gvuf4f then DECLINES to -0.0043 by
# epoch 99. So 64 epochs is the screen here, not 128.
# COST: those runs measured 8.9 and 7.0 epochs/hour on ma_mi unmerged against 70.0 ep/h merged.
# This split is 1.825x smaller (157,678 vs 287,721 spectra), giving ~12.8-16.2 ep/h, so 64
# epochs is ~4.0-5.0 h. The job asks 6 h and passes j=<job_name>, so a requeue resumes.
#
# THIS PAIR IS NOT A LIKE-FOR-LIKE COSINE COMPARISON BY ITSELF. clean_spectra runs at dataset
# load (base_dataset.py:430), so f1 is scored against its own cleaned target while f0 is scored
# against the raw one. Removing peaks the model was failing on raises cosine by construction --
# the same mechanism that appears as a uniform +0.026 val_candidate_wrecall in filtered vs
# unfiltered pairs. To claim f1 is a real improvement, evaluate the f1 CHECKPOINT against f0's
# UNFILTERED target. That cross-eval is the acceptance criterion, not this pair's delta.
#
# CONTROL: filters off. Prices the scope change separately from the cleaning.
wandb_name: s1_lr_cosine
wandb_group: nist20_mh_ft_memorization_route_2026_09_24
wandb_tags:
- no_filters
- s1_lr_cosine
- mh_ft_memorization_route_2026_09_24
- lr_cosine_warmup1000
- masster
- cuda_candidates
- fir_h100_mig
- nist20_mh_ft
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- m+h
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_64
- microbatch_512
- effective_batch_512
- unmerged
- nce_only
- no_cmf
- exposure_matched_epochs
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  # UNMERGED: one row per spectrum, not one per molecule-group. The other merge_* keys below are
  # inert while this is false; they are kept because they are part of the required key group.
  # merge_keep_ces is NOT inert: _check_ce_params asserts it is false when merge is off and
  # nce/ace is on (merge_keep_ces: true crashed flf0ako1 at model setup).
  # Consequence: NOTHING here is comparable to a merged cosine. The merged/unmerged split is
  # the confound docs record as "never like-for-like" (1.01 vs 18.55 rows per molecule), and
  # the unmerged family has its own recorded ceiling near 0.688-0.693.
  merge: false
  merge_keep_ces: false
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  inst_type: true
  inst_types:
  - FT
  frag_mode: false
  frag_modes: []
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
  # --- target cleaning: OFF. Matched control for f1. ---
  # Same scope, split, seed and architecture; only these switches differ.
  centroid_peaks: false
  centroid_ppm: 20.0
  centroid_use_instrument_tolerance: false
  centroid_method: common_overlap
  filter_subformula_peaks: false
  subformula_ppm: 5.0
  subformula_use_instrument_tolerance: true
  filter_above_precursor_peaks: false
  above_precursor_ppm: 10.0
  above_precursor_use_instrument_tolerance: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: false
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0
inst_type_loss_tol:
  FT:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
# ARM KEYS (control: lr_schedule false, a constant 1e-3 with no warmup). The d3 schedule
# (config/masster/ma_mi_merged/lr_decay_2026_09_22/d3_cosine_warmup1000.yml): a 1000-step linear
# warmup, then cosine from 1e-3 down to 1e-5 (lr_min_ratio 0.01) at the last step.
# lr_total_steps is the run's planned optimizer steps: 64 epochs x 308 steps/epoch = 19,712
# (c0 vcpho5qm steps 308 per epoch and ends at trainer/global_step 19,711). build_lr_scheduler
# raises for cosine without it; if max_epochs or train_batch_size changes, change this with it.
lr_schedule: true
lr_schedule_type: cosine
lr_total_steps: 19712
lr_min_ratio: 0.01
lr_warmup_steps: 1000
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 64
max_epochs: 64
debug_overfit: false
compile: false
pl_enable_progress_bar: true
# Upload the checkpoints to W&B artifacts. Needed here because the acceptance criterion for
# this pair is a CROSS-EVAL -- scoring the f1 checkpoint against f0's unfiltered target -- so
# both checkpoints have to outlive their job's scratch directory and be fetchable from
# somewhere other than the cluster checkout. Requires the run to be online (w=online, which the
# submitter passes). Retrieve with scripts/wandb_scripts/wandb_download_ckpts.py.
upload_checkpoints: true
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01

# Train-side auxiliary metrics off: see the header. This keeps peak GPU near 26.8 GiB so the run
# fits a 3g.40gb slice, at the cost of the train cosine (and therefore the train/val gap).
compute_train_auxiliary_metrics: false

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
masster_candidate_backend: cuda

# Campaign override(s) not present in the base file:
masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge

# MONITORING (every Step 1 config, c0 included; not in f0): log val/train
# candidate_wrecall, the candidate set's intensity ceiling, so acceptance criterion 5
# (coverage within 0.005 of c0) reads off W&B. Monitoring only; the loss is unchanged.
masster_candidate_coverage_metrics: true
