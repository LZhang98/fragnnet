wandb_name: nist20_ma_mi_unmerged_unique512_gine_efa384_bondcentric_a2_b3_transformer_full_context_proposal_anchored_inst_tol
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - mass_shatter
  - vulcan_l40s
  - nist20_ma_mi
  - unmerged
  - unique_fragments_512
  - max_enumerated_masks_512
  - pathway_marginalization
  - deterministic
  - instrument_tolerance
  - gine_efa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - full_context
  - ce_embed
  - adduct_embed
  - inst_type_embed
  - frag_mode_embed
  - mask_residual
  - proposal_anchored
  - base_ce_0.2
  - charge_logsumexp

seed: 397623

# 1. Keep individual NIST20 MA/MI spectra and use all acquisition context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: False
  merge_keep_ces: False
  nce: True
  ace: False
  prec_type: True
  prec_types:
    - "[M+H]+"
    - "[M-H]-"
    - "[M+Na]+"
    - "[M+Cl]-"
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - "IT"
  frag_mode: True
  frag_modes:
    - "HCD"
    - "CID"
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Keep base-plus-residual scoring and retained-mass normalization, but hide
# the base fragment probability from the transformer token projection.
model_type: mass_shatter
mol_gnn_type: GINE_EFA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
mass_shatter_unique_fragment_target: 512
mass_shatter_unique_fragment_mode: True
mass_shatter_ranked_mask_budget: 512
mass_shatter_explore_masks: 0
mass_shatter_exploration_temperature: 1.0
mass_shatter_include_single_bond_cuts: True
mass_shatter_max_h_transfer: 4
mass_shatter_include_cmf: True
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 3
mass_shatter_intensity_transformer_dim: 256
mass_shatter_intensity_transformer_num_layers: 2
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 512
mass_shatter_intensity_transformer_num_inducing_points: 64
mass_shatter_intensity_transformer_dropout: 0.1
mass_shatter_use_mask_residuals: True
# Proposal anchoring removes the direct probability-cancellation feature and
# gives the pre-residual distribution its own sparse-CE supervision.
mass_shatter_proposal_anchored: True
mass_shatter_log_base_ce: True
mass_shatter_base_ce_weight: 0.2

# 3. The final CE remains primary; the base-only CE supervises the proposer.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 64
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# Use acquisition-aware peak matching for the loss and candidate-support metrics.
# Unlisted instrument types retain the global 10 ppm / 0.002 Da-floor fallback.
inst_type_loss_tol:
  FT: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}

# 4. Match the established maximum L40S physical batch for unmerged unique512.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 128
accumulate_grad_batches: 1
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
  - wrecall
  - wprecision
eval_mz_bin_res:
  - 0.01
