wandb_name: nist20_merged_unique256_enum4096_gine_gsa384_bondcentric_a2_b2_transformer_ce_embed_proposal_selection_only_bf16
wandb_group: nist20_mass_shatter_fir_h100_40gb
wandb_tags:
  - mass_shatter
  - fir_h100_40gb
  - nist20
  - merged
  - unique_fragments_256
  - max_enumerated_masks_4096
  - pathway_marginalization
  - deterministic
  - matched_width_depth_a2_b2
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_2
  - intensity_transformer
  - ce_embed
  - adduct_embed
  - proposal_selection_only
  - proposal_loss_0.1
  - candidate_conditional
  - charge_logsumexp
  - bf16_mixed

seed: 397623

# Precision-only twin of the FP32 config with the same basename. Keep model,
# objective, batch size, accumulation, and seed fixed for a matched comparison.

# 1. Merge spectra within each precursor/adduct group while retaining collision
# energies as context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: True
  merge_normalize_each_spectrum: True
  merge_equal_ce_weight: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Search up to 4096 masks for 256 unique fragments with a width-384,
# two-layer GINE-EFA atom encoder and two local atom/bond refinement blocks.
model_type: mass_shatter
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_num_heads: 4
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
mass_shatter_unique_fragment_target: 256
mass_shatter_unique_fragment_mode: True
mass_shatter_ranked_mask_budget: 4096
mass_shatter_include_single_bond_cuts: True
mass_shatter_max_h_transfer: 4
mass_shatter_include_cmf: True
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 2
mass_shatter_intensity_transformer_dim: 256
mass_shatter_intensity_transformer_num_layers: 2
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 512
mass_shatter_intensity_transformer_num_inducing_points: 64
mass_shatter_intensity_transformer_dropout: 0.1
mass_shatter_use_mask_residuals: True
mass_shatter_proposal_anchored: True
mass_shatter_log_base_ce: True
mass_shatter_base_ce_weight: 0.0
mass_shatter_detach_base_ion_h: True
mass_shatter_proposal_selection_only: True
mass_shatter_proposal_loss_weight: 0.1

# 3. Train final spectral intensity and H-independent proposal support separately.
loss_type: cross_entropy
predict_oos: False
oos_loss: False
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 8
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 128
eval_batch_size: 64
accumulate_grad_batches: 2
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: bf16-mixed
use_tensor_float32: True
min_epochs: 60
max_epochs: 200
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01

# Per-instrument loss tolerance. QTOF floors at 0.015 Da to cover NIST23
# floor-truncated m/z; FT stays at 10 ppm.
inst_type_loss_tol:
  FT: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}
