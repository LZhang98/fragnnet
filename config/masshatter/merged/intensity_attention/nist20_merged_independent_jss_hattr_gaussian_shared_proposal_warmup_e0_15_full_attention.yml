# A/B arm: intensity-head attention topology.
# Control: config/masshatter/merged/proposal_warmup/nist20_merged_independent_jss_hattr_gaussian_shared_proposal_warmup_e0_15.yml
# This file must differ from the control only in wandb_name, wandb_tags, and
# mass_shatter_intensity_transformer_attention. The seed is matched deliberately.
wandb_name: nist20_merged_independent_jss_hattr_gaussian_shared_proposal_warmup_e0_15_full_attention
wandb_group: nist20_mass_shatter_l40s
wandb_tags:
  - mass_shatter
  - vulcan_l40s
  - nist20
  - merged
  - unique_fragments_256
  - max_enumerated_masks_1024
  - pathway_marginalization
  - deterministic
  - gine_gsa384
  - bond_centric
  - atom_layers_2
  - bond_layers_3
  - intensity_transformer
  - intensity_dim_384
  - intensity_layers_3
  - intensity_ff_1024
  - intensity_attention_full
  - intensity_attention_ab
  - independent_intensity
  - jss_distance
  - hungarian_peak_matching
  - gaussian_h_attribution
  - separate_h_support
  - h_support_loss_0.1
  - ce_embed
  - adduct_embed
  - proposal_selection_only
  - proposal_loss_0.1
  - proposal_mixtures_1
  - proposal_intensity_transform_none
  - candidate_conditional
  - shared_proposal_encoder
  - proposal_warmup_epochs_0_15
  - h_selection_0.01
  - mass_only_h_attribution
  - no_forced_single_cuts
  - charge_logsumexp

seed: 397623

# 1. Merge spectra within each precursor/adduct group while retaining collision
# energies as context.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: True
  merge_normalize_each_spectrum: True
  merge_equal_ce_weight: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Match the merged independent-cosine baseline's candidate architecture.
model_type: mass_shatter
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
mass_shatter_unique_fragment_target: 256
mass_shatter_unique_fragment_mode: True
mass_shatter_ranked_mask_budget: 1024
mass_shatter_include_single_bond_cuts: False
mass_shatter_max_h_transfer: 4
mass_shatter_include_cmf: True
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 3
mass_shatter_proposal_num_mixtures: 1
mass_shatter_intensity_transformer_dim: 384
mass_shatter_intensity_transformer_num_layers: 3
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 1024
mass_shatter_intensity_transformer_num_inducing_points: 128
mass_shatter_intensity_transformer_dropout: 0.1
# Direct candidate-to-candidate attention. The induced variant exists to keep attention
# linear when a molecule contributes thousands of candidates, but this path caps at 256
# unique fragments, where 128 latents cost 2*N*M = 65,536 attention pairs against
# N^2 = 65,536 for full attention. The latent set therefore buys no compute here while
# capping the rank of every candidate-candidate interaction at 128. Measured on one L40S
# at the bare contextualization geometry (dim 384, 3 layers, ff 1024, B=16, N=256):
# 8.72 ms versus 21.65 ms per pass. At the full head geometry configured here, which adds
# the 4-layer atom decoder and the separate ion/H support head, the intensity head holds
# 12,542,119 parameters against the control's 16,733,479; the 4,191,360 difference is
# entirely in the contextualization layers, because each full layer carries one attention
# and one feed-forward block instead of two.
#
# Confound to respect when reading the result: the arm is therefore cheaper AND smaller.
# A win cannot be attributed to added capacity or compute and is clean evidence. A null
# or a loss is confounded, because it cannot separate "full attention is no better" from
# "half the per-layer contextualization capacity hurt"; resolve that with a depth- or
# width-matched full arm before concluding against the topology.
#
# The intensity head is frozen and in eval mode through the epoch-15 proposal-only
# warmup, and the loss there is replaced by the proposal loss, so both arms should track
# the control exactly through epoch 15 at this matched seed. A divergence before epoch 16
# means something other than the attention topology differs.
# num_inducing_points above is retained but unread in this mode.
mass_shatter_intensity_transformer_attention: full
mass_shatter_intensity_output: independent
mass_shatter_use_mask_residuals: True
mass_shatter_proposal_anchored: True
mass_shatter_log_base_ce: False
mass_shatter_base_ce_weight: 0.0
mass_shatter_detach_base_ion_h: True
mass_shatter_proposal_selection_only: True
mass_shatter_proposal_loss_weight: 0.1
mass_shatter_proposal_ints_transform: none
mass_shatter_separate_proposal_encoder: False
mass_shatter_proposal_only_until_epoch: 15
mass_shatter_separate_ion_h_support_head: True
mass_shatter_ion_h_support_binary_logits: True
mass_shatter_gate_independent_intensity_with_support: True
mass_shatter_min_ion_h_relative_probability: 0.01
mass_shatter_min_ion_h_absolute_probability: 0.01
mass_shatter_ion_h_support_loss_weight: 0.1
mass_shatter_apply_channel_selection_in_training: False
mass_shatter_channel_support_attribution: gaussian_posterior
mass_shatter_channel_support_use_intensity_prior: False
mass_shatter_channel_diagnostics: True

# 3. Optimize nonnegative, non-normalized peak intensities with the configured
# direct objective and separately supervise supported hydrogen-transfer channels.
loss_type: jss_distance
ints_transform: none
mass_shatter_peak_matching: hungarian
mass_shatter_intensity_entropy_match_weight: 0.0
predict_oos: False
oos_loss: False
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 8
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 64
eval_batch_size: 64
accumulate_grad_batches: 4
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 200
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - precision
eval_mz_bin_res:
  - 0.01

# Per-instrument loss tolerance. QTOF floors at 0.015 Da to cover NIST23 floor-truncated
# m/z; FT stays at 10 ppm. FT-only configs are numerically unaffected.
inst_type_loss_tol:
  FT: {rel: 1.0e-5, min_mz: 200.0}
  QTOF: {rel: 2.0e-5, min_mz: 750.0}
