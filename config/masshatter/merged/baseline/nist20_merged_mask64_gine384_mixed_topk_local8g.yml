wandb_name: nist20_merged_mask64_transformer_cython_local8g
wandb_group: nist20_mass_shatter_local
wandb_tags:
  - mass_shatter
  - local_8gb
  - masks_64
  - gine_efa384
  - transformer
  - cython
  - bounded_additive
  - explore_64

seed: 397623

# 1. Keep the full NIST20 data and split used by the cluster experiment.
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_inchikey
spec_params:
  merge: True
  nce: True
  merge_keep_ces: True
  preprocess: True
mol_params:
  preprocess: True
  pyg_node_feats:
    - a_onehot
    - a_degree
    - a_hybrid
    - a_formal
    - a_radical
    - a_ring
    - a_ring_size
    - a_num_hs
    - a_mass
    - a_chiral
  pyg_edge_feats:
    - b_degree
    - b_ring
    - b_conj

# 2. Exercise compiled top-K, bounded exploration, topology, and transformer paths.
# Training uses 64 exact masks plus up to 64 bounded masks; evaluation is top-K only.
model_type: mass_shatter
mol_gnn_type: GINE_EFA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
mass_shatter_selected_mask_limit: 64
mass_shatter_explore_masks: 64
mass_shatter_exploration_mode: bounded_additive
mass_shatter_exploration_temperature: 1.0
mass_shatter_exploration_cut_count_weights: [0.0, 0.0, 0.35, 0.30, 0.20, 0.10, 0.05]
mass_shatter_include_single_bond_cuts: True
mass_shatter_max_h_transfer: 4
mass_shatter_include_cmf: True
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 3
mass_shatter_intensity_transformer_dim: 256
mass_shatter_intensity_transformer_num_layers: 2
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 512
mass_shatter_intensity_transformer_num_inducing_points: 64
mass_shatter_intensity_transformer_dropout: 0.1

# 3. Preserve the cluster objective with memory-safe loss chunks.
loss_type: cross_entropy
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 8
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0

# 4. Use a conservative physical batch on the 7.6 GiB RTX 2070 SUPER.
dynamic_batch_sampler: False
group_sampler: False
simple_group_sampler: False
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 8
eval_batch_size: 8
accumulate_grad_batches: 16
automatic_optimization: True
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: False

accelerator: gpu
devices: 1
num_workers: 2
precision: 32
use_tensor_float32: True
min_epochs: 60
max_epochs: 100
debug_overfit: False
compile: False
pl_enable_progress_bar: True
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
  - cos_sim
  - recall
  - wrecall
eval_mz_bin_res:
  - 0.01
