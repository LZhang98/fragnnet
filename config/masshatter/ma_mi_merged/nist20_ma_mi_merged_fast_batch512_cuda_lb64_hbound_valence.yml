# Arm of the regularization/normalization sweep -- see
# docs/plans/masshatter_regularization_sweep_plan.md. Every config in the sweep sets
# compute_train_auxiliary_metrics: true so the train cosine is logged next to the validation
# cosine; no MASShatter run before this sweep has ever logged one. Compare arms at matched
# epoch against ..._ctrl_a / ..._ctrl_b, never at matched wall clock and never against the
# 2026-09-18 L40S runs. loss_batch_size and num_workers are slice-dependent and are set at
# launch (2g.20gb needs loss_batch_size=16, num_workers=3); they do not change the loss.
# Hydrogen-transfer arm: mass_shatter_h_transfer_bound none -> valence.
# Full parity with FraGNNet: the complement bound above, plus compute_cc_h_cap -- a gain
# also may not exceed the fragment's free valence slots plus one per severed bond. A lone
# O from one cut becomes OH, never OH3, however much hydrogen the complement holds.
# Measured on the same probes: 1,193 -> 982 candidates (-17.7%).
#
# NOT a regularization arm, and not read like one. It changes the candidate set rather than
# the optimizer, and it removes the only channel currently explaining M+1 isotope peaks:
# 2.35% of in-scope training spectra carry a true peak on an above-precursor channel, and for
# +1H (2.27% of spectra) 84.3% are closer to the M+1 13C isotope than to a hydrogen transfer.
# Those peaks become unexplained, worth roughly 0.2% of intensity weight, so the primary loss
# shifts for a reason unrelated to fit quality. Compare these arms on val cosine at matched
# epoch, never on the loss.
# loss_batch_size 64 counterpart of nist20_ma_mi_merged_fast_batch512_cuda.yml (the arm it derives from
# used 8; template default is 32). Only loss_batch_size, wandb_name and tags
# differ. Measured cost: the merged peak-count tail (sigma 1.29, max 1168) makes
# the padded loss tensors spiky -- budget ~+4 GB over lbs=8 at microbatch 256.
# CUDA candidate counterpart of nist20_ma_mi_merged_fast_batch512.yml.
# Exact FP32 single-mixture selection/topology; CPU remains the template default.
# Local correctness/throughput checks passed; L40S acceptance is pending.
# Requires an existing compatible CUDA toolkit for the first native build.
# See docs/guides/benchmark_masshatter_merged_control.md for scope and confounds.
wandb_name: nist20_ma_mi_merged_fast_batch512_cuda_lb64_hbound_valence
wandb_group: nist20_mass_shatter_reg_sweep
wandb_tags:
- mass_shatter
- cuda_candidates
- fir_h100_mig
- nist20_ma_mi
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- deterministic
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+cl
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- loss_batch_64
- microbatch_512
- effective_batch_512
- merged
- merged_consensus
- nce_only
- no_cmf
- exposure_matched_epochs
- reg_sweep_2026_09_19
- h_transfer_bound_valence
- train_aux_metrics
seed: 397623
spec_fp: data/proc/nist20/spec_df.pkl
mol_fp: data/proc/nist20/mol_df.pkl
split_dp: data/split/nist20_ma_mi_inchikey
spec_params:
  merge: true
  merge_keep_ces: true
  nce: true
  ace: false
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+Cl]-'
  inst_type: true
  inst_types:
  - FT
  - QTOF
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
  merge_method: tolerance_consensus
  merge_tolerance_common_overlap: true
  merge_normalize_each_spectrum: true
  merge_equal_ce_weight: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: mass_shatter
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
ce_insert_size: 32
ace_max: 300
mass_shatter_unique_fragment_target: 256
mass_shatter_unique_fragment_mode: true
mass_shatter_ranked_mask_budget: 4096
mass_shatter_include_single_bond_cuts: true
mass_shatter_max_h_transfer: 4
mass_shatter_h_transfer_bound: valence
mass_shatter_include_cmf: false
mass_shatter_charge_pooling: logsumexp
mass_shatter_context_dim: 128
mass_shatter_metadata_embedding_dim: 32
mass_shatter_head_hidden_dim: 512
mass_shatter_head_dropout: 0.1
mass_shatter_bond_num_layers: 3
mass_shatter_intensity_transformer_dim: 256
mass_shatter_intensity_transformer_num_layers: 2
mass_shatter_intensity_transformer_num_heads: 8
mass_shatter_intensity_transformer_feedforward_dim: 512
mass_shatter_intensity_transformer_num_inducing_points: 64
mass_shatter_intensity_transformer_dropout: 0.1
mass_shatter_use_mask_residuals: true
mass_shatter_proposal_anchored: true
mass_shatter_log_base_ce: false
mass_shatter_base_ce_weight: 0.0
mass_shatter_detach_base_ion_h: true
mass_shatter_proposal_selection_only: true
mass_shatter_proposal_loss_weight: 0.1
mass_shatter_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 64
primary_loss_weight: 1.0
ce_pair_loss_weight: 0.0
inst_type_loss_tol:
