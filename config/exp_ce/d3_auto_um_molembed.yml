wandb_name: d3_auto_um_molembed
wandb_tags:
- exp_ce
- nist20
- d4
- wr00
- inchikey
- new_proc
- fraggnn_d3
- new_metrics
- nodemlp
- ce_embed
- unmerged
- oos_multiple_1
- gaussian_renormalize
- b64x2
- no_auxiliary_scores
- vectorized_loss
- lb16
- preload
- preprocess

# data stuff
spec_fp: data/proc/nist20mona23/spec_df.pkl
mol_fp: data/proc/nist20mona23/mol_df.pkl
split_dp: data/split/nist20_mona23_d4_wr00_inchikey
frag_dp: data/frag/nist20mona23_d3_h4_isoFalse_nb2/dags
frag_params:
  pyg_edge_feats: []
  pyg_edges: False
  pyg_bigraph: False
  preload: True
  preprocess: True
spec_params:
  merge: False
  nce: True
  merge_keep_ces: False
  preprocess: True
mol_params:
  preprocess: True

# model stuff
frag_gnn_type: NodeMLP
num_depth: 4
num_hs: 4
ce_insert_type: embed
ce_insert_location: mol
ce_insert_merge: False
mol_pool_type: mean
frag_pool_type: mean

# loss stuff
mask_null_formula: False
predict_oos: True
oos_tolerance_multiple: 1
oos_loss: True
gaussian_renormalize: True
sparse_cosine_similarity: True
loss_vectorized: True
loss_batch_size: 16
skip_extra_losses: True
group_sampler: False
simple_group_sampler: True
train_sample_weight: group
eval_sample_weight: none

# optimization stuff
train_batch_size: 64
eval_batch_size: 64
accumulate_grad_batches: 2
gradient_clip_val: 5.0
lr: 0.0004
accelerator: gpu
devices: 1
min_epochs: 100
max_epochs: 100
lr_schedule: False
debug_overfit: False
upload_checkpoints: True
checkpoint_metric: val_cos_sim_0.01_epoch/mean
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
dynamic_batch_sampler: False
pl_enable_progress_bar: True
compile: True
