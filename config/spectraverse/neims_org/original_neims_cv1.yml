wandb_name: spectraverse_neims_original_cv1
wandb_group: spectraverse_neims_original

# Original NEIMS Configuration
# Based on the original NEIMS paper: https://pubs.acs.org/doi/10.1021/acscentsci.9b00085
# This config uses paper-authentic settings with standard Linear layers (not low-rank)

# seed
seed: 397623

# data stuff
spec_fp: data/proc/spectraverse/spec_df.pkl
mol_fp: data/proc/spectraverse/mol_df.pkl
split_dp: data/split/spectraverse_nemis_inchikey_cv1
spec_params:
  merge: False
  nce: True
  merge_keep_ces: False
  preprocess: False
  prec_type_str: False
  prec_types:
    - '[M-H]-' 
    - '[M+H]+' 
    - '[M+HCOOH-H]-' 
    - '[M]+' 
    - '[M+Na]+' 
    - '[M+K]+' 
    - '[M+NH4]+'
    - '[M+CH3COO]-' 
    - '[M+Cl]-'
  inst_type: True
  inst_types:
    - "FT"
    - "QTOF"
    - 'IT'
    - "Other"
    - "NA"
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  # Original NEIMS fingerprint parameters (likely from paper)
  morgan_radius: 2  # Original NEIMS likely uses radius=2
  morgan_nbits: 2048
  rdkit_nbits: 2048
  pyg: False
  preprocess: False
frag_params:
  pyg: False

# model stuff - Original NEIMS configuration
model_type: neims
mlp_hidden_size: 1024
mlp_dropout: 0.1
mlp_num_layers: 4  # Number of layers from paper
mlp_use_residuals: True
neims_bottleneck_factor: 0.5  # Bottleneck compression ratio from paper
ff_prec_mz_offset: 50
ff_bidirectional: True
ff_output_map_size: -1  # Use standard Linear layers (original NEIMS, not low-rank)
ff_output_activation: relu
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True
mz_max: 1500.0
mz_bin_res: 1.0
sum_ints: True

# loss stuff
loss_type: cosine_distance
sparse_cosine_similarity: True
ints_transform: sqrt

# optimization stuff
train_batch_size: 256
eval_batch_size: 256
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0004006
weight_decay: 0.0000001
accelerator: gpu
devices: 1
min_epochs: 10
max_epochs: 100
lr_schedule: True
lr_decay_rate: 0.7224
lr_warmup_steps: 1000
lr_decay_steps: 5000
debug_overfit: False
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
compile: False
num_workers: 4
