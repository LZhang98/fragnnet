wandb_name: spectraverse_inchikey_neims_cv5
wandb_group: spectraverse_inchikey_neims
wandb_tags:
- neims
- fingerprint
- morgan2048
- rdkit2048
- maccs
- ff_bidirectional
- low_rank          # ff_output_map_size=256
- mlp_residual
- ce_embed
- ce_mlp            # CE inserted at MLP location
- inst_type
- nce
- sqrt              # ints_transform: sqrt
- b384              # batch size 384

# seed
seed: 397623

# data stuff
spec_fp: data/proc/spectraverse/spec_df.pkl
mol_fp: data/proc/spectraverse/mol_df.pkl
split_dp: data/split/spectraverse_benchmark/cv5
spec_params:
  merge: False
  nce: True
  merge_keep_ces: False
  preprocess: False
  prec_type_str: False
  prec_types:
    - '[M-H]-' 
    - '[M+H]+' 
    - '[M+HCOOH-H]-' 
    - '[M]+' 
    - '[M+Na]+' 
    - '[M+K]+' 
    - '[M+NH4]+'
    - '[M+CH3COOH-H]-' 
    - '[M+Cl]-'
  inst_type: True
  inst_types:
    - "ORB"
    - "QTOF"
    - 'IT'
    - "Other"
    - "NA"
mol_params:
  fingerprint_morgan: True
  fingerprint_rdkit: True
  fingerprint_maccs: True
  fingerprint: True
  pyg: False
  preprocess: False
frag_params:
  pyg: False

# model stuff
model_type: neims
mlp_hidden_size: 1024
mlp_dropout: 0.1
mlp_num_layers: 4
mlp_use_residuals: True
ff_prec_mz_offset: 50
ff_bidirectional: True
ff_output_map_size: 256
ce_insert_type: embed
ce_insert_location: mlp
ce_insert_merge: True
mz_max: 1500.0
mz_bin_res: 0.01
sum_ints: True

# loss stuff
loss_type: cosine_distance
sparse_cosine_similarity: True
ints_transform: sqrt

# optimization stuff
train_batch_size: 384
eval_batch_size: 384
accumulate_grad_batches: 1
gradient_clip_val: 5.0
lr: 0.0001
weight_decay: 0.0000001
accelerator: gpu
devices: 1
min_epochs: 1
max_epochs: 3
lr_schedule: False
lr_decay_rate: 0.7224
lr_warmup_steps: 1000
lr_decay_steps: 5000
debug_overfit: False
upload_checkpoints: False
checkpoint_metric: val_cos_sim_0.01_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
eval_mz_bin_res:
- 0.01
precision: 32
use_tensor_float32: True
automatic_optimization: True
compile: False
num_workers: 4
