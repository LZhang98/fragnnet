# MASSter on Spectraverse, fold cv4, 2026-09-25. Unmerged, CMF on, dual CE on a fourier table, weight EMA.
#
# Forked from config/masster/massspecgym/msgym_benchmark_1_5_unmerged_dual_ce_fast_batch512_cuda_ema999.yml,
# the latest MASSter benchmark port (prenorm intensity head, cosine LR with 1000-step warmup,
# pinned candidate defaults, ema_decay 0.999). Its own parent is the NIST20 unmerged
# CMF + dual-CE arm (6ks7v8ce), which is the only MASSter run that trained a live CMF channel
# together with ACE + NCE -- the combination Spectraverse needs (1 below). The folds differ only
# in wandb_name, split_dp and lr_total_steps.
#
# Measured from data/proc/spectraverse/spec_df.pkl (2026-09-25):
#   488,797 spectra / 44,304 molecules / 97,188 groups (5.03 spectra/group, 11.03 per molecule).
#   prec_type : [M+H]+ 233,103 / [M-H]- 107,867 / [M+Na]+ 69,475 / [M+NH4]+ 34,889 /
#               [M+HCOOH-H]- 16,136 / [M+K]+ 9,508 / [M+CH3COOH-H]- 8,456 / [M+Cl]- 5,958 /
#               [M]+ 3,405.
#   inst_type : FT 290,183 / QTOF 169,380 / Other 16,181 / NA 13,053.
#   frag_mode : CID for every row.
#   ce        : NCE absent on 100% of rows; ACE on 55.9%. ce_type none on 215,785 rows (44%),
#               including 16,162 of the 16,181 "Other" rows.
#   peaks     : p50 27, p90 176, p99 783, max 4096 per spectrum (MassSpecGym: p99 208, max 299).
#   prec_mz   : max 999.8, so the template mz_max 1500 drops nothing.
#   elements  : C H O N S P Cl F Br I B Si As Se Sn.
#
# The spectraverse deltas from the MassSpecGym recipe:
#
# 1. masster_include_cmf true (MassSpecGym: false). MassSpecGym is all [M+H]+, where the CMF
#    ion IS the CRF ion at delta_h = -1. Here 34,889 [M+NH4]+ and 24,592 formate/acetate
#    spectra fragment mainly by losing the adduct (NH3, HCOOH, CH3COOH), which the +-4 H ladder
#    cannot reach, and [M+Na]+/[M+K]+/[M+Cl]- have distinct CMF ions too
#    (formula_utils.PREC_TYPE_TO_CMF_MASS_DIFF). All nine adducts are in PREC_TYPE_TO_MASS_DIFF.
#
# 2. Unmerged. No merged MASSter run has ever had a live CMF channel together with dual CE
#    (docs/guides/benchmark_masster_merged_control.md), and 1 is not optional here. Merging would
#    also concentrate the peak tail: summed peaks per group are p99 4,338, max 37,224.
#    Compare against config/spectraverse/fragnnet (unmerged), not fragnnet_merged.
#
# 3. Missing CE is kept, not dropped. With nce and ace both on, NCE is derived from ACE
#    (nce = ace * 500 / prec_mz; every adduct here is singly charged); a row with neither becomes
#    the -1 sentinel, which the IntFeaturizer maps to a dedicated learned extra embedding.
#    Spectraverse specifies its training data, so all 44% of CE-less rows train. nce_max 300 as in
#    MassSpecGym: derived NCE is p99 206, max 1,097; 0.32% of CE-bearing rows clamp at 300 (1.06%
#    at 200). ace_max 300: no ACE exceeds it (max 296).
#
# 4. Vocabularies: all nine adducts; inst_types ORB/QTOF/Other/NA (no IT rows exist). Other and
#    NA get the 20 ppm / 500 Da loss tolerance that config/spectraverse/fragnnet uses.
#    frag_modes keeps HCD next to CID, as the MassSpecGym config does.
#
# 5. min_epochs/max_epochs 40/40 (MassSpecGym: 128). An epoch here is ceil(388,070 / 512) = 758
#    steps (753-780 across folds), 3.9x MassSpecGym's 194. MassSpecGym val cosine peaks at
#    epoch 62 (~12k steps) and drifts down after, and the NIST20 unmerged parent had plateaued by
#    ~17k steps. 40 epochs = 30,320 steps, which is 2.5x the MassSpecGym peak in steps for 2.8x
#    its training molecules (33,947 in cv0 vs 12,310), and ~460 spectrum passes per molecule
#    (MassSpecGym peak: ~500). NOT a measured horizon on this dataset. Wall clock is an
#    estimate: 1imawkx1 ran 0.51 s/step and this config measures 1.19x its step time (6), so
#    ~0.6 s/step, ~8 min/epoch before validation, ~6 h for 40 epochs.
#    lr_total_steps = 40 x 758; change it with max_epochs.
#
# 6. loss_batch_size 4 (MassSpecGym: 64). Every loss chunk is padded to its widest target
#    spectrum, so memory is chunk x max_true x max_pred, and this peak tail is far heavier than
#    MassSpecGym's. Measured locally on cv0 train (RTX 2070S 8 GB, 2026-09-25), peak GiB per
#    step, max / median:
#      batch 32 : lb64 OOM at step 24 | lb16 3.26 / 1.48 | lb4 1.40 / 1.14 | MassSpecGym lb64 1.43 / 1.02
#      batch 128: lb8 5.65 / 4.22 | lb4 4.68 / 3.93, 0.346 s/step | MassSpecGym lb64 4.25 / 3.89, 0.291 s/step
#    lb4 is also the fastest at batch 32 (0.132 s vs 0.150 s at lb16). The CE loss is
#    per-spectrum, so chunking changes cost, not the loss value. Batch 512 itself was not run
#    (8 GB card); lb4 tracks the MassSpecGym run that trained at 512, ~4x the batch-128 peak.
#
# 7. ce_insert_type embed with int_embedder fourier (MassSpecGym: embed with the template's
#    abs-sines), 2026-09-27. At max 300, abs-sines gives x and 512 - x the same code (44 pairs,
#    212 = 300 through 255 = 257). fourier is sin and cos at periods 1 to 1,024: every integer in
#    0-300 gets its own row (nearest two 2.45 apart), into Linear(22, 32) per CE channel.
#    - Not qet (this config's 2026-09-26 setting): on NIST20 [M+H]+/FT, n1 (qet), n2 (qet_mlp)
#      and n3 (id) trail c0 by 0.012 / 0.010 / 0.009 with train fit unchanged, so the per-energy
#      code carries something that transfers. n4 (c0 + fourier) runs +0.006 over c0 at epochs
#      51-60, tail not yet read
#      (docs/findings/masster/masster_qet_projection_candidate_union_2026_09_26.md).
#    - Not fixed: derived NCE is continuous here (525 distinct rounded values), and a rare or
#      unseen energy still gets high-frequency columns unrelated to its neighbours'.
#
# EMA (0.999, mean weight age ~1,000 steps as in the NIST20 wins) is untested together with
# cosine LR decay; the MassSpecGym _ema999 arm that measures that has not been read.
# No frag_dp: MASSter enumerates cut masks from the molecular graph and reads no DAG files.
wandb_name: spectraverse_masster_cv4
wandb_group: spectraverse_masster
wandb_tags:
- masster
- spectraverse
- cv4
- unmerged
- cmf
- dual_ce
- missing_ce_token
- ema
- ema_0.999
- cuda_candidates
- loss_batch_4
- unique_fragments_256
- max_enumerated_masks_4096
- pathway_marginalization
- instrument_tolerance
- gine_gsa384
- bond_centric
- atom_layers_2
- bond_layers_3
- intensity_transformer
- full_context
- full_metadata
- ce_embed
- ce_fourier
- adduct_embed
- inst_type_embed
- frag_mode_embed
- m+h
- m-h
- m+na
- m+nh4
- m+hcooh-h
- m+k
- m+ch3cooh-h
- m+cl
- m+
- prenorm
- lr_decay
- cosine_schedule
- warmup
- proposal_selection_only
- proposal_loss_0.1
- candidate_conditional
- charge_logsumexp
- reduced_monitoring
- microbatch_512
- effective_batch_512
seed: 397623
spec_fp: data/proc/spectraverse/spec_df.pkl
mol_fp: data/proc/spectraverse/mol_df.pkl
split_dp: data/split/spectraverse_benchmark/cv4
spec_params:
  merge: false
  merge_keep_ces: false
  nce: true
  ace: true
  prec_type: true
  prec_types:
  - '[M+H]+'
  - '[M-H]-'
  - '[M+Na]+'
  - '[M+NH4]+'
  - '[M+HCOOH-H]-'
  - '[M+K]+'
  - '[M+CH3COOH-H]-'
  - '[M+Cl]-'
  - '[M]+'
  inst_type: true
  inst_types:
  - ORB
  - QTOF
  - Other
  - NA
  frag_mode: true
  frag_modes:
  - HCD
  - CID
  preprocess: true
mol_params:
  preprocess: true
  pyg_node_feats:
  - a_onehot
  - a_degree
  - a_hybrid
  - a_formal
  - a_radical
  - a_ring
  - a_ring_size
  - a_num_hs
  - a_mass
  - a_chiral
  - a_charge
  pyg_edge_feats:
  - b_degree
  - b_ring
  - b_conj
model_type: masster
mol_gnn_type: GINE_GSA
mol_hidden_size: 384
mol_num_layers: 2
mol_normalization: batch
mol_dropout: 0.1
ce_insert_type: embed
int_embedder: fourier  # header 7
ce_insert_size: 32
nce_max: 300
ace_max: 300
masster_unique_fragment_target: 256
masster_unique_fragment_mode: true
masster_ranked_mask_budget: 4096
masster_include_single_bond_cuts: true
masster_max_h_transfer: 4
masster_h_transfer_bound: valence
masster_include_cmf: true
masster_charge_pooling: logsumexp
masster_context_dim: 128
masster_metadata_embedding_dim: 32
masster_head_hidden_dim: 512
masster_head_dropout: 0.1
masster_bond_num_layers: 3
masster_intensity_transformer_dim: 256
masster_intensity_transformer_num_layers: 2
masster_intensity_transformer_num_heads: 8
masster_intensity_transformer_feedforward_dim: 512
masster_intensity_transformer_num_inducing_points: 64
masster_intensity_transformer_dropout: 0.1
masster_use_mask_residuals: true
masster_proposal_anchored: true
masster_log_base_ce: false
masster_base_ce_weight: 0.0
masster_detach_base_ion_h: true
masster_proposal_selection_only: true
masster_proposal_loss_weight: 0.1
masster_channel_diagnostics: false
loss_type: cross_entropy
predict_oos: false
oos_loss: false
gaussian_renormalize: true
sparse_cosine_similarity: true
loss_vectorized: true
loss_batch_size: 4  # see header 6: chunk padding to the peak tail OOMs at 64
primary_loss_weight: 1.0
inst_type_loss_tol:
  ORB:
    rel: 1.0e-05
    min_mz: 200.0
  QTOF:
    rel: 2.0e-05
    min_mz: 750.0
  Other:
    rel: 2.0e-05
    min_mz: 500.0
  NA:
    rel: 2.0e-05
    min_mz: 500.0
dynamic_batch_sampler: false
group_sampler: false
simple_group_sampler: false
train_sample_weight: none
eval_sample_weight: none
train_batch_size: 512
eval_batch_size: 512
accumulate_grad_batches: 1
automatic_optimization: true
gradient_clip_val: 5.0
lr: 0.001
weight_decay: 0.01
lr_schedule: true
lr_schedule_type: cosine
lr_total_steps: 30320
lr_min_ratio: 0.01
lr_warmup_steps: 1000
accelerator: gpu
devices: 1
num_workers: 6
precision: 32
use_tensor_float32: true
min_epochs: 40
max_epochs: 40
debug_overfit: false
compile: false
pl_enable_progress_bar: true
upload_checkpoints: true
checkpoint_metric: val_cos_hun_inst_tol_epoch/mean
checkpoint_metric_mode: max
auxiliary_scores:
- cos_sim
- cos_hun_inst_tol
- recall
- precision
- wrecall
- wprecision
eval_mz_bin_res:
- 0.01
compute_train_auxiliary_metrics: false

# Explicit opt-in; unsupported modes/devices fail instead of falling back.
masster_candidate_backend: cuda

masster_boundary_bond_encoder: true
masster_candidate_features:
- c_cut_count
- c_size
- c_mass
- c_charge
masster_intensity_norm_placement: pre

# Weight EMA (see header). Template default null.
ema_decay: 0.999
