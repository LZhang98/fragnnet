<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">V1 shared-GNN proposal and spectral intensity design</title>
  <desc id="desc">Architecture diagram for W&amp;B run 3oqibfwg, showing one shared molecular GNN, a detached proposal path for candidate support, and an intensity path trained by the normalized spectrum.</desc>
  <defs>
    <style>
      .title { font: 700 38px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 19px Inter, Arial, sans-serif; fill: #596579; }
      .section { font: 700 18px Inter, Arial, sans-serif; letter-spacing: 1.4px; }
      .box-title { font: 700 22px Inter, Arial, sans-serif; fill: #172033; }
      .box-body { font: 400 17px Inter, Arial, sans-serif; fill: #455268; }
      .small { font: 400 15px Inter, Arial, sans-serif; fill: #596579; }
      .loss-title { font: 700 21px Inter, Arial, sans-serif; fill: #ffffff; }
      .loss-body { font: 400 15px Inter, Arial, sans-serif; fill: #ffffff; }
      .callout { font: 700 17px Inter, Arial, sans-serif; fill: #9e3a2f; }
      .arrow { fill: none; stroke: #67748a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .proposal-arrow { fill: none; stroke: #d06a58; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-proposal); }
      .intensity-arrow { fill: none; stroke: #3979b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-intensity); }
      .loss-arrow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#67748a"/>
    </marker>
    <marker id="arrow-proposal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d06a58"/>
    </marker>
    <marker id="arrow-intensity" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3979b8"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1800" height="1040" fill="#f7f9fc"/>
  <text id="title-text" x="70" y="66" class="title">NONAME Spectra Prediction Model</text>
  <text x="70" y="99" class="subtitle">Run 3oqibfwg · detached shared features train proposal heads; the spectrum objective trains emitted intensity.</text>

  <!-- Inputs -->
  <text x="70" y="155" class="section" fill="#6b7485">INPUTS</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="250" height="118" rx="18" fill="#ffffff" stroke="#cbd3df" stroke-width="2"/>
    <text x="100" y="222" class="box-title">Molecule</text>
    <text x="100" y="253" class="box-body">atom–bond graph</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="334" width="250" height="132" rx="18" fill="#ffffff" stroke="#cbd3df" stroke-width="2"/>
    <text x="100" y="375" class="box-title">Acquisition</text>
    <text x="100" y="406" class="box-body">collision energy · adduct</text>
    <text x="100" y="434" class="box-body">instrument · precursor</text>
  </g>

  <!-- Shared encoder -->
  <g filter="url(#shadow)">
    <rect x="410" y="238" width="275" height="154" rx="20" fill="#eef2f8" stroke="#8797ad" stroke-width="2.5"/>
    <text x="446" y="286" class="box-title">Shared GNN</text>
    <text x="446" y="320" class="box-body">GNN atom and bond states</text>
    <text x="446" y="350" class="box-body">+ precursor context</text>
  </g>
  <path d="M320 239 C360 239, 366 275, 410 286" class="arrow"/>
  <path d="M320 400 C360 400, 370 356, 410 345" class="arrow"/>

  <!-- Proposal lane -->
  <rect x="750" y="141" width="980" height="310" rx="26" fill="#fff6f3" stroke="#efc4bb" stroke-width="2"/>
  <text x="782" y="178" class="section" fill="#b24d3e">PROPOSAL MODEL</text>
  <text x="782" y="204" class="small">Proposal scores determine which chemistry is evaluated.</text>

  <path d="M685 280 L690 280" fill="none" stroke="#d06a58" stroke-width="3"/>
  <rect x="690" y="260" width="70" height="72" rx="12" fill="#fff6f3" stroke="#d06a58" stroke-width="2"/>
  <text x="725" y="287" class="small" text-anchor="middle" fill="#9e3a2f">detach</text>
  <text x="725" y="310" class="small" text-anchor="middle" fill="#9e3a2f">features</text>
  <path d="M760 296 L787 296" class="proposal-arrow"/>

  <g>
    <rect x="790" y="235" width="270" height="150" rx="18" fill="#ffffff" stroke="#dc8b7d" stroke-width="2.5"/>
    <text x="820" y="275" class="box-title">Proposal heads</text>
    <text x="820" y="309" class="box-body">bond-cut mask score</text>
    <text x="820" y="338" class="box-body">charge score</text>
  </g>
  <path d="M1060 310 L1102 310" class="proposal-arrow"/>
  <g>
    <rect x="1105" y="235" width="270" height="150" rx="18" fill="#ffffff" stroke="#dc8b7d" stroke-width="2.5"/>
    <text x="1137" y="275" class="box-title">Top-K masks</text>
    <text x="1137" y="309" class="box-body">discrete selection</text>
    <text x="1137" y="338" class="box-body">U256 / E4096</text>
  </g>
  <path d="M1375 310 L1407 310" class="proposal-arrow"/>
  <g>
    <rect x="1410" y="235" width="270" height="150" rx="18" fill="#ffffff" stroke="#dc8b7d" stroke-width="2.5"/>
    <text x="1440" y="275" class="box-title">Ion-state generation</text>
    <text x="1440" y="307" class="box-body">components × charge</text>
    <text x="1440" y="336" class="box-body">CRF/CMF × ΔH → m/z</text>
    <text x="1440" y="365" class="small">valid candidates + deduplication</text>
  </g>

  <!-- Intensity lane -->
  <rect x="750" y="516" width="980" height="288" rx="26" fill="#f2f8ff" stroke="#b9d3ed" stroke-width="2"/>
  <text x="782" y="555" class="section" fill="#286aa7">INTENSITY MODEL</text>
  <text x="782" y="581" class="small">All retained ion candidates compete jointly for normalized spectral intensity.</text>

  <path d="M1545 385 L1545 488 Q1545 500 1533 500 L747 500 Q735 500 735 512 L735 618 Q735 630 747 630 L787 630" class="intensity-arrow"/>
  <path d="M685 351 L688 351 Q700 351 700 363 L700 668 Q700 680 712 680 L787 680" class="intensity-arrow"/>
  <g>
    <rect x="790" y="605" width="270" height="150" rx="18" fill="#ffffff" stroke="#6ba2d2" stroke-width="2.5"/>
    <text x="820" y="646" class="box-title">Candidate features</text>
    <text x="820" y="680" class="box-body">fragment + ion identity</text>
    <text x="820" y="709" class="box-body">molecule + acquisition context</text>
  </g>
  <path d="M1060 680 L1117 680" class="intensity-arrow"/>
  <g>
    <rect x="1120" y="605" width="270" height="150" rx="18" fill="#ffffff" stroke="#6ba2d2" stroke-width="2.5"/>
    <text x="1151" y="646" class="box-title">Intensity head</text>
    <text x="1151" y="680" class="box-body">candidate set transformer</text>
    <text x="1151" y="709" class="box-body">relative-intensity logits</text>
  </g>
  <path d="M1390 680 L1447 680" class="intensity-arrow"/>
  <g>
    <rect x="1450" y="605" width="270" height="150" rx="18" fill="#ffffff" stroke="#6ba2d2" stroke-width="2.5"/>
    <text x="1480" y="646" class="box-title">Predicted spectrum</text>
    <text x="1482" y="675" class="small">Σ intensity = 1</text>
    <line x1="1485" y1="732" x2="1690" y2="732" stroke="#8ba0b7" stroke-width="2"/>
    <line x1="1502" y1="732" x2="1502" y2="706" stroke="#3979b8" stroke-width="5"/>
    <line x1="1543" y1="732" x2="1543" y2="685" stroke="#3979b8" stroke-width="5"/>
    <line x1="1581" y1="732" x2="1581" y2="699" stroke="#3979b8" stroke-width="5"/>
    <line x1="1632" y1="732" x2="1632" y2="676" stroke="#3979b8" stroke-width="5"/>
    <line x1="1670" y1="732" x2="1670" y2="710" stroke="#3979b8" stroke-width="5"/>
  </g>

  <!-- Supervision and losses -->
  <text x="70" y="832" class="section" fill="#6b7485">SUPERVISION</text>
  <g filter="url(#shadow)">
    <rect x="70" y="855" width="330" height="126" rx="18" fill="#ffffff" stroke="#8c98aa" stroke-width="2"/>
    <text x="100" y="895" class="box-title">Observed spectrum</text>
    <text x="100" y="928" class="box-body">normalized peak intensities</text>
    <text x="100" y="956" class="small">matched at instrument tolerance</text>
  </g>
  <g>
    <rect x="520" y="850" width="450" height="135" rx="20" fill="#ffffff" stroke="#c95f50" stroke-width="2.5"/>
    <text x="550" y="893" class="box-title" fill="#b24d3e">Proposal loss</text>
    <text x="550" y="925" class="box-body">intensity-weighted candidate coverage</text>
    <text x="550" y="951" class="box-body">no learned ΔH / ion probability</text>
  </g>
  <g>
    <rect x="1050" y="850" width="450" height="135" rx="20" fill="#ffffff" stroke="#3979b8" stroke-width="2.5"/>
    <text x="1080" y="893" class="box-title" fill="#286aa7">Spectrum loss</text>
    <text x="1080" y="925" class="box-body">normalized spectral-intensity objective</text>
    <text x="1080" y="951" class="box-body">trains shared GNN + intensity head</text>
  </g>
  <path d="M400 897 L520 897" class="loss-arrow" stroke="#c95f50" marker-end="url(#arrow-proposal)"/>
  <path d="M400 944 C445 944, 455 1008, 520 1008 L970 1008 C1010 1008, 1020 944, 1050 944" class="loss-arrow" stroke="#3979b8" marker-end="url(#arrow-intensity)"/>
  <path d="M745 850 C745 815, 720 805, 720 770 L720 460 C720 425, 748 405, 785 405 L860 405 C885 405, 900 395, 900 385" class="loss-arrow" stroke="#c95f50" marker-end="url(#arrow-proposal)"/>
  <path d="M1275 850 L1275 755" class="loss-arrow" stroke="#3979b8" marker-end="url(#arrow-intensity)"/>

  <!-- Central design statement -->
  <rect x="793" y="419" width="690" height="64" rx="16" fill="#fff0ec" stroke="#e2a094" stroke-width="2"/>
  <text x="1138" y="458" class="callout" text-anchor="middle">Proposal probability selects candidates — it is not fragment intensity.</text>

</svg>
