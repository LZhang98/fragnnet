entity: fragnnet
project: fragnnet
program: ~/fragnnet/scripts/run_wandb_sweep.py
method: random
name: nist20_d3_ma_mi_mol_width
description: Focused follow-up sweep for NIST20 D3 MA/MI after sweep_2 showed a strong mol_hidden_size boundary effect.
metric:
  goal: maximize
  name: val_cos_sim_0.01_best/mean
parameters:
  # Molecular encoder capacity. 256 is retained as the anchor; 384/512 test the boundary.
  mol_hidden_size:
    values: [256, 384, 512]
  mol_pool_type:
    values: [mean, mean_max_sum]

  # Keep fragment side at the previous best boundary to isolate molecule scaling.
  frag_hidden_size:
    values: [256]

  # MLP size had a weaker sweep_2 effect, so keep this narrow.
  mlp_hidden_size:
    values: [128, 256]

  # Optimization around the best sweep_2 and new_frags2 regimes.
  lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.001
  weight_decay:
    values: [0.0, 0.001, 0.01]

  # Regularization. Avoid zero-heavy dropout and weight_decay=0.1 from the prior sweep.
  mol_dropout:
    values: [0.05, 0.1, 0.2]
  frag_dropout:
    values: [0.05, 0.1, 0.2]
  mlp_dropout:
    values: [0.02, 0.05, 0.1]

  # Prior sweep favored small/non-negative entropy pressure.
  node_normalized_entropy_weight:
    values: [0.0, 0.01]
