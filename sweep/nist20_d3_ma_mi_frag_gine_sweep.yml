entity: frag-gnn
project: frag-gnn
program: ~/fragnnet/scripts/run_wandb_sweep.py
method: random
name: nist20_d3_ma_mi_frag_gine
description: >
  Sweep for frag_gnn_type=GINE with CE loss. Architecture: bidirectional DAG
  message-passing with base_formula (neutral loss) edge features. mol_gnn_type
  and mol_hidden_size fixed; sweeps lr/dropout/wd, frag_hidden_size,
  frag_num_layers, and mlp_hidden_size.
metric:
  goal: minimize
  name: val_loss_epoch/mean
parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.001

  weight_decay:
    values: [0.0, 0.001, 0.01]

  mol_dropout:
    values: [0.1, 0.2, 0.3]

  frag_dropout:
    values: [0.1, 0.2]

  mlp_dropout:
    values: [0.1, 0.3, 0.4]

  frag_hidden_size:
    values: [256, 384]

  frag_num_layers:
    values: [2, 3, 4]

  mlp_hidden_size:
    values: [128, 256, 384]

  mlp_num_layers:
    values: [1, 2, 3]
