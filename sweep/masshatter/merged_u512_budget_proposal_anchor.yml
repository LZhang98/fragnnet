entity: frag-gnn
project: frag-gnn
program: scripts/run_wandb_sweep.py
method: grid
name: masshatter_merged_u512_budget_proposal_anchor
description: >
  Six-run merged-spectrum MASShatter grid at unique-fragment target 512.
  Compare the lowest valid ranked-mask budget, 512, against 2048 while
  sweeping the base-only proposal CE weight over 0.1, 0.2, and 0.3.
metric:
  goal: maximize
  name: val_cos_sim_0.01_epoch/mean

parameters:
  mass_shatter_unique_fragment_target:
    value: 512
  mass_shatter_ranked_mask_budget:
    values: [512, 2048]
  mass_shatter_base_ce_weight:
    values: [0.1, 0.2, 0.3]
  mass_shatter_proposal_anchored:
    value: true
  max_epochs:
    value: 200
