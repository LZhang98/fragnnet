entity: frag-gnn
project: frag-gnn
program: scripts/run_wandb_sweep.py
method: grid
name: masshatter_merged_u256_enum2048_base_ce_ion_h_detach
description: >
  Two-run matched ablation at unique-fragment target 256, ranked-mask budget
  2048, and base-only CE weight 0.1. Change only whether base-only CE gradients
  enter the shared candidate transformer through the ion/H probabilities.
metric:
  goal: maximize
  name: val_cos_sim_0.01_epoch/mean

parameters:
  masster_unique_fragment_target:
    value: 256
  masster_ranked_mask_budget:
    value: 2048
  masster_base_ce_weight:
    value: 0.1
  masster_proposal_anchored:
    value: true
  masster_detach_base_ion_h:
    values: [false, true]
  max_epochs:
    value: 200
