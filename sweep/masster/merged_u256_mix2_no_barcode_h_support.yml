entity: frag-gnn
project: frag-gnn
program: scripts/run_wandb_sweep.py
method: grid
name: masshatter_merged_u256_mix2_no_barcode_h_support
description: >
  Three-run merged-spectrum MASSter grid using the historical U256, E1024,
  Mix2, no-barcode structure. Sweep only the separate ion/H support-loss weight;
  keep training dense and evaluate fixed top-k rules later from each checkpoint.
metric:
  goal: maximize
  name: val_cos_sim_0.01_epoch/mean

parameters:
  masster_unique_fragment_target:
    value: 256
  masster_ranked_mask_budget:
    value: 1024
  masster_proposal_num_mixtures:
    value: 2
  masster_min_mask_relative_probability:
    value: 0.0
  masster_min_fragment_relative_probability:
    value: 0.0
  masster_proposal_barcode_target:
    value: false
  masster_separate_ion_mode_proposal_head:
    value: false
  masster_ion_mode_proposal_loss_weight:
    value: 0.0
  masster_separate_ion_h_support_head:
    value: true
  masster_min_ion_h_relative_probability:
    value: 0.0
  masster_ion_h_support_loss_weight:
    values: [0.03, 0.1, 0.3]
  masster_apply_channel_selection_in_training:
    value: false
  upload_checkpoints:
    value: false
  max_epochs:
    value: 200
