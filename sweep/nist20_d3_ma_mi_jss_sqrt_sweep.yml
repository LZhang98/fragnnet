entity: frag-gnn
project: frag-gnn
program: ~/fragnnet/scripts/run_wandb_sweep.py
method: random
name: nist20_d3_ma_mi_jss_sqrt_loss
description: >
  Sweep for JSS + sqrt-loss training (loss_type=jss_distance, ints_transform=sqrt).
  Architecture fixed to focused-sweep winners (mol_hidden=384, frag_pool=max).
  Sweeps lr/dropout/weight_decay since both the JSS loss landscape and sqrt targets
  change the effective gradient scale relative to cosine-distance training.
metric:
  goal: minimize
  name: val_loss_epoch/mean
  # Secondary tracking in W&B UI: val_cos_sim_0.01_best/mean for cross-sweep comparison;
  # val_pred_spec_ne_epoch/mean vs val_true_spec_ne_epoch/mean for peak-count quality.
parameters:
  # GINE_GSA adds exact per-graph global self-attention on top of GINE.
  # mol_num_heads is ignored by plain GINE; fixed at 4 to isolate the comparison.
  mol_gnn_type:
    values: [GINE, GINE_GSA]

  # Test whether JSS+sqrt benefits from more mol encoder capacity.
  mol_hidden_size:
    values: [384, 512]

  lr:
    distribution: log_uniform_values
    min: 0.0002
    max: 0.001

  weight_decay:
    values: [0.0, 0.001, 0.01]

  mol_dropout:
    values: [0.1, 0.2, 0.3]

  frag_dropout:
    values: [0.1, 0.2]

  mlp_dropout:
    values: [0.1, 0.3, 0.4]

  # JSS already acts like an entropy-aware divergence; test whether additional
  # entropy regularization is redundant or complementary.
  node_normalized_entropy_weight:
    values: [0.0, 0.01]
