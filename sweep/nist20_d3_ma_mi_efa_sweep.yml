entity: frag-gnn
project: frag-gnn
program: ~/fragnnet/scripts/run_wandb_sweep.py
method: random
name: nist20_d3_ma_mi_efa
description: >
  Sweep for GINE_EFA mol encoder (global linear attention augmenting GINE).
  EFA trains with ~5% lower train loss than GINE baseline but val loss is
  currently similar — sweeping regularization, LR, and num_heads to close
  the train/val gap and unlock the capacity benefit.
  Architecture fixed: mol_hidden=384, mol_num_layers=4, frag_pool=max.
metric:
  goal: maximize
  name: val_cos_sim_0.01_epoch/mean

parameters:
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.0008

  weight_decay:
    values: [0.001, 0.01, 0.1]

  mol_dropout:
    values: [0.0, 0.1, 0.2, 0.3]

  frag_dropout:
    values: [0.1, 0.2]

  mlp_dropout:
    values: [0.2, 0.3, 0.4]

  # EFA-specific: number of attention heads (all divide mol_hidden_size=384)
  # 1 = ablate multi-head (single global pool), 4 = current default, 8 = finer subspaces
  mol_num_heads:
    values: [1, 2, 4, 8]
