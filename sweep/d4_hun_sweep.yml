entity: frag-gnn
project: frag-gnn
program: /h/adamo/frag-gnn/scripts/run_wandb_sweep.py
method: random
name: d4_hun_sweep
description: Optimize FRAG-GNN-D4 hyperparameters for cosine hungarian loss
metric:
  goal: maximize
  name: val_cos_hun_best/mean
parameters:
  # general optimization
  lr:
    distribution: log_uniform_values
    min: 0.0001 # -9.21034 == np.log(0.0001)
    max: 0.01 # -4.60517 == np.log(0.01)
  weight_decay:
    values: [0.,0.001,0.01,0.1]
  lr_schedule:
    values: [True,False]
  lr_decay_rate:
    distribution: uniform
    min: 0.7
    max: 1.0
  accumulate_grad_batches:
    values: [1,2,4,8]